<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coleções por Perfil | Sposence</title>
  <link rel="shortcut icon" href="ID. VISUAL SPOSENCE/Imagens/LOGOS/Logo Secundária/Logo Secundária- SPOSENCE-15.png" type="image/x-icon" />
  <meta name="description" content="Explore as coleções Sposence por perfil olfativo: frescos, doces, noturnos e elegantes." />
  <link rel="preload" as="font" href="fonts/Philosopher-Regular.woff2" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="img/simbolo-loader.png" />
  <link rel="preload" as="image" href="img/logo-navbar.png" />
  <!-- Abertura da primeira visita (símbolo + nome da marca); define window.spLoaded -->
  <script src="js/intro.js?v=20261014c"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=20261014c" />
  <link rel="stylesheet" href="css/animations.css?v=20261014c" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="css/brand.css?v=20261025" />
  <link rel="stylesheet" href="css/pages.css?v=20261014c" />
</head>
<body class="sp">

  <div id="scroll-progress"></div>
  <div id="navbar-mount"></div>
  <div id="cart-mount"></div>
  <div id="toast-mount"></div>

  <main>

    <section class="sp-hero">
      <div class="sp-hero__mark" aria-hidden="true"><img src="ID. VISUAL SPOSENCE/Imagens/LOGOS/Logo Secundária/Logo Secundária- SPOSENCE-14.png" alt="" decoding="async"></div>
      <div class="h-wrap">
        <div class="sp-hero__copy">
          <span class="h-eyebrow" data-intro>Coleções</span>
          <h1 class="sp-hero__title">Quatro perfis, <em>quatro atmosferas.</em></h1>
          <p class="h-lead" data-intro>Cada coleção reúne as fragrâncias da mesma família olfativa. Encontre a que fala com quem você é.</p>
        </div>
      </div>
    </section>

    <section class="h-section" style="padding-top:clamp(1rem, 3vw, 2rem)" aria-label="Perfis olfativos">
      <div class="h-wrap" id="colecoes-mount"></div>
    </section>

    <section class="h-section h-section--tint">
      <div class="h-wrap sp-cta">
        <h2 class="h-title">Ainda em dúvida? <em>Comece pelo layering.</em></h2>
        <div class="sp-cta__actions" data-reveal>
          <a href="layering.html" class="h-btn h-btn--primary" data-magnetic>Ver guia de layering <i class="ph ph-arrow-right" aria-hidden="true"></i></a>
          <a href="produtos.html" class="h-btn h-btn--ghost" data-magnetic>Catálogo completo</a>
        </div>
      </div>
    </section>

  </main>

  <div id="footer-mount"></div>

  <script src="js/data.js?v=20261014c"></script>
  <script src="/api/catalogo.js"></script>
  <script src="js/estoque-online.js?v=20261020"></script>
  <script src="js/app.js?v=20261025"></script>
  <script>
    document.getElementById('navbar-mount').innerHTML = buildNavbar('colecoes.html');
    document.getElementById('cart-mount').innerHTML   = buildCart();
    document.getElementById('toast-mount').innerHTML  = buildToastContainer();
    document.getElementById('footer-mount').innerHTML = buildFooter();

    // Frasco que aparece na foto de cada coleção (sem escolha, usa o primeiro com foto)
    const COVERS = {
      elegantes: 'coco-mademoiselle',
      doces: 'italica',
      noturnos: 'tobacco-vanille',
    };

    // Um capítulo por perfil, com os elegantes primeiro
    const sentence = (s) => s.replace(/\s+—\s+(\S)/g, (_, c) => `. ${c.toUpperCase()}`);
    const profiles = [...SPOSENCE_DATA.fragrance_profiles].sort((a, b) => (b.id === 'elegantes') - (a.id === 'elegantes'));

    document.getElementById('colecoes-mount').innerHTML = profiles.map((profile, i) => {
      const perfumes = SPOSENCE_DATA.perfumes.filter(p => p.profile === profile.id);
      const cover = perfumes.find(p => p.id === COVERS[profile.id] && p.image) || perfumes.find(p => p.image);
      return `
      <article class="sp-chapter" id="${profile.id}">
        <div class="sp-frame sp-chapter__media" data-curtain>
          ${cover ? `<img src="${cover.image}" alt="" loading="lazy" decoding="async">` : ''}
          <a href="produtos.html?cat=perfumes&profile=${profile.id}" class="sp-chapter__all" aria-label="Ver perfumes ${profile.label.toLowerCase()}"></a>
          ${cover ? `
          <a href="produto.html?id=${cover.id}" class="sp-chapter__pick">
            <span><small>Em destaque</small><strong>${cover.name}</strong></span>
            <i class="ph ph-arrow-up-right" aria-hidden="true"></i>
          </a>` : ''}
        </div>
        <div>
          <span class="sp-chapter__index" data-reveal>${String(i + 1).padStart(2, '0')} · ${perfumes.length} fragrâncias</span>
          <h2 class="h-title">${profile.label}</h2>
          <p class="h-lead">${sentence(profile.description)}</p>
          <div class="sp-names" data-stagger>
            ${perfumes.map(p => `
              <a href="produto.html?id=${p.id}">
                <img src="${spThumb(p.image) || SP_BRAND_MARK}" alt="" loading="lazy" decoding="async">
                <span>${p.name}<small>Inspirado em ${p.inspired_by}</small></span>
                <i class="ph ph-arrow-right" aria-hidden="true"></i>
              </a>`).join('')}
          </div>
          <a href="produtos.html?cat=perfumes&profile=${profile.id}" class="h-btn h-btn--primary" data-reveal data-magnetic>Explorar ${profile.label.toLowerCase()} <i class="ph ph-arrow-right" aria-hidden="true"></i></a>
        </div>
      </article>`;
    }).join('');
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/motion.js?v=20261014c"></script>
  <script>
    SpMotion.auto();
    // O botão do perfume em destaque sobe logo depois da cortina da foto
    if (SpMotion.enabled) {
      document.querySelectorAll('.sp-chapter__pick').forEach((pick) => {
        gsap.from(pick, { autoAlpha: 0, y: 24, duration: 1, ease: SpMotion.EASE, delay: 0.7, clearProps: 'transform', scrollTrigger: SpMotion.onEnter(pick.parentElement, 'top 90%') });
      });
    }
  </script>
</body>
</html>
