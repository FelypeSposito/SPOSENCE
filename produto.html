<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produto | Sposence</title>
  <link rel="shortcut icon" href="ID. VISUAL SPOSENCE/Imagens/LOGOS/Logo Secundária/Logo Secundária- SPOSENCE-15.png" type="image/x-icon" />
  <meta name="description" content="Detalhes do produto Sposence: notas olfativas, tamanhos e combinações de layering." />
  <link rel="preload" as="font" href="fonts/Philosopher-Regular.woff2" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="img/simbolo-loader.png" />
  <link rel="preload" as="image" href="img/logo-navbar.png" />
  <!-- Abertura da primeira visita (símbolo + nome da marca); define window.spLoaded -->
  <script src="js/intro.js?v=20261014c"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=20261014c" />
  <link rel="stylesheet" href="css/animations.css?v=20261014c" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="css/brand.css?v=20261028" />
  <link rel="stylesheet" href="css/pages.css?v=20261014c" />
</head>
<body class="sp">

  <div id="scroll-progress"></div>
  <div id="navbar-mount"></div>
  <div id="cart-mount"></div>
  <div id="toast-mount"></div>

  <main>

    <section class="sp-hero sp-hero--tight">
      <div class="h-wrap">
        <nav class="sp-crumbs" aria-label="Você está em" data-intro>
          <a href="index.html">Início</a><span aria-hidden="true">/</span>
          <a href="produtos.html">Catálogo</a><span aria-hidden="true">/</span>
          <span id="crumb-name" aria-current="page">Produto</span>
        </nav>
        <div class="sp-product" id="product-mount"></div>
      </div>
    </section>

    <section class="h-section h-section--tint" id="kit-section" aria-labelledby="kit-title" hidden>
      <div class="h-wrap">
        <div class="h-head">
          <div>
            <span class="h-eyebrow">Layering</span>
            <h2 id="kit-title" class="h-title">Complete <em>sua essência.</em></h2>
            <p class="h-lead" style="margin-top:1rem" id="kit-desc"></p>
          </div>
          <div class="h-head__actions">
            <a href="layering.html" class="h-link">Como fazer layering <i class="ph ph-arrow-right" aria-hidden="true"></i></a>
          </div>
        </div>
        <div class="h-grid" id="kit-grid" data-stagger></div>
      </div>
    </section>

    <section class="h-section" id="related-section" aria-labelledby="related-title" hidden>
      <div class="h-wrap">
        <div class="h-head">
          <div>
            <span class="h-eyebrow">Você também pode gostar</span>
            <h2 id="related-title" class="h-title">Fragrâncias <em>parecidas.</em></h2>
          </div>
          <div class="h-head__actions">
            <a href="produtos.html" class="h-link">Ver catálogo completo <i class="ph ph-arrow-right" aria-hidden="true"></i></a>
          </div>
        </div>
        <div class="h-grid" id="related-grid" data-stagger></div>
      </div>
    </section>

  </main>

  <div id="footer-mount"></div>

  <script src="js/data.js?v=20261027"></script>
  <script src="/api/catalogo.js"></script>
  <script src="js/estoque-online.js?v=20261020"></script>
  <script src="js/app.js?v=20261028"></script>
  <script>
    document.getElementById('navbar-mount').innerHTML = buildNavbar('produtos.html');
    document.getElementById('cart-mount').innerHTML   = buildCart();
    document.getElementById('toast-mount').innerHTML  = buildToastContainer();
    document.getElementById('footer-mount').innerHTML = buildFooter();

    // ---- Produto pela URL (aceita id ou nome aproximado) ----
    const clean = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const target = clean(new URLSearchParams(location.search).get('id'));
    const ALL = getAllProducts();
    const product = target && ALL.find(p => {
      const id = clean(p.id), name = clean(p.name);
      return id === target || name === target || id.includes(target) || target.includes(id);
    });
    const mount = document.getElementById('product-mount');
    // ?v=Baunilha: abre com essa fragrância/tamanho já escolhido (ex.: vindo de um kit)
    const wanted = new URLSearchParams(location.search).get('v');
    if (product && wanted && product.variants) {
      const i = product.variants.findIndex(v => v.size === wanted && !spSoldOut(v));
      if (i >= 0) spPicked[product.id] = i;
    }

    if (!product) {
      mount.style.display = 'block';
      mount.innerHTML = `
        <div class="sp-empty">
          <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          <h1 class="h-title" style="margin-bottom:0.5rem">Produto não encontrado.</h1>
          <p>O link pode estar desatualizado. Veja tudo o que temos no catálogo.</p>
          <a href="produtos.html" class="h-btn h-btn--primary">Ir para o catálogo</a>
        </div>`;
    } else {
      document.title = `${product.name} | Sposence`;
      document.getElementById('crumb-name').textContent = product.name;

      const isPerfume = product.category === 'perfumes';
      const tagLabels = { masculino: 'Masculino', feminino: 'Feminino', compartilhavel: 'Unissex' };
      const chips = [
        spOnRequest(product) ? '<span class="h-chip h-chip--muted">Sob encomenda</span>' : spSoldOut(product) ? '<span class="h-chip h-chip--muted">Esgotado</span>' : '',
        product.last_units && !spSoldOut(product) ? '<span class="h-chip h-chip--last">Últimas unidades</span>' : '',
        product.profile ? `<span class="h-chip">${profileLabel(product.profile)}</span>` : '',
        ...(product.tags || []).filter(t => tagLabels[t]).map(t => `<span class="h-chip">${tagLabels[t]}</span>`),
        product.is_special_edition ? '<span class="h-chip">Edição especial</span>' : '',
      ].join('');

      const sizes = product.variants && product.variants.length > 1 ? `
        <div class="sp-block" data-intro>
          <div class="sp-block__title">${isPerfume ? 'Escolha o tamanho' : 'Escolha a opção'}</div>
          <div class="h-sizes${spNamedVariants(product) ? ' h-sizes--named' : ''}" role="group" aria-label="${spNamedVariants(product) ? 'Fragrância' : 'Tamanho'}">
            ${product.variants.map((v, i) => `<button class="h-size" type="button" data-pick="${i}" aria-pressed="${spVariant(product) === v}"${spSoldOut(v) ? ' data-soldout title="Esgotado"' : ''}>${v.size}</button>`).join('')}
          </div>
        </div>` : '';

      const notes = product.notes ? `
        <div class="sp-block" data-intro>
          <div class="sp-block__title">Pirâmide olfativa</div>
          <dl class="sp-notes">
            <div><dt>Topo</dt><dd>${product.notes.top}</dd></div>
            <div><dt>Coração</dt><dd>${product.notes.heart}</dd></div>
            <div><dt>Fundo</dt><dd>${product.notes.base}</dd></div>
          </dl>
        </div>` : '';

      const ingredients = isPerfume ? (SPOSENCE_DATA.technical_schema?.inventory_data?.perfumery?.base_ingredients || []) : [];
      const composition = ingredients.length ? `
        <div class="sp-block" data-intro>
          <div class="sp-block__title">Composição</div>
          <div class="sp-tags">${ingredients.map(i => `<span>${i}</span>`).join('')}</div>
        </div>` : '';

      mount.innerHTML = `
        <div class="sp-product__media">
          <div class="sp-hero__frame" data-intro-media>
            ${product.image
              ? `<img src="${product.image}" alt="${product.name}" fetchpriority="high" loading="eager" decoding="async"
                   onerror="this.replaceWith(Object.assign(document.createElement('img'), { src: SP_BRAND_MARK, alt: '', style: 'object-fit:contain;padding:25%;opacity:.35' }))">`
              : `<img src="${SP_BRAND_MARK}" alt="" style="object-fit:contain;padding:25%;opacity:.35">`}
          </div>
        </div>
        <div class="sp-product__info">
          <span class="h-eyebrow" data-intro>Sposence · ${product.profile ? profileLabel(product.profile) : SP_CATEGORY[product.category] || 'Produto'}</span>
          <h1 class="sp-hero__title">${product.name}</h1>
          ${product.inspired_by ? `<p class="sp-product__inspired" data-intro>Inspirado em ${product.inspired_by}</p>` : ''}
          <div class="sp-product__chips" data-intro>${chips}</div>
          <p class="h-lead" data-intro>${product.description || ''}</p>
          ${product.last_units ? `
          <p class="sp-note sp-note--last" data-intro><i class="ph ph-hourglass-medium" aria-hidden="true"></i><span><strong>Últimas unidades.</strong> Este perfume vai sair de catálogo. Restam: ${product.variants.filter(v => v.stock > 0).map(v => `${v.stock}x ${v.size}`).join(', ') || 'nenhuma'}.</span></p>` : ''}
          ${sizes}
          <div class="sp-buy" data-intro id="buy-box"></div>
          ${notes}
          ${composition}
          ${isPerfume ? `<p class="sp-note" data-intro><i class="ph ph-gift" aria-hidden="true"></i><span>Acompanha uma <strong>mini sacola de algodão cru</strong> como brinde de proteção em todos os pedidos.</span></p>` : ''}
          <a href="produtos.html" class="h-link sp-back" data-intro><i class="ph ph-arrow-left" aria-hidden="true"></i> Voltar ao catálogo</a>
        </div>`;

      // Preço e botão acompanham o tamanho escolhido
      function renderBuy() {
        const v = spVariant(product);
        const off = spSoldOut(product) || spSoldOut(v);
        document.getElementById('buy-box').innerHTML = `
          <div class="sp-buy__price">${spPriceText(product, v ? v.price : product.price || 0)}<small>${v ? v.size : (product.volume || '')}${spOnRequest(product) ? ' · preço sob consulta' : off ? ' · esgotado' : spLeftLabel(v) ? ` · ${spLeftLabel(v).toLowerCase()}` : isPerfume ? ' · 27% de essência' : ''}</small></div>
          ${spOnRequest(product)
            ? `<a class="h-btn h-btn--primary" href="${spOrderUrl(product, v)}" target="_blank" rel="noopener">Encomendar pelo WhatsApp <i class="ph ph-whatsapp-logo" aria-hidden="true"></i></a>`
            : `<button type="button" class="h-btn h-btn--primary" data-add="${product.id}" ${off ? 'disabled' : ''}>
            ${off ? 'Indisponível no momento' : 'Adicionar ao carrinho <i class="ph ph-shopping-bag" aria-hidden="true"></i>'}
          </button>`}`;
      }
      renderBuy();

      // Celular: barra de compra fixa quando o bloco de compra sai da tela
      const bar = document.createElement('div');
      bar.className = 'sp-buybar';
      bar.setAttribute('aria-hidden', 'true');
      document.body.appendChild(bar);
      const renderBar = () => {
        const v = spVariant(product);
        const off = spSoldOut(product) || spSoldOut(v);
        bar.innerHTML = `
          <div class="sp-buybar__info">
            <div class="sp-buybar__name">${product.name}</div>
            <div class="sp-buybar__price">${spPriceText(product, v ? v.price : product.price || 0)} <small>${v ? v.size : ''}</small></div>
          </div>
          ${spOnRequest(product)
            ? `<a class="h-btn h-btn--primary" href="${spOrderUrl(product, v)}" target="_blank" rel="noopener" tabindex="-1">Encomendar</a>`
            : `<button type="button" class="h-btn h-btn--primary" data-add="${product.id}" tabindex="-1" ${off ? 'disabled' : ''}>${off ? 'Esgotado' : 'Adicionar'}</button>`}`;
      };
      renderBar();
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(([entry]) => {
          const show = !entry.isIntersecting && entry.boundingClientRect.top < 0;
          bar.classList.toggle('is-on', show);
          document.body.classList.toggle('has-buybar', show);
        }).observe(document.getElementById('buy-box'));
      }

      mount.addEventListener('click', (e) => {
        const size = e.target.closest('[data-pick]');
        if (!size) return;
        spPicked[product.id] = Number(size.dataset.pick);
        mount.querySelectorAll('[data-pick]').forEach(b => b.setAttribute('aria-pressed', b === size));
        renderBuy();
        renderBar();
      });

      // ---- Kit de layering do mesmo perfil ----
      const kit = SPOSENCE_DATA.layering.find(k => k.perfume_ids?.includes(product.id)) || SPOSENCE_DATA.layering.find(k => k.tag === product.profile);
      if (kit) {
        const kitItems = [
          ...kit.perfume_ids.filter(id => id !== product.id).slice(0, 2),
          ...kit.skincare_ids, ...kit.splash_ids,
        ].map(id => ALL.find(p => p.id === id)).filter(Boolean);
        document.getElementById('kit-desc').textContent = `${kit.title}: ${kit.description}`;
        document.getElementById('kit-grid').innerHTML = kitItems.map(p => spCard(p)).join('');
        document.getElementById('kit-section').hidden = false;
      }

      // ---- Parecidos: mesmo perfil ou mesmas tags ----
      const related = SPOSENCE_DATA.perfumes
        .filter(p => p.id !== product.id && (p.profile === product.profile || p.tags?.some(t => product.tags?.includes(t))))
        .slice(0, 4)
        .map(p => ({ ...p, category: 'perfumes' }));
      if (related.length) {
        document.getElementById('related-grid').innerHTML = related.map(p => spCard(p)).join('');
        document.getElementById('related-section').hidden = false;
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/motion.js?v=20261014c"></script>
  <script>SpMotion.auto();</script>
</body>
</html>
