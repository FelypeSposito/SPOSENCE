function folhaPedItem(id) {
  const grupos = {};
  est.catalogo.forEach((p) => { (grupos[p.rotulo] ||= []).push(p); });
  const opcoes = Object.entries(grupos).map(([rotulo, itens]) => `<optgroup label="${esc(rotulo)}">${itens.map((p) => `<option value="${esc(p.id)}">${esc(p.nome)}</option>`).join('')}</optgroup>`).join('');
  abrirFolha('Adicionar item', `${voltarPedido(id)}
    <form data-form="ped-item" data-id="${esc(id)}">
      <label for="pi-prod">Produto</label>
      <select id="pi-prod" name="produto">${opcoes}<option value="__livre">Outro item (digitar)</option></select>
      <div id="pi-livre" hidden><label for="pi-nome">Nome do item</label><input id="pi-nome" name="nome" maxlength="80" placeholder="Ex.: Caixa de presente" /></div>
      <div class="grade2">
        <div id="pi-tam-box"><label for="pi-tam">Tamanho</label><select id="pi-tam" name="tamanho"></select></div>
        <div><label for="pi-qtd">Quantidade</label><input id="pi-qtd" name="qtd" type="number" min="1" value="1" inputmode="numeric" required /></div>
      </div>
      <label for="pi-preco">Preço de cada um (R$)</label><input id="pi-preco" name="preco" inputmode="decimal" required />
      <p class="ajuda" id="pi-dica"></p>
      <button class="btn primario cheio" type="submit" style="margin-top:24px">Adicionar ao pedido</button>
    </form>`);
  atualizarItemPedido();
}
function atualizarItemPedido(origem) {
  const sel = $('pi-prod');
  if (!sel) return;
  const livre = sel.value === '__livre';
  $('pi-livre').hidden = !livre;
  $('pi-nome').required = livre;
  const p = est.catalogo.find((x) => x.id === sel.value);
  const tams = p ? p.variantes.filter((v) => v.tamanho !== 'unico') : [];
  $('pi-tam-box').hidden = livre || !tams.length;
  if (origem !== 'tamanho') $('pi-tam').innerHTML = tams.map((v) => `<option value="${esc(v.tamanho)}">${esc(v.tamanho)}</option>`).join('');
  const atual = p ? (p.variantes.find((v) => v.tamanho === ($('pi-tam-box').hidden ? 'unico' : $('pi-tam').value)) || p.variantes[0]) : null;
  if (atual && origem !== 'preco') $('pi-preco').value = String(atual.preco).replace('.', ',');
  if (livre && origem !== 'preco') $('pi-preco').value = '';
  $('pi-dica').textContent = p && p.categoria === 'perfumes' && p.controlado
    ? 'Perfumes de 30 ml e 50 ml descontam do estoque e dos insumos.' : (livre ? 'Item sem controle de estoque.' : '');
}

/* ----- eventos dos pedidos ----- */
document.addEventListener('keydown', (ev) => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('article.ped')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', async (ev) => {
  const t = ev.target;
  if (t.id === 'ped-forma') {
    try { await api('pedido_forma', { id: t.dataset.id, forma: t.value }); aviso('Forma de pagamento salva.'); } catch (e) { falhou(e); }
  } else if (t.id === 'pi-prod') atualizarItemPedido();
  else if (t.id === 'pi-tam') atualizarItemPedido('tamanho');
  else if (t.id === 'pp-modo') $('pp-n-box').hidden = t.value !== 'parcelado';
});

/* ---------- maturação ---------- */
let vistaEstoque = 'prateleira';   // 'prateleira' | 'maturacao'
let animMat = true;                // a lista entra em sequência quando a aba é aberta
const dataBR = (s) => (s ? `${String(s).slice(8, 10)}/${String(s).slice(5, 7)}` : '');
const dataBRano = (s) => (s ? `${String(s).slice(8, 10)}/${String(s).slice(5, 7)}/${String(s).slice(0, 4)}` : '');
const somaDiasCli = (s, n) => { const [a, m, d] = s.split('-').map(Number); return new Date(Date.UTC(a, m - 1, d + n)).toISOString().slice(0, 10); };
const difDiasCli = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
const nDias = (n) => `${n} ${Math.abs(n) === 1 ? 'dia' : 'dias'}`;

const trocaEstoque = () => `<div class="troca troca-vista" role="group" aria-label="O que mostrar">
  <button type="button" data-act="vista-estoque" data-v="prateleira" aria-pressed="${vistaEstoque === 'prateleira'}">Na prateleira</button>
  <button type="button" data-act="vista-estoque" data-v="maturacao" aria-pressed="${vistaEstoque === 'maturacao'}">Em maturação <small>${est.maturacao.filter((l) => l.status === 'maturando').length}</small></button>
  <button type="button" data-act="vista-estoque" data-v="insumos" aria-pressed="${vistaEstoque === 'insumos'}">Insumos${est.insumos.some((i) => i.acabando) ? ' <small>!</small>' : ''}</button></div>`;

function cartaoLote(l, i) {
  const feito = l.status === 'concluido';
  const pronto = !feito && l.dias_restantes <= 0;
  const rotulo = feito ? 'No estoque' : pronto ? 'Pronto' : 'Maturando';
  const st = feito ? 'entregue' : pronto ? 'pronto' : 'separando';
  const legenda = feito ? `foi para o estoque em ${dataBR(String(l.concluido_em).slice(0, 10))}${l.ml_entrada && l.ml_entrada !== l.ml ? `, com ${nf.format(l.ml_entrada)} ml` : ''}`
    : l.dias_restantes > 0 ? `faltam ${nDias(l.dias_restantes)}`
    : l.dias_restantes === 0 ? 'fica pronto hoje'
    : `pronto há ${nDias(-l.dias_restantes)}`;
  return `<li class="lote${pronto ? ' pronto' : ''}${feito ? ' feito' : ''}" style="--i:${i}">
    <div class="ped-topo"><h3 class="ped-nome">${esc(l.nome)}</h3><span class="chip-st" data-st="${st}">${rotulo}</span></div>
    <div class="qtd">${nf.format(l.ml)}<em>ml</em></div>
    <div class="lote-datas">
      <span><small>começou</small>${dataBR(l.inicio)}</span>
      <span><small>${feito ? 'ficou pronto' : 'fica pronto'}</small>${dataBR(l.previsto)}</span>
      <span><small>maturação</small>${nDias(l.dias)}</span>
    </div>
    <div class="pg"><div class="pg-linha"><span class="${pronto ? 'pago-selo' : ''}">${esc(legenda)}</span><span>${Math.round(l.progresso * 100)}%</span></div><div class="pg-barra" aria-hidden="true"><i style="--p:${l.progresso.toFixed(3)}"></i></div></div>
    ${l.obs ? `<p class="detalhe" style="margin-top:12px">${esc(l.obs)}</p>` : ''}
    <div class="acoes">
      ${feito ? '' : `<button class="btn ${pronto ? 'primario ' : ''}pequeno" type="button" data-act="mat-concluir" data-id="${esc(l.id)}">Colocar no estoque</button>
      <button class="btn pequeno" type="button" data-act="mat-editar" data-id="${esc(l.id)}">Editar</button>
      <button class="btn pequeno" type="button" data-act="mat-chamar" data-id="${esc(l.id)}">Quem chamar</button>`}
      <button class="btn pequeno" type="button" data-act="mat-excluir" data-id="${esc(l.id)}">Excluir</button>
    </div>
  </li>`;
}

function desenharMaturacao() {
  const ativos = est.maturacao.filter((l) => l.status === 'maturando');
  const feitos = est.maturacao.filter((l) => l.status === 'concluido');
  const mlTotal = ativos.reduce((t, l) => t + l.ml, 0);
  const prontos = ativos.filter((l) => l.dias_restantes <= 0).length;
  const ultimo = ativos.reduce((m, l) => (l.previsto > m ? l.previsto : m), '');
  const diasAteTodos = ultimo ? difDiasCli(est.hoje, ultimo) : 0;
  const el = $('t-estoque');
  el.classList.toggle('anim', animMat);
  el.innerHTML = `
    <div class="secao-topo"><h2 id="h-estoque">Estoque</h2><p class="legenda">essência em ml, do granel ao frasco</p></div>
    ${trocaEstoque()}
    ${ativos.length ? `<div class="total">
        <div class="num">${nf.format(mlTotal)}<em>ml</em></div>
        <p>de essência maturando, em <b>${ativos.length}</b> ${ativos.length === 1 ? 'lote' : 'lotes'}.
        ${prontos === ativos.length ? ` <b>Tudo pronto</b> para colocar no estoque.` : prontos ? ` <b>${prontos}</b> já ${prontos === 1 ? 'está pronto' : 'estão prontos'}.` : ''}
        ${ativos.length > 1 && diasAteTodos > 0 ? ` A linha completa fica pronta em <b>${dataBRano(ultimo)}</b>, daqui a ${nDias(diasAteTodos)}.` : ''}
        ${ativos.length === 1 && diasAteTodos > 0 ? ` Fica pronto em <b>${dataBRano(ultimo)}</b>.` : ''}</p>
      </div>` : ''}
    <button class="btn primario" data-act="mat-novo" type="button">${IC_MAIS} Novo lote em maturação</button>
    ${ativos.length ? `<ul class="mat-lista">${ativos.map((l, i) => cartaoLote(l, i)).join('')}</ul>`
      : '<div class="vazio"><span class="simbolo"></span><b>Nada maturando agora</b>Registre cada lote com a data em que começou e os dias de maturação. O painel mostra quanto falta e quando dá para lançar.</div>'}
    ${feitos.length ? `<h3 class="sub-titulo">Já foram para o estoque</h3><ul class="mat-lista mat-feitos">${feitos.map((l, i) => cartaoLote(l, i)).join('')}</ul>` : ''}`;
  animMat = false;
}

/* ----- janelas do lote ----- */
function folhaLote(id) {
  const l = id ? est.maturacao.find((x) => x.id === id) : null;
  const opcoes = est.perfumes.map((p) => `<option value="${esc(p.id)}"${l && l.produto_id === p.id ? ' selected' : ''}>${esc(p.nome)}</option>`).join('');
  const livre = l ? !l.produto_id : !est.perfumes.length;
  abrirFolha(l ? 'Editar lote' : 'Novo lote em maturação', `
    <form data-form="mat-lote" data-id="${esc(id || '')}">
      <label for="ml-prod">Perfume</label>
      <select id="ml-prod" name="produto_id">${opcoes}<option value=""${livre ? ' selected' : ''}>Outro (ainda não cadastrado)</option></select>
      <div id="ml-livre"${livre ? '' : ' hidden'}><label for="ml-nome">Nome do perfume</label><input id="ml-nome" name="nome" value="${esc(l && !l.produto_id ? l.nome : '')}" maxlength="80" placeholder="Ex.: Dior J'adore" /></div>
      <div class="grade2">
        <div><label for="ml-ml">Quantos ml</label><input id="ml-ml" name="ml" type="number" min="1" inputmode="numeric" required value="${l ? l.ml : ''}" placeholder="180" /></div>
        <div><label for="ml-ini">Começou em</label><input id="ml-ini" name="inicio" type="date" required value="${l ? l.inicio : est.hoje}" /></div>
      </div>
      <label for="ml-dias">Dias de maturação</label>
      <input id="ml-dias" name="dias" type="number" min="1" max="365" inputmode="numeric" required value="${l ? l.dias : 30}" />
      <div class="escolha" id="ml-atalhos" style="column-gap:20px;flex-wrap:wrap">${[15, 30, 45, 60].map((n) => `<button type="button" data-dias="${n}" aria-pressed="false">${n} dias</button>`).join('')}</div>
      <p class="ajuda" id="ml-previsto" aria-live="polite"></p>
      <label for="ml-obs">Observação (opcional)</label>
      <input id="ml-obs" name="obs" maxlength="200" value="${esc(l ? l.obs : '')}" placeholder="Ex.: lote do fornecedor novo" />
      <button class="btn primario cheio" type="submit" style="margin-top:28px">${l ? 'Salvar lote' : 'Registrar lote'}</button>
    </form>`);
  atualizarPrevisto();
}
function atualizarPrevisto() {
  const ini = $('ml-ini'), dias = $('ml-dias');
  if (!ini || !dias) return;
  $('ml-livre').hidden = $('ml-prod').value !== '';
  $('ml-nome').required = $('ml-prod').value === '';
  document.querySelectorAll('#ml-atalhos button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.dias === dias.value));
  const n = Number(dias.value);
  if (!ini.value || !n) { $('ml-previsto').textContent = ''; return; }
  const previsto = somaDiasCli(ini.value, n);
  const falta = difDiasCli(est.hoje, previsto);
  $('ml-previsto').textContent = `Fica pronto em ${dataBRano(previsto)}${falta > 0 ? `, daqui a ${nDias(falta)}` : falta === 0 ? ', hoje' : `, há ${nDias(-falta)}`}.`;
}

function folhaConcluirLote(id) {
  const l = est.maturacao.find((x) => x.id === id);
  const parecido = est.perfumes.find((p) => l.produto_id === p.id) || est.perfumes.find((p) => p.nome.toLowerCase() === l.nome.toLowerCase());
  abrirFolha('Colocar no estoque', `
    <form data-form="mat-concluir" data-id="${esc(id)}">
      <p class="legenda" style="margin-top:4px">${esc(l.nome)}, ${nf.format(l.ml)} ml maturados</p>
      <label for="mc-prod">Entra em qual perfume do catálogo</label>
      <select id="mc-prod" name="produto_id" required>${parecido ? '' : '<option value="" disabled selected>Escolha o perfume</option>'}${est.perfumes.map((p) => `<option value="${esc(p.id)}"${parecido && parecido.id === p.id ? ' selected' : ''}>${esc(p.nome)}</option>`).join('')}</select>
      <p class="ajuda">Ainda não cadastrou? Crie em Catálogo, Novo, e volte aqui.</p>
      <label for="mc-ml">Quantos ml entram no estoque</label>
      <input id="mc-ml" name="ml" type="number" min="1" inputmode="numeric" required value="${l.ml}" />
      <p class="ajuda">Se perdeu um pouco na filtragem, ajuste aqui. Os ml entram como granel, prontos para envasar.</p>
      <button class="btn primario cheio" type="submit" style="margin-top:28px"${est.perfumes.length ? '' : ' disabled'}>Colocar no estoque</button>
    </form>`);
}

/* ----- eventos da maturação ----- */
document.addEventListener('input', (ev) => { if (ev.target.id === 'ml-ini' || ev.target.id === 'ml-dias') atualizarPrevisto(); });
document.addEventListener('change', (ev) => { if (ev.target.id === 'ml-prod') atualizarPrevisto(); });
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('#ml-atalhos [data-dias]');
  if (b) { $('ml-dias').value = b.dataset.dias; atualizarPrevisto(); }
});


/* ---------- clientes ---------- */
let cli = null;              // { lista, chamar } vindos do servidor
let cliVelho = true;         // os pedidos mudaram: buscar de novo
let vistaCli = 'clientes';   // 'clientes' | 'lancamento'
const filtroCli = { busca: '', perfil: 'todos' };
const lancForm = { alvo: '', perfil: 'doces', publico: 'feminino', notas: '', nome: '' };
let lanc = null;             // resultado do último simulador de lançamento
let animCli = true;
const PERFIS_ORDEM = ['doces', 'frescos', 'noturnos', 'elegantes'];
const SING_PERFIL = { doces: 'doce', frescos: 'fresco', noturnos: 'noturno', elegantes: 'elegante' };
const qtdPerfil = (k, n) => n + ' ' + (n === 1 ? SING_PERFIL[k] : k);
const ROT_PERFIL = { doces: 'doces', frescos: 'frescos', noturnos: 'noturnos', elegantes: 'elegantes', 'sem perfil': 'sem compras ainda' };
const ROT_AFIN = { alta: 'Alta', media: 'Média', baixa: 'Baixa', 'sem dados': 'Sem dados' };
const normalNome = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const primeiroNome = (n) => String(n || '').trim().split(/\s+/)[0] || '';
const assinaturaPed = () => (est ? `${est.pedidos.length}|${est.pedidos.map((p) => p.id + p.status + p.total).join(',')}` : '');
const dinInt = (n) => 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const quandoDias = (d) => (d === 0 ? 'hoje' : d === 1 ? 'ontem' : `há ${d} dias`);

async function carregarClientes(forcar) {
  if (!forcar && cli && !cliVelho) return;
  try {
    const d = await api('clientes');
    cli = d.clientes; cliVelho = false;
    desenharClientes();
  } catch (e) { if (!$('t-clientes').hidden) falhou(e); }
}

/* ----- peças visuais ----- */
function barraGosto(perfil) {
  const ativos = PERFIS_ORDEM.filter((k) => perfil[k]);
  if (!ativos.length) return '<p class="gosto-vazio">sem compras de perfume ainda</p>';
  const legenda = ativos.map((k) => qtdPerfil(k, perfil[k])).join(', ');
  return `<div class="gosto" role="img" aria-label="Gosto: ${legenda}">${ativos.map((k) => `<i class="perfil-${k}" style="flex:${perfil[k]}"></i>`).join('')}</div>
    <p class="gosto-legenda">${ativos.map((k) => `<span><b class="perfil-${k}"></b>${qtdPerfil(k, perfil[k])}</span>`).join('')}</p>`;
}
const pilulaAfin = (rotulo, pts) => `<span class="afin" data-r="${esc(rotulo)}">${ROT_AFIN[rotulo]}${rotulo === 'sem dados' ? '' : ` · ${pts}`}</span>`;
const telefoneLink = (tel) => { const d = String(tel || '').replace(/\D/g, ''); return d.length >= 10 ? `https://wa.me/${d.startsWith('55') ? d : '55' + d}` : ''; };

/* ----- mensagens para WhatsApp (você revisa e envia) ----- */
const juntarMotivos = (m) => m.join(' e ').replace(/ e perfumes /g, ' e ');
function msgRecompra(c, r) {
  const quando = c.dias >= 25 ? 'Faz um tempinho desde o seu último pedido e lembrei de você. ' : '';
  const gosto = r && r.motivos && r.motivos.length ? `Como você curte ${juntarMotivos(r.motivos)}, acho que` : 'Acho que';
  return `Oi ${primeiroNome(c.nome)}, tudo bem? Aqui é da Sposence. ${quando}${r ? `${gosto} o ${r.nome} combina muito com você. Quer que eu separe um?` : 'Quer dar uma olhada nas novidades?'}`;
}
function msgLancamento(c, produto, motivos, inspirado) {
  const porque = motivos && motivos.length ? `porque você curte ${juntarMotivos(motivos)}` : 'porque combina com o seu gosto';
  return `Oi ${primeiroNome(c.nome)}, tudo bem? Aqui é da Sposence. Acabou de chegar o ${produto}${inspirado ? `, inspirado no ${inspirado}` : ''}. Pensei em você ${porque}. Quer experimentar?`;
}
const linkZap = (tel, texto) => { const base = telefoneLink(tel); return base ? `${base}?text=${encodeURIComponent(texto)}` : ''; };

/* ----- aba Clientes ----- */
function desenharClientes() {
  const el = $('t-clientes');
  const cabeca = `<header class="ped-cabeca">
      <div><span class="eyebrow">Painel de clientes</span><h2 id="h-clientes">Quem <em>compra</em> de você</h2>
      <p class="ped-lead">O gosto de cada cliente, calculado dos pedidos, e quem vale chamar agora.</p></div>
      <div class="ped-acoes"><div class="troca troca-vista" role="group" aria-label="O que mostrar">
        <button type="button" data-act="cli-vista" data-v="clientes" aria-pressed="${vistaCli === 'clientes'}">Clientes</button>
        <button type="button" data-act="cli-vista" data-v="lancamento" aria-pressed="${vistaCli === 'lancamento'}">Simular lançamento</button></div></div>
    </header>`;
  if (!cli) { el.innerHTML = cabeca + '<p class="legenda">carregando os clientes…</p>'; return; }
  el.classList.toggle('anim', animCli);
  const lista = cli.lista;
  const gastoTotal = lista.reduce((t, c) => t + c.gasto, 0);
  const pedidosTotal = lista.reduce((t, c) => t + c.n_pedidos, 0);
  const recorrentes = lista.filter((c) => c.n_pedidos >= 2).length;
  const metricas = `<div class="ped-resumo">
      <div class="ped-receber"><small>Para chamar agora</small><div class="num">${cli.chamar.length}</div><small>${cli.chamar.length ? 'passaram do ritmo de compra de cada um' : 'ninguém passou do ritmo ainda'}</small></div>
      <div class="ped-abertos"><small>Clientes</small><div class="num">${lista.length}</div><small>${recorrentes} ${recorrentes === 1 ? 'voltou' : 'voltaram'} a comprar</small></div>
      <div class="ped-mes"><small>Ticket médio</small><div class="num">${din(pedidosTotal ? gastoTotal / pedidosTotal : 0)}</div><small>por pedido</small></div>
    </div>`;
  el.innerHTML = cabeca + metricas + (vistaCli === 'lancamento' ? corpoLancamento() : corpoClientes());
  animCli = false;
}

function cartaoChamar(c, i) {
  const s = c.sugestao;
  return `<li><article class="cli-chamar" style="--i:${i}" data-act="cli-abrir" data-id="${esc(c.id)}" tabindex="0" role="button" aria-label="Abrir o cliente ${esc(c.nome)}">
    <div><h4 class="mini-nome">${esc(c.nome || 'Sem nome')}</h4>
    <p class="detalhe">Última compra ${quandoDias(c.dias)}${c.n_pedidos > 1 ? `, costuma comprar a cada ${c.ritmo} dias` : ''}.</p>
    ${s ? `<p class="detalhe" style="margin-top:6px">Sugestão: <b>${esc(s.nome)}</b> ${pilulaAfin(s.rotulo, s.afinidade)}</p>` : ''}</div>
    <button class="btn pequeno primario" type="button" data-act="cli-chamar" data-id="${esc(c.id)}">Chamar</button>
  </article></li>`;
}

function cartaoCliente(c, i) {
  return `<li><article class="cli" style="--i:${i}" data-act="cli-abrir" data-id="${esc(c.id)}" tabindex="0" role="button" aria-label="Abrir o cliente ${esc(c.nome)}">
    <div class="ped-topo"><div><span class="ped-num">${c.lead ? 'contato do site' : `${c.n_pedidos} ${c.n_pedidos === 1 ? 'pedido' : 'pedidos'}, ${dinInt(c.gasto)}`}</span><h3 class="ped-nome">${esc(c.nome || 'Sem nome')}</h3></div>
      ${c.contato.nao_chamar ? '<span class="chip-st" data-st="cancelado">Não chamar</span>' : c.consent === 'sem_aceite' ? '<span class="chip-st" data-st="cancelado">Sem aceite</span>' : c.consent === 'aceitou' ? '<span class="chip-st" data-st="pronto">Aceitou contato</span>' : ''}</div>
    ${barraGosto(c.perfil)}
    ${c.notas.length ? `<p class="chips-notas">${c.notas.map((n) => `<span class="chip">${esc(n.rotulo)}</span>`).join('')}</p>` : ''}
    <div class="ped-pe"><span class="ped-origem">${c.lead ? 'conta criada' : 'última compra'} ${quandoDias(c.dias)}</span>${c.recomendacoes[0] ? `<span class="detalhe">${esc(c.recomendacoes[0].nome)} ${pilulaAfin(c.recomendacoes[0].rotulo, c.recomendacoes[0].afinidade)}</span>` : ''}</div>
  </article></li>`;
}

function corpoClientes() {
  const b = normalNome(filtroCli.busca);
  const lista = cli.lista.filter((c) => (filtroCli.perfil === 'todos' || c.dominante === filtroCli.perfil) && (!b || normalNome(c.nome + ' ' + c.telefone).includes(b)));
  const filtros = [['todos', 'Todos'], ...PERFIS_ORDEM.map((k) => [k, k[0].toUpperCase() + k.slice(1)])];
  return `
    ${cli.chamar.length ? `<h3 class="sub-titulo" style="margin-top:0">Para chamar agora</h3><p class="detalhe">Quem já passou do ritmo de compra de cada um, com a fragrância que mais combina.</p>
      <ul class="cli-lista cli-chamar-lista">${cli.chamar.slice(0, 6).map(cartaoChamar).join('')}</ul>` : ''}
    <h3 class="sub-titulo">Todos os clientes</h3>
    <div class="busca"><input id="cli-busca" type="search" placeholder="Buscar por nome ou telefone" value="${esc(filtroCli.busca)}" aria-label="Buscar cliente" /></div>
    <div class="filtros" role="group" aria-label="Filtrar pelo gosto">${filtros.map(([k, n]) => `<button type="button" data-cli-perfil="${k}" aria-pressed="${filtroCli.perfil === k}">${n}</button>`).join('')}</div>
    ${lista.length ? `<ul class="cli-lista">${lista.map(cartaoCliente).join('')}</ul>`
      : cli.lista.length ? '<div class="vazio"><span class="simbolo"></span><b>Nenhum cliente nesta busca</b>Tente outro nome ou outro filtro.</div>'
      : '<div class="vazio"><span class="simbolo"></span><b>Os clientes aparecem sozinhos</b>Cada pedido que você registrar com nome ou WhatsApp cria o cliente aqui, com o gosto dele calculado das compras.</div>'}`;
}

/* ----- detalhe do cliente ----- */
function abrirCliente(id, foco) {
  const c = cli && cli.lista.find((x) => x.id === id);
  if (!c) return;
  const rolagem = $('folha').open && $('folha').dataset.cli === id ? $('folha').scrollTop : 0;
  $('folha').dataset.cli = id;
  const recs = c.recomendacoes;
  const escolhida = recs.find((r) => r.disponivel) || recs[0] || null;
  abrirFolha(c.nome || 'Cliente', `
    <p class="legenda" style="margin-top:4px">${c.telefone ? esc(c.telefone) + ', ' : ''}${c.lead ? 'contato do site' : `cliente desde ${dataCurta(c.primeira)}/${c.primeira.slice(0, 4)}`}</p>
    ${secaoConta(c)}
    <section class="sec"><h3>Gosto</h3>${barraGosto(c.perfil)}
      ${c.notas.length ? `<p class="chips-notas">${c.notas.map((n) => `<span class="chip">${esc(n.rotulo)}</span>`).join('')}</p>` : ''}
      <p class="detalhe">${c.n_pedidos} ${c.n_pedidos === 1 ? 'pedido' : 'pedidos'}, ${din(c.gasto)} no total${c.intervalo ? `, compra a cada ${c.intervalo} dias em média` : ''}. Última compra ${quandoDias(c.dias)}.</p></section>
    <section class="sec"><h3>O que sugerir</h3>
      ${recs.length ? `<ul class="det-itens">${recs.map((r) => `<li><span><b>${esc(r.nome)}</b> ${pilulaAfin(r.rotulo, r.afinidade)}<br><i>${r.motivos.length ? 'combina com ' + esc(r.motivos.join(' e ')) : 'sem motivo claro ainda'}${r.ja_comprou ? ', ela já tem' : ''}${r.disponivel ? '' : ', sem estoque agora'}</i></span>
        <button class="btn pequeno" type="button" data-act="cli-usar" data-id="${esc(c.id)}" data-prod="${esc(r.id)}">Usar</button></li>`).join('')}</ul>`
        : '<p class="detalhe">Ainda não há compras de perfume para comparar.</p>'}</section>
    <section class="sec" id="cli-sec-msg"><h3>Mensagem</h3>
      <label for="cli-msg" style="margin-top:0">Você revisa e envia pelo WhatsApp</label>
      <textarea id="cli-msg" data-cli="${esc(c.id)}" style="min-height:120px">${esc(msgRecompra(c, escolhida))}</textarea>
      <div class="grade2" style="margin-top:12px;gap:10px">
        ${c.telefone && telefoneLink(c.telefone) && c.consent !== 'sem_aceite' ? `<a class="btn primario" id="cli-zap" href="${esc(linkZap(c.telefone, msgRecompra(c, escolhida)))}" target="_blank" rel="noopener">Abrir no WhatsApp</a>` : `<span class="btn" aria-disabled="true" style="opacity:.5">${c.consent === 'sem_aceite' ? 'Não aceitou contato' : 'Sem telefone'}</span>`}
        <button class="btn" type="button" data-act="cli-chamei" data-id="${esc(c.id)}">Marquei como chamado</button></div>
      ${c.contato.ultimo ? `<p class="detalhe" style="margin-top:10px">Última vez chamado em ${dataCurta(c.contato.ultimo)}.</p>` : ''}</section>
    <section class="sec"${c.pedidos.length ? '' : ' hidden'}><h3>Compras</h3>
      <ul class="det-itens">${c.compras.map((x) => `<li><span>${x.qtd}× ${esc(x.nome)}</span><i>${dataCurta(x.ultima)}</i></li>`).join('')}</ul>
      <h4 class="mini-nome" style="margin-top:16px">Pedidos</h4>
      <ul class="det-itens">${c.pedidos.map((p) => `<li><button class="link" type="button" data-act="cli-pedido" data-id="${esc(p.id)}">nº ${p.numero}, ${dataCurta(p.data)}</button><b>${din(p.total)}</b></li>`).join('')}</ul></section>
    <section class="sec"><h3>Anotações</h3>
      <form data-form="cli-dados" data-id="${esc(c.id)}">
        <textarea name="notas" style="min-height:84px" maxlength="600" placeholder="Ex.: prefere ser chamada à tarde; presenteia a irmã">${esc(c.contato.notas)}</textarea>
        <label class="lembrar"><input type="checkbox" name="nao_chamar"${c.contato.nao_chamar ? ' checked' : ''} /> Não chamar (pediu para parar ou não quer promoções)</label>
        <button class="btn cheio" type="submit">Salvar anotações</button></form></section>`);
  $('folha').scrollTop = foco === 'mensagem' ? ($('cli-sec-msg').offsetTop - 12) : rolagem;
}

function usarSugestao(id, prodId) {
  const c = cli.lista.find((x) => x.id === id);
  const r = c.recomendacoes.find((x) => x.id === prodId);
  const texto = msgRecompra(c, r);
  $('cli-msg').value = texto;
  const z = $('cli-zap'); if (z) z.href = linkZap(c.telefone, texto);
  $('cli-msg').focus();
}

/* ----- simulador de lançamento ----- */
function opcoesLancamento() {
  const lotes = est.maturacao.filter((l) => l.status === 'maturando');
  return `<optgroup label="Perfumes do catálogo">${est.perfumes.map((p) => `<option value="p:${esc(p.id)}">${esc(p.nome)}</option>`).join('')}</optgroup>
    ${lotes.length ? `<optgroup label="Em maturação">${lotes.map((l) => `<option value="m:${esc(l.id)}">${esc(l.nome)}, pronto em ${dataBR(l.previsto)}</option>`).join('')}</optgroup>` : ''}
    <option value="outro">Outra fragrância (descrever o perfil)</option>`;
}
function corpoLancamento() {
  const sel = (id, atual, lista) => `<select id="${id}" data-lanc>${lista.map(([k, n]) => `<option value="${k}"${k === atual ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
  const custom = lancForm.alvo === 'outro' || lancForm.alvo.startsWith('m:') && !loteComProduto(lancForm.alvo.slice(2));
  return `
    <section class="quadro" style="margin-top:0">
      <h3>Quem chamar para um lançamento</h3>
      <p class="ajuda">Escolha a fragrância que vai lançar. O painel compara com o gosto de cada cliente e mostra quem tem mais chance de comprar.</p>
      <label for="lanc-alvo">Fragrância</label>
      <select id="lanc-alvo" data-lanc>${opcoesLancamento().replace(`value="${esc(lancForm.alvo)}"`, `value="${esc(lancForm.alvo)}" selected`)}</select>
      <div id="lanc-custom"${custom ? '' : ' hidden'}>
        <div class="grade2">
          <div><label for="lanc-perfil">Perfil</label>${sel('lanc-perfil', lancForm.perfil, PERFIS_ORDEM.map((k) => [k, k[0].toUpperCase() + k.slice(1)]))}</div>
          <div><label for="lanc-publico">Para quem</label>${sel('lanc-publico', lancForm.publico, [['feminino', 'Feminino'], ['masculino', 'Masculino'], ['compartilhavel', 'Unissex']])}</div>
        </div>
        <label for="lanc-notas">Notas (opcional, separadas por vírgula)</label>
        <input id="lanc-notas" data-lanc value="${esc(lancForm.notas)}" placeholder="Ex.: baunilha, citrico" maxlength="120" />
      </div>
      <button class="btn primario cheio" type="button" data-act="lanc-rodar" style="margin-top:22px">Ver quem chamar</button>
    </section>
    <div id="lanc-res">${lanc ? resultadoLancamento() : ''}</div>`;
}
const loteComProduto = (id) => { const l = est.maturacao.find((x) => x.id === id); return Boolean(l && l.produto_id); };

function resultadoLancamento() {
  const r = lanc;
  if (!r.total) return '<div class="vazio"><span class="simbolo"></span><b>Ainda não há clientes</b>Os clientes aparecem quando houver pedidos com nome ou WhatsApp.</div>';
  const maxMedia = Math.max(1, ...r.segmentos.map((s) => s.media));
  return `
    <h3 class="sub-titulo">Chance por tipo de cliente${r.nome ? ` para ${esc(r.nome)}` : ''}</h3>

async function rodarLancamento() {
  let corpo;
  const alvo = lancForm.alvo;
  if (alvo.startsWith('p:')) corpo = { produto_id: alvo.slice(2) };
  else if (alvo.startsWith('m:') && loteComProduto(alvo.slice(2))) corpo = { produto_id: est.maturacao.find((l) => l.id === alvo.slice(2)).produto_id };
  else {
    const lote = alvo.startsWith('m:') ? est.maturacao.find((l) => l.id === alvo.slice(2)) : null;
    corpo = { nome: lote ? lote.nome : '', perfil: lancForm.perfil, publico: lancForm.publico, notas: lancForm.notas };
  }
  try {
    const d = await api('lancamento', corpo);
    lanc = d.lancamento;
    const p = corpo.produto_id && est.catalogo.find((x) => x.id === corpo.produto_id);
    lanc.inspirado = p ? p.inspirado : '';
    const el = $('lanc-res'); if (el) el.innerHTML = resultadoLancamento();
  } catch (e) { falhou(e); }
}

function indiceBusca() {
  const itens = [];
  for (const p of est.catalogo) {
    const ctl = est.produtos.find((x) => x.id === p.id);
    if (p.categoria === 'perfumes') {
      itens.push({ grupo: 'Fragrâncias', titulo: p.nome, chip: p.perfil || '',
        sub: [p.inspirado ? 'inspirado em ' + p.inspirado : '', ctl ? `${nf.format(ctl.ml_total)} ml` : '', p.status !== 'visivel' ? (p.status === 'oculto' ? 'oculto no site' : 'esgotado') : ''].filter(Boolean).join(' · '),
        hay: normalNome([p.nome, p.inspirado, p.perfil, (p.tags || []).join(' '), p.notas ? Object.values(p.notas).join(' ') : '', p.descricao].join(' ')), run: () => folhaFragrancia(p.id) });
    } else {
      itens.push({ grupo: 'Produtos', titulo: p.nome, chip: p.rotulo, sub: precoTexto(p), hay: normalNome(p.nome + ' ' + p.rotulo), run: () => { irPara('catalogo'); filtroCatalogoPara(p.nome); } });
    }
  }
  for (const ped of est.pedidos.slice(0, 200)) {
    itens.push({ grupo: 'Pedidos', titulo: `nº ${ped.numero}, ${(ped.cliente && ped.cliente.nome) || 'sem nome'}`, chip: ROTULO_ETAPA[ped.status],
      sub: `${din(ped.total)} · ${resumoItens(ped)}`,
      hay: normalNome(`${ped.numero} ${ped.cliente ? ped.cliente.nome + ' ' + ped.cliente.telefone : ''} ${ped.itens.map((i) => i.nome).join(' ')} ${ROTULO_ETAPA[ped.status]}`), run: () => { irPara('pedidos'); abrirPedido(ped.id); } });
  }
  if (cli) for (const c of cli.lista) {
    itens.push({ grupo: 'Clientes', titulo: c.nome || 'Sem nome', chip: c.dominante || '', sub: `${c.n_pedidos} ${c.n_pedidos === 1 ? 'pedido' : 'pedidos'} · última compra ${quandoDias(c.dias)}`, hay: normalNome(`${c.nome} ${c.telefone} ${c.dominante || ''}`), run: () => { irPara('clientes'); abrirCliente(c.id); } });
  }
  for (const i of est.insumos) itens.push({ grupo: 'Estoque', titulo: i.nome, chip: '', sub: `${nf.format(i.qtd)} ${i.unidade}${i.acabando ? ' · acabando' : ''}`, hay: normalNome(i.nome + ' insumo'), run: () => irEstoque('insumos') });
  for (const l of est.maturacao.filter((x) => x.status === 'maturando')) itens.push({ grupo: 'Estoque', titulo: `${l.nome}, em maturação`, chip: '', sub: `${nf.format(l.ml)} ml · pronto em ${dataBR(l.previsto)}`, hay: normalNome(l.nome + ' maturacao lote'), run: () => irEstoque('maturacao') });
  return itens.concat(comandos());
}
function filtroCatalogoPara(nome) { filtro.busca = nome; filtro.cat = 'todos'; desenharCatalogo(); }

const LIMITES = { 'Fragrâncias': 8, Produtos: 4, Pedidos: 5, Clientes: 5, Estoque: 4, 'Opções': 7, 'Configurações': 3 };
const ORDEM_GRUPOS = ['Fragrâncias', 'Produtos', 'Pedidos', 'Clientes', 'Estoque', 'Opções', 'Configurações'];
function buscar(q) {
  const tokens = normalNome(q).split(/\s+/).filter(Boolean);
  const todosItens = indiceBusca();
  let achados;
  if (!tokens.length) achados = todosItens.filter((i) => i.grupo === 'Fragrâncias').slice(0, 5).concat(todosItens.filter((i) => i.grupo !== 'Fragrâncias' && (i.grupo === 'Opções' || i.grupo === 'Configurações')).slice(0, 8));
  else {
    achados = todosItens.map((i) => {
      if (!tokens.every((t) => i.hay.includes(t))) return null;
      const tit = normalNome(i.titulo);
      return { ...i, s: 1 + (tit.startsWith(tokens[0]) ? 3 : tit.includes(tokens[0]) ? 2 : 0) };
    }).filter(Boolean).sort((a, b) => b.s - a.s || a.titulo.localeCompare(b.titulo, 'pt-BR'));
  }
  const cont = {};
  const lim = achados.filter((i) => { cont[i.grupo] = (cont[i.grupo] || 0) + 1; return tokens.length ? cont[i.grupo] <= LIMITES[i.grupo] : true; });
  return ORDEM_GRUPOS.flatMap((g) => lim.filter((i) => i.grupo === g));
}

function desenharBusca() {
  buscaItens = buscar($('busca-q').value);
  buscaSel = Math.min(buscaSel, Math.max(0, buscaItens.length - 1));
  let ultimo = '';
  const html = buscaItens.map((i, n) => {
    const cab = i.grupo !== ultimo ? `<li class="busca-grupo" role="presentation">${esc(i.grupo)}</li>` : '';
    ultimo = i.grupo;
    return `${cab}<li role="option" id="busca-i${n}" class="busca-item" data-n="${n}" aria-selected="${n === buscaSel}">
      <div><span class="busca-t">${esc(i.titulo)}</span>${i.sub ? `<span class="busca-s">${esc(i.sub)}</span>` : ''}</div>${i.chip ? `<span class="chip">${esc(i.chip)}</span>` : ''}</li>`;
  }).join('');
  $('busca-res').innerHTML = html || '<li class="busca-vazio" role="presentation">Nada encontrado. Tente o nome da fragrância, uma nota (baunilha, cítrico) ou uma opção como "tema" ou "senha".</li>';
  $('busca-q').setAttribute('aria-activedescendant', buscaItens.length ? `busca-i${buscaSel}` : '');
}
function abrirBusca() {
  if (!est || $('app').hidden) return;
  if (!$('busca-geral').open) $('busca-geral').showModal();
  $('busca-q').value = ''; buscaSel = 0; desenharBusca(); $('busca-q').focus();
  if (cliVelho) carregarClientes().then(() => { if ($('busca-geral').open) desenharBusca(); });
}
function escolherBusca(n) {
  const item = buscaItens[n];
  if (!item) return;
  $('busca-geral').close();
  setTimeout(() => item.run(), 60);
}
function moverBusca(d) {
  if (!buscaItens.length) return;
  buscaSel = (buscaSel + d + buscaItens.length) % buscaItens.length;
  document.querySelectorAll('#busca-res [role=option]').forEach((el) => el.setAttribute('aria-selected', Number(el.dataset.n) === buscaSel));
  const el = $('busca-i' + buscaSel); if (el) el.scrollIntoView({ block: 'nearest' });
  $('busca-q').setAttribute('aria-activedescendant', 'busca-i' + buscaSel);
}

$('busca-btn').addEventListener('click', abrirBusca);
$('busca-q').addEventListener('input', () => { buscaSel = 0; desenharBusca(); });
$('busca-q').addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowDown') { ev.preventDefault(); moverBusca(1); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); moverBusca(-1); }
  else if (ev.key === 'Enter') { ev.preventDefault(); escolherBusca(buscaSel); }
});
$('busca-res').addEventListener('click', (ev) => { const li = ev.target.closest('[data-n]'); if (li) escolherBusca(Number(li.dataset.n)); });
$('busca-res').addEventListener('mousemove', (ev) => { const li = ev.target.closest('[data-n]'); if (li && Number(li.dataset.n) !== buscaSel) { buscaSel = Number(li.dataset.n); moverBusca(0); } });
$('busca-geral').addEventListener('click', (ev) => { if (ev.target === $('busca-geral') || ev.target.closest('[data-fechar-busca]')) $('busca-geral').close(); });
document.addEventListener('keydown', (ev) => {
  const digitando = ev.target.matches && ev.target.matches('input, textarea, select, [contenteditable]');
  if ((ev.key === 'k' || ev.key === 'K') && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); abrirBusca(); }
  else if (ev.key === '/' && !digitando && !ev.ctrlKey && !ev.metaKey && !ev.altKey) { ev.preventDefault(); abrirBusca(); }
});


/* ---------- listas suspensas no padrão do painel ---------- */
// No computador (mouse) a lista nativa dá lugar a esta, com busca nas listas longas e teclado.
// No celular continua a lista nativa do aparelho, que já é boa.
const dropFino = () => matchMedia('(pointer: fine)').matches && typeof HTMLElement.prototype.showPopover === 'function';
let dropAberta = null;   // { sel, el }

function fecharDrop(devolverFoco) {
  if (!dropAberta) return;
  const { sel, el } = dropAberta;
  dropAberta = null;
  try { el.hidePopover(); } catch (_) {}
  el.remove();
  if (devolverFoco) sel.focus();
}

function abrirDrop(sel) {
  if (dropAberta) { const mesmo = dropAberta.sel === sel; fecharDrop(false); if (mesmo) return; }
  // opções, com os títulos dos grupos
  const itens = [];
  [...sel.children].forEach((c) => {
    if (c.tagName === 'OPTGROUP') { itens.push({ grupo: c.label }); [...c.children].forEach((o) => itens.push({ o })); }
    else if (c.tagName === 'OPTION') itens.push({ o: c });
  });
  const opcoes = itens.filter((i) => i.o);
  const comBusca = opcoes.length > 8;

  const el = document.createElement('div');
  el.className = 'drop';
  el.setAttribute('popover', 'manual');   // quem fecha somos nós (clique fora, Esc, escolher)
  el.tabIndex = -1;
  el.innerHTML = `${comBusca ? '<div class="drop-busca"><input type="search" placeholder="Buscar" aria-label="Buscar na lista" autocomplete="off" spellcheck="false" /></div>' : ''}<ul class="drop-lista" role="listbox"></ul>`;
  // dentro de uma janela aberta, a lista precisa morar nela, senão fica "bloqueada" pela janela
  (sel.closest('dialog') || document.body).appendChild(el);
  const lista = el.querySelector('.drop-lista');
  let ativo = Math.max(0, opcoes.findIndex((i) => i.o === sel.selectedOptions[0]));

  const desenhar = (q = '') => {
    const t = normalNome(q);
    let visiveis = 0;
    let html = '';
    let grupoPendente = '';
    itens.forEach((i) => {
      if (i.grupo !== undefined) { grupoPendente = i.grupo; return; }
      const idx = opcoes.indexOf(i);
      if (t && !normalNome(i.o.textContent).includes(t)) return;
      if (grupoPendente) { html += `<li class="drop-grupo" role="presentation">${esc(grupoPendente)}</li>`; grupoPendente = ''; }
      html += `<li class="drop-item${idx === ativo ? ' ativo' : ''}" role="option" data-i="${idx}" aria-selected="${i.o === sel.selectedOptions[0]}"${i.o.disabled ? ' aria-disabled="true"' : ''}>${esc(i.o.textContent)}</li>`;
      visiveis++;
    });
    lista.innerHTML = visiveis ? html : '<li class="drop-vazio" role="presentation">Nada encontrado</li>';
  };
  const visiveisIdx = () => [...lista.querySelectorAll('.drop-item:not([aria-disabled="true"])')].map((li) => Number(li.dataset.i));
  const mover = (d) => {
    const v = visiveisIdx();
    if (!v.length) return;
    const pos = v.indexOf(ativo);
    ativo = v[Math.min(v.length - 1, Math.max(0, (pos < 0 ? 0 : pos + d)))];
    lista.querySelectorAll('.drop-item').forEach((li) => li.classList.toggle('ativo', Number(li.dataset.i) === ativo));
    const li = lista.querySelector('.drop-item.ativo'); if (li) li.scrollIntoView({ block: 'nearest' });
  };
  const escolher = (idx) => {
    const o = opcoes[idx] && opcoes[idx].o;
    if (!o || o.disabled) return;
    sel.value = o.value;
    sel.dispatchEvent(new Event('input', { bubbles: true }));
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    fecharDrop(true);
  };

  desenhar();
  // posição: logo abaixo do campo, ou acima se faltar espaço
  const r = sel.getBoundingClientRect();
  const largura = Math.max(r.width, 240);
  const abaixo = innerHeight - r.bottom - 12;
  const acima = r.top - 12;
  el.style.width = `${largura}px`;
  el.style.left = `${Math.max(8, Math.min(r.left, innerWidth - largura - 8))}px`;
  if (abaixo < 260 && acima > abaixo) { el.style.top = 'auto'; el.style.bottom = `${innerHeight - r.top + 4}px`; el.style.maxHeight = `${Math.min(380, acima)}px`; }
  else { el.style.top = `${r.bottom + 4}px`; el.style.maxHeight = `${Math.min(380, abaixo)}px`; }

  dropAberta = { sel, el };
  el.showPopover();
  const li = lista.querySelector('.drop-item.ativo'); if (li) li.scrollIntoView({ block: 'nearest' });
  const campo = el.querySelector('input');
  if (!campo) el.focus();
  if (campo) { campo.focus(); campo.addEventListener('input', () => { ativo = -1; desenhar(campo.value); const v = visiveisIdx(); ativo = v[0] ?? -1; desenhar(campo.value); }); }

  el.addEventListener('click', (ev) => { const x = ev.target.closest('.drop-item'); if (x) escolher(Number(x.dataset.i)); });
  el.addEventListener('mousemove', (ev) => { const x = ev.target.closest('.drop-item:not([aria-disabled="true"])'); if (x && Number(x.dataset.i) !== ativo) { ativo = Number(x.dataset.i); lista.querySelectorAll('.drop-item').forEach((n) => n.classList.toggle('ativo', Number(n.dataset.i) === ativo)); } });
  el.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); mover(1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); mover(-1); }
    else if (ev.key === 'Enter') { ev.preventDefault(); escolher(ativo); }
    else if (ev.key === 'Tab') fecharDrop(false);
  });
  el.addEventListener('toggle', (ev) => { if (ev.newState === 'closed') fecharDrop(false); });
}

const eSelectPropria = (s) => s && !s.multiple && !s.disabled && !s.dataset.nativo && dropFino();
document.addEventListener('mousedown', (ev) => {
  const alvo = ev.target;
  const s = alvo.closest && alvo.closest('select');
  // clicar fora da lista aberta fecha
  if (dropAberta && !(alvo.closest && alvo.closest('.drop')) && !(s && s === dropAberta.sel)) fecharDrop(false);
  if (eSelectPropria(s)) { ev.preventDefault(); s.focus(); }   // impede a lista nativa
}, true);
document.addEventListener('click', (ev) => {
  const s = ev.target.closest && ev.target.closest('select');
  if (!eSelectPropria(s)) return;
  ev.preventDefault();
  abrirDrop(s);   // abre, ou fecha se já era a lista dele
}, true);
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && dropAberta) { ev.preventDefault(); ev.stopPropagation(); fecharDrop(true); }
}, true);
addEventListener('resize', () => fecharDrop(false));
document.addEventListener('scroll', (ev) => { if (dropAberta && !(ev.target.closest && ev.target.closest('.drop'))) fecharDrop(false); }, true);
document.addEventListener('keydown', (ev) => {
  const s = ev.target;
  if (!(s && s.tagName === 'SELECT') || s.dataset.nativo || !dropFino()) return;
  if ([' ', 'Enter', 'ArrowDown', 'ArrowUp'].includes(ev.key)) { ev.preventDefault(); abrirDrop(s); }
});

  const p = est.catalogo.find((x) => x.id === id);
  abrirFolha(`Preços de ${p.nome}`, `
    <form data-form="precos" data-id="${esc(id)}">
      <p class="legenda" style="margin-top:4px">vale para o site inteiro, na hora</p>
      <div class="${p.variantes.length > 1 ? 'grade2' : ''}">${p.variantes.map((v) => `<div><label for="p-${esc(v.tamanho)}">${v.tamanho === 'unico' ? 'Preço (R$)' : esc(v.tamanho) + ' (R$)'}</label><input id="p-${esc(v.tamanho)}" name="${esc(v.tamanho)}" inputmode="decimal" value="${esc(String(v.preco).replace('.', ','))}" required /></div>`).join('')}</div>
      <button class="btn primario cheio" type="submit" style="margin-top:28px">Salvar preços</button>
    </form>`);
}

const PERFIS = [['frescos', 'Frescos'], ['doces', 'Doces'], ['noturnos', 'Noturnos'], ['elegantes', 'Elegantes']];
const GENEROS = [['feminino', 'Feminino'], ['masculino', 'Masculino'], ['compartilhavel', 'Unissex']];
const opt = (lista, sel) => lista.map(([k, n]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${n}</option>`).join('');

function folhaProduto(id) {
  const edit = id ? est.catalogo.find((x) => x.id === id) : null;
  const d = edit?.dados || { tipo: 'perfume' };
  abrirFolha(edit ? `Editar ${edit.nome}` : 'Novo produto', `
    <form data-form="produto" data-id="${esc(id || '')}">
      ${edit ? `<input type="hidden" name="tipo" value="${d.tipo}">` : `
      <div class="rotulo">O que é</div>
      <div class="escolha" id="p-tipo"><button type="button" data-v="perfume" aria-pressed="true">Perfume</button><button type="button" data-v="creme" aria-pressed="false">Creme</button></div>
      <input type="hidden" name="tipo" value="perfume">`}
      <label for="f-nome">Nome</label><input id="f-nome" name="nome" value="${esc(d.nome || '')}" placeholder="Ex.: J'adore" required maxlength="80" />
      <div data-so="perfume">
        <label for="f-insp">Inspirado em</label><input id="f-insp" name="inspirado" value="${esc(d.inspirado || '')}" placeholder="Ex.: Dior J'adore" maxlength="80" />
        <div class="grade2">
          <div><label for="f-perfil">Perfil</label><select id="f-perfil" name="perfil">${opt(PERFIS, d.perfil || 'elegantes')}</select></div>
          <div><label for="f-gen">Para quem</label><select id="f-gen" name="genero">${opt(GENEROS, d.genero || 'compartilhavel')}</select></div>
        </div>
        <label for="f-topo">Notas de saída</label><input id="f-topo" name="topo" value="${esc(d.topo || '')}" placeholder="Pera, melão" maxlength="120" />
        <label for="f-cor">Notas de coração</label><input id="f-cor" name="coracao" value="${esc(d.coracao || '')}" placeholder="Jasmim, rosa" maxlength="120" />
        <label for="f-base">Notas de fundo</label><input id="f-base" name="base" value="${esc(d.base || '')}" placeholder="Baunilha, almíscar" maxlength="120" />
        <div class="grade2">
          <div><label for="f-p30">Preço 30 ml (R$)</label><input id="f-p30" name="preco30" inputmode="decimal" value="${esc(d.preco30 ?? 85)}" /></div>
          <div><label for="f-p50">Preço 50 ml (R$)</label><input id="f-p50" name="preco50" inputmode="decimal" value="${esc(d.preco50 ?? 165)}" /></div>
        </div>
      </div>
      <div data-so="creme" hidden>
        <label for="f-pc">Preço (R$)</label><input id="f-pc" name="preco" inputmode="decimal" value="${esc(d.preco ?? 35)}" />
      </div>
      <label for="f-desc">Descrição</label><textarea id="f-desc" name="descricao" maxlength="400" placeholder="Duas frases que façam a pessoa querer sentir o cheiro.">${esc(d.descricao || '')}</textarea>
      <label for="f-img">Link da foto (opcional)</label><input id="f-img" name="imagem" value="${esc(d.imagem || '')}" placeholder="https://… ou img/nome.jpg" inputmode="url" />
      <p class="ajuda">Sem foto, o site mostra o símbolo da Sposence.</p>
      ${edit ? '' : '<p class="ajuda" data-so="perfume">Depois de criar, registre o estoque. Até lá ele aparece como esgotado no site.</p>'}
      <button class="btn primario cheio" type="submit" style="margin-top:28px">${edit ? 'Salvar alterações' : 'Criar produto'}</button>
    </form>`);
  mostrarCamposDoTipo(d.tipo);
}
function mostrarCamposDoTipo(tipo) {
  document.querySelectorAll('#folha [data-so]').forEach((el) => { el.hidden = el.dataset.so !== tipo; });
}

/* ---------- eventos ---------- */
document.addEventListener('click', async (ev) => {
  const t = ev.target;
  const seg = t.closest('#e-tipo button, #p-tipo button');
  if (seg) {
    seg.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === seg));
    if (seg.parentElement.id === 'e-tipo') modoEntrada(seg.dataset.v);
    else {
      seg.closest('form').elements.tipo.value = seg.dataset.v;
      mostrarCamposDoTipo(seg.dataset.v);
    }
    return;
  }
  const ir = t.closest('[data-go]');
  if (ir) { if (ir.dataset.go === 'insumos') irEstoque('insumos'); else irPara(ir.dataset.go); return; }
  const cp = t.closest('[data-cli-perfil]');
  if (cp) { filtroCli.perfil = cp.dataset.cliPerfil; desenharClientes(); return; }
  const pl = t.closest('[data-ped-lista]');
  if (pl) { vistaPed = 'lista'; try { localStorage.setItem('sp-ped-vista', 'lista'); } catch (_) {} filtroPed.cat = pl.dataset.pedLista; animPed = true; desenharPedidos(); return; }
  const pf = t.closest('[data-ped-filtro]');
  if (pf) { filtroPed.cat = pf.dataset.pedFiltro; animPed = true; desenharPedidos(); return; }
  const cat = t.closest('[data-cat]');
  if (cat) { filtro.cat = cat.dataset.cat; desenharCatalogo(); return; }

  const b = t.closest('[data-act]');
  if (b) {
    const { act, id } = b.dataset;
    if (act === 'entrada') folhaEntrada(id);
    else if (act === 'envasar') folhaEntrada(id, 'env');
    else if (act === 'ped-abrir') abrirPedido(id);
    else if (act === 'cli-vista') { vistaCli = b.dataset.v; animCli = true; desenharClientes(); }
    else if (act === 'cli-abrir') abrirCliente(id);
    else if (act === 'cli-chamar') abrirCliente(id, 'mensagem');
    else if (act === 'cli-usar') usarSugestao(id, b.dataset.prod);
    else if (act === 'cli-pedido') { irPara('pedidos'); abrirPedido(id); }
    else if (act === 'cli-chamei') {
      try {
        await api('cliente_contato', { id });
        aviso('Contato registrado.');
        if (lanc) { const x = lanc.ranking.find((r) => r.id === id); if (x) { x.ultimo_contato = est.hoje; x.chamado_ha = 0; } const el = $('lanc-res'); if (el) el.innerHTML = resultadoLancamento(); }
        if ($('folha').open && $('folha').dataset.cli === id) abrirCliente(id);
      } catch (e) { falhou(e); }
    }
    else if (act === 'lanc-rodar') rodarLancamento();
    else if (act === 'lanc-produto') { lancForm.alvo = 'p:' + id; vistaCli = 'lancamento'; fecharFolha(); irPara('clientes'); animCli = true; desenharClientes(); rodarLancamento(); }
    else if (act === 'mat-chamar') { lancForm.alvo = 'm:' + id; vistaCli = 'lancamento'; irPara('clientes'); animCli = true; desenharClientes(); rodarLancamento(); }
    else if (act === 'frag') folhaFragrancia(id);
    else if (act === 'cli-vincular') { try { await api('cliente_vincular', { id, sub: b.dataset.sub }); aviso('Conta vinculada. Ela passa a ver os próprios pedidos.'); abrirCliente(id); } catch (e) { falhou(e); } }
    else if (act === 'cli-desvincular') { try { await api('cliente_desvincular', { id }); aviso('Vínculo desfeito.'); abrirCliente(id); } catch (e) { falhou(e); } }
    else if (act === 'av-add') { avItens.push({ id: '', tam: '', qtd: 1 }); desenharLinhasAv(); }
    else if (act === 'av-remover') { avItens.splice(Number(b.dataset.i), 1); if (!avItens.length) avItens = [{ id: '', tam: '', qtd: 1 }]; desenharLinhasAv(); }
    else if (act === 'ped-vista') { vistaPed = b.dataset.v; try { localStorage.setItem('sp-ped-vista', vistaPed); } catch (_) {} animPed = true; desenharPedidos(); }
    else if (act === 'vista-estoque') { vistaEstoque = b.dataset.v; animMat = true; desenharEstoque(); }
    else if (act === 'mat-novo') folhaLote();
    else if (act === 'mat-editar') folhaLote(id);
    else if (act === 'mat-concluir') folhaConcluirLote(id);
    else if (act === 'mat-excluir') {
      const l = est.maturacao.find((x) => x.id === id);
      confirmar('Excluir este lote?', `${l.nome}, ${nf.format(l.ml)} ml. Ele sai da lista de maturação.`, 'Excluir lote', async () => { await api('maturacao_remover', { id }); aviso('Lote excluído.'); });
    }
    else if (act === 'ped-novo') irPara('baixa');
    else if (act === 'ped-cliente') folhaPedCliente(id);
    else if (act === 'ped-item') folhaPedItem(id);
    else if (act === 'ped-parcelamento') folhaPedParcelamento(id);
    else if (act === 'ped-cancelar') folhaPedCancelar(id);
    else if (act === 'ped-status') {
      try { await api('pedido_status', { id, status: b.dataset.st }); aviso('Etapa: ' + ROTULO_ETAPA[b.dataset.st].toLowerCase() + '.'); abrirPedido(id); } catch (e) { falhou(e); }
    } else if (act === 'ped-parcela') {
      try {
        const pago = b.getAttribute('aria-pressed') !== 'true';
        await api('pedido_parcela', { id, n: b.dataset.n, pago });
        aviso(pago ? 'Pagamento registrado.' : 'Voltou para a pagar.'); abrirPedido(id);
      } catch (e) { falhou(e); }
    } else if (act === 'ped-quitar') {
      try { await api('pedido_quitar', { id }); aviso('Tudo pago.'); abrirPedido(id); } catch (e) { falhou(e); }
    }
    else if (act === 'insumo-entrada') folhaInsumoMover(id, 'entrada');
    else if (act === 'insumo-uso') folhaInsumoMover(id, 'uso');
    else if (act === 'insumo-corrigir') folhaInsumoCorrigir(id);
    else if (act === 'insumo-novo') folhaInsumoNovo();
    else if (act === 'insumo-excluir') {
      const i = est.insumos.find((x) => x.id === id);
      confirmar(`Excluir ${i.nome.toLowerCase()}?`, 'O insumo sai da lista e das contas do envase. Para só corrigir a contagem, use Corrigir.', 'Excluir insumo', async () => { await api('insumo_remover', { id }); aviso('Insumo excluído.'); });
    }
    else if (act === 'corrigir') folhaCorrigir(id);
    else if (act === 'precos') folhaPrecos(id);
    else if (act === 'novo') folhaProduto();
    else if (act === 'editar') folhaProduto(id);
    else if (act === 'desfazer') confirmar('Desfazer o último movimento?', est.historico[0]?.descricao || '', 'Desfazer', async () => { await api('desfazer'); aviso('Desfeito.'); });
    else if (act === 'remover') {
      const p = est.catalogo.find((x) => x.id === id);
      confirmar(`Excluir ${p.nome}?`, 'O produto sai do site e do painel, e não dá para voltar. Para tirar só por um tempo, use Oculto.', 'Excluir produto', async () => { await api('produto_remover', { id }); aviso('Produto excluído.'); });
    } else if (act === 'status') {
      try { await api('produto_status', { id, status: b.dataset.st }); aviso({ visivel: 'Visível no site.', esgotado: 'Marcado como esgotado.', oculto: 'Tirado do site.' }[b.dataset.st]); } catch (e) { falhou(e); }
    }
    return;
  }
  if (t.id === 'tentar') entrar(senha, true).catch(() => {});
  else if (t.id === 'colar') { try { $('pedido').value = await navigator.clipboard.readText(); } catch (_) { aviso('Não consegui ler a área de transferência. Cole no campo.', true); } }
  else if (t.id === 'conferir') conferir({ acao: 'pedido', texto: $('pedido').value, pagamento: lerPagamento('pd') });
  else if (t.id === 'conferir-avulsa') conferir({ acao: 'venda', itens: itensAvulsa(), cliente: { nome: $('av-nome').value, telefone: $('av-tel').value }, pagamento: lerPagamento('av') });
  else if (t.id === 'confirmar' && pendente) {
    t.disabled = true;
    try {
      const antes = idUltimo();
      const d = await api(pendente.corpo.acao, { ...pendente.corpo, confirmar: true });
      pendente = null; limparRascunhoBaixa(); if ($('pedido')) $('pedido').value = ''; $('previa').innerHTML = '';
      const novo = d.pedido;
      aviso(d.nada_a_descontar ? `Pedido nº ${novo.numero} criado. Nenhum item tem estoque controlado.` : `Baixa feita. Pedido nº ${novo.numero} criado.`, false, [
        { rotulo: 'Ver pedido', fn: async () => { irPara('pedidos'); abrirPedido(novo.id); } },
        acaoDesfazer(antes),
      ]);
      desenharBaixa();
    } catch (e) { falhou(e); t.disabled = false; }
  }
});

document.addEventListener('input', (ev) => {
  if (ev.target.id === 'busca') { filtro.busca = ev.target.value; desenharCatalogo(); }
  else if (ev.target.id?.startsWith('e-u-')) atualizarUso();
});
document.addEventListener('change', (ev) => { if (ev.target.id === 'e-prod') atualizarUso(); });

document.addEventListener('submit', async (ev) => {
  const f = ev.target.closest('form[data-form]');
  if (!f) return;
  ev.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const botao = f.querySelector('[type=submit]');
  botao.disabled = true;
  try {
    if (f.dataset.form === 'entrada') {
      const antes = idUltimo();
      const modo = $('e-tipo').querySelector('[aria-pressed=true]').dataset.v;
      const unidades = {}; est.tamanhos.forEach((s) => { unidades[s] = v['u-' + s]; });
      if (modo === 'ml') await api('entrada', { id: v.id, ml: v.qtd });
      else await api(modo === 'env' ? 'envasar' : 'entrada', { id: v.id, unidades });
      aviso(modo === 'env' ? 'Envase registrado. O site já está atualizado.' : 'Entrada registrada. O site já está atualizado.', false, acaoDesfazer(antes));
    } else if (f.dataset.form === 'corrigir') {
      const unidades = {}; est.tamanhos.forEach((s) => { unidades[s] = v[s]; });
      const antes = idUltimo();
      await api('ajustar', { id: f.dataset.id, granel_ml: v.granel, unidades });
      aviso('Correção salva.', false, acaoDesfazer(antes));
    } else if (f.dataset.form === 'insumo-mover') {
      const antes = idUltimo();
      await api(f.dataset.tipo === 'uso' ? 'insumo_uso' : 'insumo_entrada', { id: f.dataset.id, qtd: v.qtd });
      aviso(f.dataset.tipo === 'uso' ? 'Uso registrado.' : 'Compra registrada.', false, acaoDesfazer(antes));
    } else if (f.dataset.form === 'insumo-corrigir') {
      const antes = idUltimo();
      await api('insumo_ajustar', { id: f.dataset.id, qtd: v.qtd });
      aviso('Contagem corrigida.', false, acaoDesfazer(antes));
    } else if (f.dataset.form === 'insumo-novo') {
      await api('insumo_criar', v);
      aviso('Insumo criado.');
    } else if (f.dataset.form === 'cli-dados') {
      await api('cliente_dados', { id: f.dataset.id, notas: v.notas, nao_chamar: Boolean(f.elements.nao_chamar.checked) }); aviso('Anotações salvas.'); abrirCliente(f.dataset.id); return;
    } else if (f.dataset.form === 'mat-lote') {
      const id = f.dataset.id;
      await api(id ? 'maturacao_editar' : 'maturacao_criar', { id, produto_id: v.produto_id, nome: v.nome, ml: v.ml, inicio: v.inicio, dias: v.dias, obs: v.obs });
      aviso(id ? 'Lote atualizado.' : 'Lote registrado.');
      if (!id) { vistaEstoque = 'maturacao'; animMat = true; desenharEstoque(); }
    } else if (f.dataset.form === 'mat-concluir') {
      const antes = idUltimo();
      await api('maturacao_concluir', { id: f.dataset.id, produto_id: v.produto_id, ml: v.ml });
      aviso('Entrou no estoque como granel.', false, acaoDesfazer(antes));
    } else if (f.dataset.form === 'ped-obs') {
      await api('pedido_obs', { id: f.dataset.id, texto: v.texto }); aviso('Observação salva.'); abrirPedido(f.dataset.id); return;
    } else if (f.dataset.form === 'ped-cliente') {
      await api('pedido_cliente', { id: f.dataset.id, nome: v.nome, telefone: v.telefone, recebimento: v.recebimento }); aviso('Dados do cliente salvos.'); abrirPedido(f.dataset.id); return;
    } else if (f.dataset.form === 'ped-parc') {
      await api('pedido_parcelamento', { id: f.dataset.id, modo: v.modo, parcelas: v.parcelas }); aviso('Pagamento atualizado.'); abrirPedido(f.dataset.id); return;
    } else if (f.dataset.form === 'ped-cancelar') {
      await api('pedido_cancelar', { id: f.dataset.id, devolver: Boolean(f.elements.devolver && f.elements.devolver.checked) }); aviso('Pedido cancelado.'); abrirPedido(f.dataset.id); return;
    } else if (f.dataset.form === 'ped-item') {
      const livre = v.produto === '__livre';
      const comTamanho = !$('pi-tam-box').hidden;
      await api('pedido_item', livre ? { id: f.dataset.id, nome: v.nome, qtd: v.qtd, preco: v.preco } : { id: f.dataset.id, produto_id: v.produto, tamanho: comTamanho ? v.tamanho : '', qtd: v.qtd, preco: v.preco });
      aviso('Item adicionado ao pedido.'); abrirPedido(f.dataset.id); return;
    } else if (f.dataset.form === 'precos') {
      await api('produto_precos', { id: f.dataset.id, precos: v });
      aviso('Preços atualizados.');
    } else if (f.dataset.form === 'produto') {
      const id = f.dataset.id;
      await api(id ? 'produto_editar' : 'produto_criar', { ...v, id });
      aviso(id ? 'Produto atualizado.' : 'Produto criado. Registre o estoque para vender.');
      if (!id) irPara(v.tipo === 'perfume' ? 'estoque' : 'catalogo');
    }
    fecharFolha();
  } catch (e) { falhou(e); botao.disabled = false; }
});

// ao voltar para a aba ou para o app, busca o estoque de novo (outro aparelho pode ter mudado)
document.addEventListener('visibilitychange', () => { if (!document.hidden && senha && est && !$('folha').open) api('estado').catch(() => {}); });

if (senha) entrar(senha, true).catch(() => {});   // senha antiga errada: api() já volta para a tela de entrada
else mostrarLogin();
</script>
</body>
</html>
