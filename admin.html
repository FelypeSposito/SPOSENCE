/* ---------- listas suspensas no padrão do painel ---------- */
// No computador (mouse) a lista nativa dá lugar a esta, com busca nas listas longas e teclado.
// No celular continua a lista nativa do aparelho, que já é boa.
const dropFino = () => matchMedia('(pointer: fine)').matches && typeof HTMLElement.prototype.showPopover === 'function';
let dropAberta = null;   // { sel, el }

function fecharDrop(devolverFoco) {
  if (!dropAberta) return;
  const { sel, el } = dropAberta;
  dropAberta = null;
  try { el.hidePopover(); } catch (_) {}
  el.remove();
  if (devolverFoco) sel.focus();
}

function abrirDrop(sel) {
  if (dropAberta) { const mesmo = dropAberta.sel === sel; fecharDrop(false); if (mesmo) return; }
  // opções, com os títulos dos grupos
  const itens = [];
  [...sel.children].forEach((c) => {
    if (c.tagName === 'OPTGROUP') { itens.push({ grupo: c.label }); [...c.children].forEach((o) => itens.push({ o })); }
    else if (c.tagName === 'OPTION') itens.push({ o: c });
  });
  const opcoes = itens.filter((i) => i.o);
  const comBusca = opcoes.length > 8;

  const el = document.createElement('div');
  el.className = 'drop';
  el.setAttribute('popover', 'manual');   // quem fecha somos nós (clique fora, Esc, escolher)
  el.tabIndex = -1;
  el.innerHTML = `${comBusca ? '<div class="drop-busca"><input type="search" placeholder="Buscar" aria-label="Buscar na lista" autocomplete="off" spellcheck="false" /></div>' : ''}<ul class="drop-lista" role="listbox"></ul>`;
  // dentro de uma janela aberta, a lista precisa morar nela, senão fica "bloqueada" pela janela
  (sel.closest('dialog') || document.body).appendChild(el);
  const lista = el.querySelector('.drop-lista');
  let ativo = Math.max(0, opcoes.findIndex((i) => i.o === sel.selectedOptions[0]));

  const desenhar = (q = '') => {
    const t = normalNome(q);
    let visiveis = 0;
    let html = '';
    let grupoPendente = '';
    itens.forEach((i) => {
      if (i.grupo !== undefined) { grupoPendente = i.grupo; return; }
      const idx = opcoes.indexOf(i);
      if (t && !normalNome(i.o.textContent).includes(t)) return;
      if (grupoPendente) { html += `<li class="drop-grupo" role="presentation">${esc(grupoPendente)}</li>`; grupoPendente = ''; }
      html += `<li class="drop-item${idx === ativo ? ' ativo' : ''}" role="option" data-i="${idx}" aria-selected="${i.o === sel.selectedOptions[0]}"${i.o.disabled ? ' aria-disabled="true"' : ''}>${esc(i.o.textContent)}</li>`;
      visiveis++;
    });
    lista.innerHTML = visiveis ? html : '<li class="drop-vazio" role="presentation">Nada encontrado</li>';
  };
  const visiveisIdx = () => [...lista.querySelectorAll('.drop-item:not([aria-disabled="true"])')].map((li) => Number(li.dataset.i));
  const mover = (d) => {
    const v = visiveisIdx();
    if (!v.length) return;
    const pos = v.indexOf(ativo);
    ativo = v[Math.min(v.length - 1, Math.max(0, (pos < 0 ? 0 : pos + d)))];
    lista.querySelectorAll('.drop-item').forEach((li) => li.classList.toggle('ativo', Number(li.dataset.i) === ativo));
    const li = lista.querySelector('.drop-item.ativo'); if (li) li.scrollIntoView({ block: 'nearest' });
  };
  const escolher = (idx) => {
    const o = opcoes[idx] && opcoes[idx].o;
    if (!o || o.disabled) return;
    sel.value = o.value;
    sel.dispatchEvent(new Event('input', { bubbles: true }));
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    fecharDrop(true);
  };

  desenhar();
  // posição: logo abaixo do campo, ou acima se faltar espaço
  const r = sel.getBoundingClientRect();
  const largura = Math.max(r.width, 240);
  const abaixo = innerHeight - r.bottom - 12;
  const acima = r.top - 12;
  el.style.width = `${largura}px`;
  el.style.left = `${Math.max(8, Math.min(r.left, innerWidth - largura - 8))}px`;
  if (abaixo < 260 && acima > abaixo) { el.style.top = 'auto'; el.style.bottom = `${innerHeight - r.top + 4}px`; el.style.maxHeight = `${Math.min(380, acima)}px`; }
  else { el.style.top = `${r.bottom + 4}px`; el.style.maxHeight = `${Math.min(380, abaixo)}px`; }

  dropAberta = { sel, el };
  el.showPopover();
  const li = lista.querySelector('.drop-item.ativo'); if (li) li.scrollIntoView({ block: 'nearest' });
  const campo = el.querySelector('input');
  if (!campo) el.focus();
  if (campo) { campo.focus(); campo.addEventListener('input', () => { ativo = -1; desenhar(campo.value); const v = visiveisIdx(); ativo = v[0] ?? -1; desenhar(campo.value); }); }

  el.addEventListener('click', (ev) => { const x = ev.target.closest('.drop-item'); if (x) escolher(Number(x.dataset.i)); });
  el.addEventListener('mousemove', (ev) => { const x = ev.target.closest('.drop-item:not([aria-disabled="true"])'); if (x && Number(x.dataset.i) !== ativo) { ativo = Number(x.dataset.i); lista.querySelectorAll('.drop-item').forEach((n) => n.classList.toggle('ativo', Number(n.dataset.i) === ativo)); } });
  el.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); mover(1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); mover(-1); }
    else if (ev.key === 'Enter') { ev.preventDefault(); escolher(ativo); }
    else if (ev.key === 'Tab') fecharDrop(false);
  });
  el.addEventListener('toggle', (ev) => { if (ev.newState === 'closed') fecharDrop(false); });
}

const eSelectPropria = (s) => s && !s.multiple && !s.disabled && !s.dataset.nativo && dropFino();
document.addEventListener('mousedown', (ev) => {
  const alvo = ev.target;
  const s = alvo.closest && alvo.closest('select');
  // clicar fora da lista aberta fecha
  if (dropAberta && !(alvo.closest && alvo.closest('.drop')) && !(s && s === dropAberta.sel)) fecharDrop(false);
  if (eSelectPropria(s)) { ev.preventDefault(); s.focus(); }   // impede a lista nativa
}, true);
document.addEventListener('click', (ev) => {
  const s = ev.target.closest && ev.target.closest('select');
  if (!eSelectPropria(s)) return;
  ev.preventDefault();
  abrirDrop(s);   // abre, ou fecha se já era a lista dele
}, true);
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && dropAberta) { ev.preventDefault(); ev.stopPropagation(); fecharDrop(true); }
}, true);
addEventListener('resize', () => fecharDrop(false));
document.addEventListener('scroll', (ev) => { if (dropAberta && !(ev.target.closest && ev.target.closest('.drop'))) fecharDrop(false); }, true);
document.addEventListener('keydown', (ev) => {
  const s = ev.target;
  if (!(s && s.tagName === 'SELECT') || s.dataset.nativo || !dropFino()) return;
  if ([' ', 'Enter', 'ArrowDown', 'ArrowUp'].includes(ev.key)) { ev.preventDefault(); abrirDrop(s); }
});

const AJUDA_ENTRADA = {
  ml: 'Perfume maturado, ainda sem envasar. Ex.: 180 ml.',
  un: 'Frascos que já chegaram prontos e etiquetados. Preencha um ou mais tamanhos.',
  env: 'Transforma o granel em frascos. Os ml usados saem do granel.',
};
const tamanhoMl = (s) => parseInt(s, 10);
function modoEntrada(modo) {
  document.querySelectorAll('#e-tipo button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === modo));
  const unidades = modo !== 'ml';
  $('e-ml-box').hidden = unidades;
  $('e-un-box').hidden = !unidades;
  $('e-qtd').required = !unidades;
  $('e-ajuda').textContent = AJUDA_ENTRADA[modo];
  atualizarUso();
}
function atualizarUso() {
  const uso = $('e-uso');
  if (!uso || $('e-tipo').querySelector('[aria-pressed=true]').dataset.v !== 'env') { if (uso) uso.textContent = ''; return; }
  const usado = est.tamanhos.reduce((s, t) => s + (Number($('e-u-' + t).value) || 0) * tamanhoMl(t), 0);
  const granel = est.produtos.find((p) => p.id === $('e-prod').value)?.granel_ml || 0;
  uso.textContent = `Vai usar ${nf.format(usado)} ml dos ${nf.format(granel)} ml a granel.`;
  uso.style.color = usado > granel ? 'var(--perigo)' : '';
}

/* ---------- eventos ---------- */
document.addEventListener('click', async (ev) => {
  const t = ev.target;
  const seg = t.closest('#e-tipo button, #p-tipo button');
  if (seg) {
    seg.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === seg));
    if (seg.parentElement.id === 'e-tipo') modoEntrada(seg.dataset.v);
    else {
      seg.closest('form').elements.tipo.value = seg.dataset.v;
      mostrarCamposDoTipo(seg.dataset.v);
    }
    return;
  }
  const ir = t.closest('[data-go]');
  if (ir) { if (ir.dataset.go === 'insumos') irEstoque('insumos'); else irPara(ir.dataset.go); return; }
  const cp = t.closest('[data-cli-perfil]');
  if (cp) { filtroCli.perfil = cp.dataset.cliPerfil; desenharClientes(); return; }
  const pl = t.closest('[data-ped-lista]');
  if (pl) { vistaPed = 'lista'; try { localStorage.setItem('sp-ped-vista', 'lista'); } catch (_) {} filtroPed.cat = pl.dataset.pedLista; animPed = true; desenharPedidos(); return; }
  const pf = t.closest('[data-ped-filtro]');
  if (pf) { filtroPed.cat = pf.dataset.pedFiltro; animPed = true; desenharPedidos(); return; }
  const cat = t.closest('[data-cat]');
  if (cat) { filtro.cat = cat.dataset.cat; desenharCatalogo(); return; }

  const b = t.closest('[data-act]');
  if (b) {
    const { act, id } = b.dataset;
    if (act === 'entrada') folhaEntrada(id);
    else if (act === 'envasar') folhaEntrada(id, 'env');
    else if (act === 'ped-abrir') abrirPedido(id);
    else if (act === 'cli-vista') { vistaCli = b.dataset.v; animCli = true; desenharClientes(); }
    else if (act === 'cli-abrir') abrirCliente(id);
    else if (act === 'cli-chamar') abrirCliente(id, 'mensagem');
    else if (act === 'cli-usar') escolherSugestao(id, b.dataset.prod);
    else if (act === 'cli-tipo') mudarTipoMensagem(id, b.dataset.tipo);
    else if (act === 'cli-fechar') $('cli-tela').close();
    else if (act === 'cli-copiar') { const m = $('cli-msg'); try { await navigator.clipboard.writeText(m.value); aviso('Texto copiado.'); } catch (_) { m.select(); aviso('Selecionei o texto, é só copiar.'); } }
    else if (act === 'cli-pedido') { if ($('cli-tela').open) $('cli-tela').close(); irPara('pedidos'); abrirPedido(id); }
    else if (act === 'cli-chamei') {
      try {
        await api('cliente_contato', { id });
        aviso('Contato registrado.');
        if (lanc) { const x = lanc.ranking.find((r) => r.id === id); if (x) { x.ultimo_contato = est.hoje; x.chamado_ha = 0; } const el = $('lanc-res'); if (el) el.innerHTML = resultadoLancamento(); }
        if ($('cli-tela').open && $('cli-tela').dataset.cli === id) abrirCliente(id);
      } catch (e) { falhou(e); }
    }
    else if (act === 'lanc-rodar') rodarLancamento();
    else if (act === 'lanc-produto') { lancForm.alvo = 'p:' + id; vistaCli = 'lancamento'; fecharFolha(); irPara('clientes'); animCli = true; desenharClientes(); rodarLancamento(); }
    else if (act === 'mat-chamar') { lancForm.alvo = 'm:' + id; vistaCli = 'lancamento'; irPara('clientes'); animCli = true; desenharClientes(); rodarLancamento(); }
    else if (act === 'frag') folhaFragrancia(id);
    else if (act === 'cli-vincular') { try { await api('cliente_vincular', { id, sub: b.dataset.sub }); aviso('Conta vinculada. Ela passa a ver os próprios pedidos.'); abrirCliente(id); } catch (e) { falhou(e); } }
    else if (act === 'cli-desvincular') { try { await api('cliente_desvincular', { id }); aviso('Vínculo desfeito.'); abrirCliente(id); } catch (e) { falhou(e); } }
    else if (act === 'av-add') { avItens.push({ id: '', tam: '', qtd: 1 }); desenharLinhasAv(); }
    else if (act === 'av-remover') { avItens.splice(Number(b.dataset.i), 1); if (!avItens.length) avItens = [{ id: '', tam: '', qtd: 1 }]; desenharLinhasAv(); }
    else if (act === 'ped-vista') { vistaPed = b.dataset.v; try { localStorage.setItem('sp-ped-vista', vistaPed); } catch (_) {} animPed = true; desenharPedidos(); }
    else if (act === 'fe-acc') {
      const bloco = b.closest('.fe-acc'); const abre = !bloco.classList.contains('aberto');
      bloco.classList.toggle('aberto', abre); b.setAttribute('aria-expanded', abre);
    }
    else if (act === 'av-desc') {
      const v = b.dataset.valor; $('av-valor').value = v; rasc['av-valor'] = v;
      if (pendente) conferir({ ...pendente.corpo, valor_total: v }, pendente.alvo);
    }
    else if (act === 'cat-toggle') {
      const bloco = b.closest('.fe-acc'); const abre = !bloco.classList.contains('aberto');
      abre ? abertosCat.add(id) : abertosCat.delete(id);
      bloco.classList.toggle('aberto', abre); b.setAttribute('aria-expanded', abre);
    }
    else if (act === 'fe-toggle') {
      const bloco = b.closest('.fe-acc'); const abre = !bloco.classList.contains('aberto');
      abre ? abertosEst.add(id) : abertosEst.delete(id);
      bloco.classList.toggle('aberto', abre); b.setAttribute('aria-expanded', abre);
      if (abre) { bloco.classList.add('abrindo'); setTimeout(() => bloco.classList.remove('abrindo'), 1300); }
    }
    else if (act === 'vista-estoque') { vistaEstoque = b.dataset.v; animMat = true; desenharEstoque(); }
    else if (act === 'mat-novo') folhaLote();
    else if (act === 'mat-editar') folhaLote(id);
    else if (act === 'mat-concluir') folhaConcluirLote(id);
    else if (act === 'mat-excluir') {
      const l = est.maturacao.find((x) => x.id === id);
      confirmar('Excluir este lote?', `${l.nome}, ${nf.format(l.ml)} ml. Ele sai da lista de maturação.`, 'Excluir lote', async () => { await api('maturacao_remover', { id }); aviso('Lote excluído.'); });
    }
    else if (act === 'ped-novo') irPara('baixa');
    else if (act === 'ped-cliente') folhaPedCliente(id);
    else if (act === 'ped-item') folhaPedItem(id);
    else if (act === 'ped-parcelamento') folhaPedParcelamento(id);
    else if (act === 'ped-cancelar') folhaPedCancelar(id);
    else if (act === 'ped-status') {
      try { await api('pedido_status', { id, status: b.dataset.st }); aviso('Etapa: ' + ROTULO_ETAPA[b.dataset.st].toLowerCase() + '.'); abrirPedido(id); } catch (e) { falhou(e); }
    } else if (act === 'ped-parcela') {
      try {
        const pago = b.getAttribute('aria-pressed') !== 'true';
        await api('pedido_parcela', { id, n: b.dataset.n, pago });
        aviso(pago ? 'Pagamento registrado.' : 'Voltou para a pagar.'); abrirPedido(id);
      } catch (e) { falhou(e); }
    } else if (act === 'ped-quitar') {
      try { await api('pedido_quitar', { id }); aviso('Tudo pago.'); abrirPedido(id); } catch (e) { falhou(e); }
    }
    else if (act === 'insumo-entrada') folhaInsumoMover(id, 'entrada');
    else if (act === 'insumo-uso') folhaInsumoMover(id, 'uso');
    else if (act === 'insumo-corrigir') folhaInsumoCorrigir(id);
    else if (act === 'insumo-novo') folhaInsumoNovo();
    else if (act === 'insumo-excluir') {
      const i = est.insumos.find((x) => x.id === id);
      confirmar(`Excluir ${i.nome.toLowerCase()}?`, 'O insumo sai da lista e das contas do envase. Para só corrigir a contagem, use Corrigir.', 'Excluir insumo', async () => { await api('insumo_remover', { id }); aviso('Insumo excluído.'); });
    }
    else if (act === 'corrigir') folhaCorrigir(id);
    else if (act === 'precos') folhaPrecos(id);
    else if (act === 'novo') folhaProduto();
    else if (act === 'editar') folhaProduto(id);
    else if (act === 'desfazer') confirmar('Desfazer o último movimento?', est.historico[0]?.descricao || '', 'Desfazer', async () => { await api('desfazer'); aviso('Desfeito.'); });
    else if (act === 'remover') {
      const p = est.catalogo.find((x) => x.id === id);
      confirmar(`Excluir ${p.nome}?`, 'O produto sai do site e do painel, e não dá para voltar. Para tirar só por um tempo, use Oculto.', 'Excluir produto', async () => { await api('produto_remover', { id }); aviso('Produto excluído.'); });
    } else if (act === 'status') {
      try { await api('produto_status', { id, status: b.dataset.st }); aviso({ visivel: 'Visível no site.', esgotado: 'Marcado como esgotado.', oculto: 'Tirado do site.' }[b.dataset.st]); } catch (e) { falhou(e); }
    }
    return;
  }
  if (t.id === 'tentar') entrar(senha, true).catch(() => {});
  else if (t.id === 'colar') { try { $('pedido').value = await navigator.clipboard.readText(); } catch (_) { aviso('Não consegui ler a área de transferência. Cole no campo.', true); } }
  else if (t.id === 'conferir') conferir({ acao: 'pedido', texto: $('pedido').value, pagamento: lerPagamento('pd') });
  else if (t.id === 'conferir-avulsa') conferir({ acao: 'venda', itens: itensAvulsa(), cliente: { nome: $('av-nome').value, telefone: $('av-tel').value }, pagamento: lerPagamento('av'), valor_total: $('av-valor').value, obs: $('av-obs').value });
  else if (t.id === 'conferir-saida') conferir({ acao: 'saida_ml', id: $('sm-prod').value, ml: $('sm-ml').value, motivo: $('sm-motivo').value, obs: $('sm-obs').value }, 'previa-saida');
  else if (t.id === 'confirmar' && pendente) {
    t.disabled = true;
    try {
      const antes = idUltimo();
      const d = await api(pendente.corpo.acao, { ...pendente.corpo, confirmar: true });
      const alvoPrevia = pendente.alvo || 'previa'; const eraSaida = pendente.corpo.acao === 'saida_ml';
      pendente = null; limparRascunhoBaixa(); if ($('pedido')) $('pedido').value = ''; $(alvoPrevia).innerHTML = '';
      if (eraSaida) { aviso('Saída em ml registrada.', false, [acaoDesfazer(antes)]); desenharBaixa(); return; }
      const novo = d.pedido;
      aviso(d.nada_a_descontar ? `Pedido nº ${novo.numero} criado. Nenhum item tem estoque controlado.` : `Baixa feita. Pedido nº ${novo.numero} criado.`, false, [
        { rotulo: 'Ver pedido', fn: async () => { irPara('pedidos'); abrirPedido(novo.id); } },
        acaoDesfazer(antes),
      ]);
      desenharBaixa();
    } catch (e) { falhou(e); t.disabled = false; }
  }
});

  else if (ev.target.id?.startsWith('e-u-')) atualizarUso();
});
document.addEventListener('change', (ev) => { if (ev.target.id === 'e-prod') atualizarUso(); });

document.addEventListener('submit', async (ev) => {
  const f = ev.target.closest('form[data-form]');
  if (!f) return;
  ev.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const botao = f.querySelector('[type=submit]');
  botao.disabled = true;
  try {
    if (f.dataset.form === 'entrada') {
      const antes = idUltimo();
      const modo = $('e-tipo').querySelector('[aria-pressed=true]').dataset.v;
      const unidades = {}; est.tamanhos.forEach((s) => { unidades[s] = v['u-' + s]; });
      if (modo === 'ml') await api('entrada', { id: v.id, ml: v.qtd });
      else await api(modo === 'env' ? 'envasar' : 'entrada', { id: v.id, unidades });
      aviso(modo === 'env' ? 'Envase registrado. O site já está atualizado.' : 'Entrada registrada. O site já está atualizado.', false, acaoDesfazer(antes));
    } else if (f.dataset.form === 'corrigir') {
      const unidades = {}; est.tamanhos.forEach((s) => { unidades[s] = v[s]; });
      const antes = idUltimo();
      await api('ajustar', { id: f.dataset.id, granel_ml: v.granel, unidades });
      aviso('Correção salva.', false, acaoDesfazer(antes));
    } else if (f.dataset.form === 'insumo-mover') {
      const antes = idUltimo();
      await api(f.dataset.tipo === 'uso' ? 'insumo_uso' : 'insumo_entrada', { id: f.dataset.id, qtd: v.qtd });
      aviso(f.dataset.tipo === 'uso' ? 'Uso registrado.' : 'Compra registrada.', false, acaoDesfazer(antes));
    } else if (f.dataset.form === 'insumo-corrigir') {
      const antes = idUltimo();
      await api('insumo_ajustar', { id: f.dataset.id, qtd: v.qtd });
      aviso('Contagem corrigida.', false, acaoDesfazer(antes));
    } else if (f.dataset.form === 'insumo-novo') {
      await api('insumo_criar', v);
      aviso('Insumo criado.');
    } else if (f.dataset.form === 'cli-dados') {
      await api('cliente_dados', { id: f.dataset.id, notas: v.notas, nao_chamar: Boolean(f.elements.nao_chamar.checked) }); aviso('Anotações salvas.'); abrirCliente(f.dataset.id); return;
    } else if (f.dataset.form === 'mat-lote') {
      const id = f.dataset.id;
      await api(id ? 'maturacao_editar' : 'maturacao_criar', { id, produto_id: v.produto_id, nome: v.nome, ml: v.ml, inicio: v.inicio, dias: v.dias, obs: v.obs });
      aviso(id ? 'Lote atualizado.' : 'Lote registrado.');
      if (!id) { vistaEstoque = 'maturacao'; animMat = true; desenharEstoque(); }
    } else if (f.dataset.form === 'mat-concluir') {
      const antes = idUltimo();
      await api('maturacao_concluir', { id: f.dataset.id, produto_id: v.produto_id, ml: v.ml });
      aviso('Entrou no estoque como granel.', false, acaoDesfazer(antes));
    } else if (f.dataset.form === 'ped-obs') {
      await api('pedido_obs', { id: f.dataset.id, texto: v.texto }); aviso('Observação salva.'); abrirPedido(f.dataset.id); return;
    } else if (f.dataset.form === 'ped-cliente') {
      await api('pedido_cliente', { id: f.dataset.id, nome: v.nome, telefone: v.telefone, recebimento: v.recebimento }); aviso('Dados do cliente salvos.'); abrirPedido(f.dataset.id); return;
    } else if (f.dataset.form === 'ped-parc') {
      await api('pedido_parcelamento', { id: f.dataset.id, modo: v.modo, parcelas: v.parcelas }); aviso('Pagamento atualizado.'); abrirPedido(f.dataset.id); return;
    } else if (f.dataset.form === 'ped-cancelar') {
      await api('pedido_cancelar', { id: f.dataset.id, devolver: Boolean(f.elements.devolver && f.elements.devolver.checked) }); aviso('Pedido cancelado.'); abrirPedido(f.dataset.id); return;
    } else if (f.dataset.form === 'ped-item') {
      const livre = v.produto === '__livre';
      const comTamanho = !$('pi-tam-box').hidden;
      await api('pedido_item', livre ? { id: f.dataset.id, nome: v.nome, qtd: v.qtd, preco: v.preco } : { id: f.dataset.id, produto_id: v.produto, tamanho: comTamanho ? v.tamanho : '', qtd: v.qtd, preco: v.preco });
      aviso('Item adicionado ao pedido.'); abrirPedido(f.dataset.id); return;
    } else if (f.dataset.form === 'precos') {
      await api('produto_precos', { id: f.dataset.id, precos: v });
      aviso('Preços atualizados.');
    } else if (f.dataset.form === 'produto') {
      const id = f.dataset.id;
      await api(id ? 'produto_editar' : 'produto_criar', { ...v, id });
      aviso(id ? 'Produto atualizado.' : 'Produto criado. Registre o estoque para vender.');
      if (!id) irPara(v.tipo === 'perfume' ? 'estoque' : 'catalogo');
    }
    fecharFolha();
  } catch (e) { falhou(e); botao.disabled = false; }
});

// ao voltar para a aba ou para o app, busca o estoque de novo (outro aparelho pode ter mudado)
document.addEventListener('visibilitychange', () => { if (!document.hidden && senha && est && !$('folha').open) api('estado').catch(() => {}); });

if (senha) entrar(senha, true).catch(() => {});   // senha antiga errada: api() já volta para a tela de entrada
else mostrarLogin();
</script>
</body>
</html>
