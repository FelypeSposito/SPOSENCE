    .busca-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer; }
    .busca-item[aria-selected="true"] { background: color-mix(in srgb, var(--acento) 14%, transparent); }
    .busca-t { display: block; font-family: 'Philosopher', serif; font-size: 19px; line-height: 1.2; }
    .busca-s { display: block; font-size: 13px; color: var(--suave); margin-top: 1px; }
    .busca-vazio { padding: 28px 14px; color: var(--suave); line-height: 1.6; }
    .busca-rodape { padding: 10px 18px 14px; font-size: 12.5px; color: var(--suave); border-top: 1px solid var(--linha); }
    /* Baixa: venda avulsa em primeiro; mensagem do pedido do site num menu que abre */
    .av-linha { display: grid; grid-template-columns: minmax(0, 1fr) 84px 44px; gap: 0 12px; align-items: end; }
    .av-prod { grid-column: 1 / -1; }
    .av-qtd { grid-column: 2; }
    .av-linha .btn-x { grid-column: 3; }
    .btn-x { width: 44px; height: 44px; border: 0; background: none; color: var(--suave); display: grid; place-items: center; border-radius: 50%; }
    .btn-x svg { width: 20px; height: 20px; }
    @media (hover: hover) { .btn-x:hover { background: color-mix(in srgb, var(--perigo) 12%, transparent); color: var(--perigo); } }
    @media (min-width: 640px) { .av-linha { grid-template-columns: minmax(0, 1fr) 120px 84px 44px; } .av-prod { grid-column: auto; } .av-qtd, .av-linha .btn-x { grid-column: auto; } }
    .mais { margin-top: 8px; border-top: 1px solid var(--linha); }
    .mais summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px 2px; min-height: 56px; font-weight: 600; }
    .mais summary::-webkit-details-marker { display: none; }
    .mais summary small { color: var(--suave); font-weight: 400; font-size: 13.5px; margin-right: auto; margin-left: 10px; }
    .mais summary::after { content: ''; width: 9px; height: 9px; border-right: 2px solid var(--suave); border-bottom: 2px solid var(--suave); transform: rotate(45deg); transition: transform .3s var(--ease); margin-right: 6px; align-self: center; flex: none; }
    .mais[open] summary::after { transform: rotate(-135deg); }
    .mais-corpo { padding: 4px 0 20px; }
    .mais:focus-within summary:focus-visible { outline-offset: 2px; }
    /* Listas suspensas: a nativa herda as cores do tema; a do computador é a do painel */
    select option, select optgroup { background: var(--papel); color: var(--tinta); }
    .drop { position: fixed; inset: auto; margin: 0; padding: 6px; border: 1px solid var(--forte); border-radius: 14px; background: var(--papel); color: var(--tinta); box-shadow: 0 24px 50px -20px rgba(20, 12, 4, .5); overflow: hidden; }
    .drop:popover-open { display: flex; flex-direction: column; }
    .drop:focus { outline: none; }
    .drop-busca { padding: 4px 4px 8px; border-bottom: 1px solid var(--linha); margin-bottom: 4px; flex: none; }
    .drop-busca input { min-height: 42px; border: 1px solid var(--forte); border-radius: 10px; padding: 0 12px; background: color-mix(in srgb, var(--tinta) 4%, transparent); }
    .drop-busca input:focus { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento); }
    .drop-lista { list-style: none; padding: 0; margin: 0; overflow-y: auto; overscroll-behavior: contain; }
    .drop-grupo { font-family: 'Philosopher', serif; font-style: italic; color: var(--suave); font-size: 15px; padding: 10px 10px 4px; }
    .drop-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; min-height: 42px; border-radius: 10px; cursor: pointer; font-size: 15.5px; }
    .drop-item.ativo { background: color-mix(in srgb, var(--acento) 16%, transparent); }
    .drop-item[aria-selected="true"] { font-weight: 700; }
    .drop-item[aria-selected="true"]::after { content: ''; flex: none; width: 6px; height: 11px; border-right: 2px solid var(--acento); border-bottom: 2px solid var(--acento); transform: rotate(45deg) translate(-2px, -2px); }
    .drop-item[aria-disabled="true"] { opacity: .45; cursor: default; }
    .drop-vazio { padding: 18px 12px; color: var(--suave); text-align: center; font-family: 'Philosopher', serif; font-style: italic; }
    @media (prefers-reduced-motion: no-preference) {
      dialog[open] { animation: sobe .32s var(--ease); }
      dialog[open]::backdrop { animation: fade .25s ease-out; }
      @keyframes sobe { from { transform: translateY(28px); opacity: 0; } }
      @keyframes fade { from { opacity: 0; } }
      .esq i { animation: brilho 1.6s linear infinite; }
      @keyframes brilho { to { background-position: -220% 0; } }
      .toast { animation: entra .4s var(--ease); }
      @keyframes entra { from { transform: translateY(10px) scale(.98); opacity: 0; } }
      /* só na primeira vez: os itens aparecem em sequência e os vidros se enchem */
      .entrada__foto img { animation: foto 1.4s var(--ease) both; }
      .entra { animation: item .8s var(--ease) both; animation-delay: calc(var(--i) * 110ms + 120ms); }
      .tremer { animation: tremer .42s cubic-bezier(.36, .07, .19, .97); }
      .btn[aria-busy="true"] { animation: brilho 1.4s linear infinite; }
      @keyframes foto { from { transform: scale(1.06); opacity: .4; } }
      @keyframes tremer { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
      .anim .ped { animation: item .7s var(--ease) both; animation-delay: calc(var(--i) * 80ms); }
      .anim .pg-barra i, .anim .trilha__linha b { animation: enche-x 1.1s var(--ease) both; animation-delay: calc(var(--i) * 80ms + 250ms); }
      .trilha__passo.atual em { animation: pulsa 2.6s ease-in-out infinite; }
      .parcela .check[aria-pressed="true"] svg path { stroke-dasharray: 24; animation: desenha .55s var(--ease) both; }
      @keyframes enche-x { from { transform: scaleX(0); } }
      @keyframes pulsa { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--acento) 8%, transparent); } }
      @keyframes desenha { from { stroke-dashoffset: 24; } }
      .anim .mini, .anim .lote { animation: item .7s var(--ease) both; animation-delay: calc(var(--i) * 70ms); }
      .anim .lote .pg-barra i { animation: enche-x 1.1s var(--ease) both; animation-delay: calc(var(--i) * 70ms + 250ms); }
      .ped-flutua { animation: flutua 6s ease-in-out infinite; }
      @keyframes flutua { 50% { transform: translateY(-5px); } }
      .anim .cli, .anim .cli-chamar { animation: item .7s var(--ease) both; animation-delay: calc(var(--i) * 70ms); }
      .segmentos li, .rank-item { animation: item .6s var(--ease) both; animation-delay: calc(var(--i) * 50ms); }
      .segmentos .pg-barra i { animation: enche-x 1.1s var(--ease) both; animation-delay: calc(var(--i) * 70ms + 200ms); }
      #busca-geral[open] { animation: sobe .22s var(--ease); }
      .anim .item { animation: item .7s var(--ease) both; animation-delay: calc(var(--i) * 90ms); }
      .anim .vial .liquido { animation: enche 1.3s var(--ease) both; animation-delay: calc(var(--i) * 90ms + 200ms); }
      @keyframes item { from { transform: translateY(14px); opacity: 0; } }
      @keyframes enche { from { transform: scaleY(0); } }
    }
  </style>
</head>
<body>

  <div id="login" hidden>
    <div class="entrada">
      <div class="entrada__topo">
        <div class="marca"><span class="simbolo" aria-hidden="true"></span><span class="palavra" role="img" aria-label="Sposence"></span></div>
        <button class="btn-icone" id="tema-login" type="button" aria-label="Alternar tema"></button>
      </div>

      <div class="entrada__foto" aria-hidden="true">
        <picture>
          <source type="image/avif" sizes="(min-width: 900px) 55vw, 100vw" srcset="img/hero/sacola-640.avif 640w, img/hero/sacola-960.avif 960w, img/hero/sacola-1280.avif 1280w">
          <source type="image/webp" sizes="(min-width: 900px) 55vw, 100vw" srcset="img/hero/sacola-640.webp 640w, img/hero/sacola-960.webp 960w, img/hero/sacola-1280.webp 1280w">
          <img src="img/hero/sacola-1280.jpg" alt="" width="1600" height="1460" loading="lazy" decoding="async">
        </picture>
      </div>

      <div class="entrada__form">
        <div class="entrada__corpo">
          <h1 class="entra" style="--i:0">Entre na <em>bancada.</em></h1>
          <p class="apoio entra" style="--i:1">Estoque, insumos e catálogo da Sposence, onde você estiver.</p>
          <form id="login-form" class="entra" style="--i:2" novalidate>
            <input class="so-leitor" type="text" name="usuario" value="bancada" autocomplete="username" tabindex="-1" aria-hidden="true" />
            <label for="senha">Senha</label>
            <div class="campo-senha" id="grupo-senha">
              <input id="senha" type="password" autocomplete="current-password" aria-describedby="login-msg" autocapitalize="off" spellcheck="false" />
              <button class="ver" id="ver-senha" type="button" aria-label="Mostrar senha" aria-pressed="false"></button>
            </div>
            <p id="login-msg" class="login-msg" role="alert" aria-live="assertive"></p>
            <label class="lembrar"><input type="checkbox" id="lembrar" checked /> Manter conectado neste aparelho</label>
            <button class="btn primario cheio" id="entrar" type="submit"><span>Entrar na bancada</span></button>
          </form>
        </div>
        <p class="entrada__rodape entra" style="--i:3">Acesso só para quem cuida da Sposence.</p>
      </div>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topo">
      <div class="topo-in">
        <div class="marca"><span class="simbolo" aria-hidden="true"></span><span class="palavra" role="img" aria-label="Sposence"></span></div>
        <button class="icone-topo" id="busca-btn" type="button" aria-label="Buscar no painel (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
        <button id="tema" type="button" aria-label="Alternar tema"></button>
        <button id="sair" type="button">Sair</button>
      </div>
    </header>

    <main>
      <section id="t-pedidos" aria-labelledby="h-pedidos"></section>
      <section id="t-estoque" aria-labelledby="h-estoque" hidden></section>
      <section id="t-clientes" aria-labelledby="h-clientes" hidden></section>
      <section id="t-baixa" aria-labelledby="h-baixa" hidden></section>
      <section id="t-catalogo" aria-labelledby="h-catalogo" hidden></section>
      <section id="t-historico" aria-labelledby="h-historico" hidden></section>
    </main>

    <nav aria-label="Seções do painel"><div class="in">
      <button data-tab="pedidos" aria-current="true" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v15l-3-1.8-2.5 1.8-2.5-1.8-2.5 1.8-3-1.8V5A1.5 1.5 0 0 1 7 3.5Z"/><path d="M9 9h6M9 13h4"/></svg>Pedidos</button>
      <button data-tab="estoque" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5M10.5 3v3.2c0 1-3.5 2-3.5 5.3V19a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-7.5c0-3.3-3.5-4.3-3.5-5.3V3"/><path d="M7 14h10"/></svg>Estoque</button>
      <button data-tab="clientes" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M2.5 20c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5"/><path d="M16 4.7a3.2 3.2 0 0 1 0 6M18.5 14.8c1.8.7 3 2.2 3 4.2"/></svg>Clientes</button>
      <button data-tab="baixa" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7.5 11 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/></svg>Baixa</button>
      <button data-tab="catalogo" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 12h14M5 19h14"/><path d="M3.5 5h.01M3.5 12h.01M3.5 19h.01"/></svg>Catálogo</button>
      <button data-tab="historico" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4.5V8h3.5"/><path d="M12 8v4.2l2.8 1.8"/></svg>Histórico</button>
    </div></nav>
  </div>

  <dialog id="folha" aria-labelledby="folha-titulo"><div class="folha" id="folha-corpo"></div></dialog>
  <dialog id="busca-geral" aria-label="Buscar no painel">
    <div class="busca-campo">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="busca-q" type="search" placeholder="Buscar fragrância, pedido, cliente ou opção" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="busca-res" aria-label="Buscar no painel" />
      <button class="fechar" type="button" data-fechar-busca aria-label="Fechar a busca"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <ul id="busca-res" role="listbox" aria-label="Resultados"></ul>
    <p class="busca-rodape">Setas para escolher, Enter para abrir, Esc para fechar. Atalho: Ctrl+K ou /</p>
  </dialog>
  <div id="aviso" role="status" aria-live="polite"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('pt-BR');
const brl = (n) => 'R$ ' + (Number.isInteger(Number(n)) ? String(n) : Number(n).toFixed(2).replace('.', ','));
const guardar = {
  ler: (k) => { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } },
  gravar: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (_) {} },
};
// "Manter conectado": na memória do aparelho; senão, só até fechar a aba
const sessao = {
  ler: () => { try { return localStorage.getItem('sp-admin') || sessionStorage.getItem('sp-admin') || ''; } catch (_) { return ''; } },
  persistente: () => { try { return !!localStorage.getItem('sp-admin'); } catch (_) { return false; } },
  gravar: (v, lembrar) => { try { localStorage.removeItem('sp-admin'); sessionStorage.removeItem('sp-admin'); (lembrar ? localStorage : sessionStorage).setItem('sp-admin', v); } catch (_) {} },
  limpar: () => { try { localStorage.removeItem('sp-admin'); sessionStorage.removeItem('sp-admin'); } catch (_) {} },
};
const IC_OLHO = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
const IC_OLHO_RISCADO = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>';
const IC_MAIS = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const IC_X = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const IC_SOL = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>';
const IC_LUA = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.2 6.2 0 0 0 9.5 9.5Z"/></svg>';

let senha = sessao.ler();
let est = null;
let pendente = null;            // pedido esperando confirmação
let primeiraVez = true;         // a prateleira só anima na primeira vez
const filtro = { busca: '', cat: 'todos' };

/* ---------- servidor ---------- */
async function api(acao, corpo = {}) {
  const r = await fetch('/api/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-senha': senha },
    body: JSON.stringify({ acao, ...corpo }),
  });
  const dados = await r.json().catch(() => ({ erro: 'O servidor respondeu algo inesperado. Tente de novo.' }));
  if (r.status === 401) { sair(est ? 'Sua sessão expirou. Entre de novo.' : ''); throw new Error(dados.erro); }
  if (!r.ok) throw Object.assign(new Error(dados.erro || 'Algo deu errado.'), { dados });
  if (dados.estado) { const antes = assinaturaPed(); est = dados.estado; if (antes !== assinaturaPed()) cliVelho = true; }
  if (dados.clientes) { cli = dados.clientes; cliVelho = false; }
  if (dados.estado) desenharTudo();
  return dados;
}
function aviso(msg, ruim, acao) {
  const el = document.createElement('div');
  el.className = 'toast' + (ruim ? ' bad' : '');
  const t = document.createElement('span'); t.textContent = msg; t.style.padding = '6px 0'; el.appendChild(t);
  const acoes = [].concat(acao || []).filter(Boolean);
  for (const a of acoes) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = a.rotulo;
    b.addEventListener('click', async () => { el.remove(); try { await a.fn(); } catch (e) { falhou(e); } });
    el.appendChild(b);
  }
  $('aviso').appendChild(el);
  setTimeout(() => el.remove(), acoes.length ? 8000 : ruim ? 6000 : 3200);
}
// "Desfazer" no aviso: só vale enquanto o movimento ainda for o mais recente
const idUltimo = () => est.historico[0]?.id;
function acaoDesfazer(antes) {
  const hid = idUltimo();
  if (!hid || hid === antes) return undefined;
  return { rotulo: 'Desfazer', fn: async () => {
    if (idUltimo() !== hid) { aviso('Já houve outro movimento depois. Desfaça pelo Histórico.', true); return; }
    await api('desfazer'); aviso('Desfeito.');
  } };
}
const falhou = (e) => aviso(e.message, true);

/* ---------- tema ---------- */
const temaAtual = () => document.documentElement.dataset.tema || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function iconeTema() {
  const escuro = temaAtual() === 'dark';
  for (const id of ['tema', 'tema-login']) {
    $(id).innerHTML = escuro ? IC_SOL : IC_LUA;
    $(id).setAttribute('aria-label', escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro');
  }
}
function alternarTema() {
  const novo = temaAtual() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.tema = novo;
  guardar.gravar('sp-admin-tema', novo);
  iconeTema();
}
$('tema').addEventListener('click', alternarTema);
$('tema-login').addEventListener('click', alternarTema);
iconeTema();

/* ---------- entrada ---------- */
function mensagemLogin(texto, tipo) {
  const m = $('login-msg');
  m.textContent = texto || '';
  m.dataset.tipo = texto ? tipo : '';
}
function mostrarLogin(msg = '') {
  $('login').hidden = false;
  document.querySelector('.entrada__foto img').loading = 'eager';   // a foto só baixa quando a tela de entrada aparece
  $('senha').value = '';
  mensagemLogin(msg, 'dica');
  if (matchMedia('(hover: hover)').matches) $('senha').focus();   // no celular o teclado não abre sozinho
}
function sair(motivo = '') {
  senha = ''; est = null; pendente = null;
  sessao.limpar();
  if ($('folha').open) $('folha').close();
  $('app').hidden = true;
  mostrarLogin(motivo);
}
const esqueleto = () => '<h2 id="h-pedidos">Pedidos</h2><p class="legenda">abrindo a bancada…</p><div style="margin-top:28px;border-top:1px solid var(--forte)">' + [1, 2, 3].map(() => '<div class="esq"><i class="a"></i><div><i class="b"></i><i class="c"></i><i class="d"></i></div></div>').join('') + '</div>';

async function entrar(tentativa, comEsqueleto, lembrar = sessao.persistente()) {
  senha = tentativa;
  if (comEsqueleto) { $('login').hidden = true; $('app').hidden = false; $('t-pedidos').innerHTML = esqueleto(); }
  try {
    await api('estado');
  } catch (e) {
    if (comEsqueleto && senha) {   // senha ok, mas o servidor falhou: mostra o erro com saída
      $('t-pedidos').innerHTML = `<h2 id="h-pedidos">Pedidos</h2><div class="vazio"><span class="simbolo"></span><b>Não consegui abrir a bancada</b>${esc(e.message)}<br><button class="btn primario" id="tentar" type="button">Tentar de novo</button></div>`;
    }
    throw e;
  }
  sessao.gravar(senha, lembrar);
  $('senha').value = ''; $('senha').type = 'password'; mensagemLogin('', '');
  $('login').hidden = true; $('app').hidden = false;
  irPara('pedidos');
  carregarClientes(true).catch(() => {});
}

const campoSenha = $('senha');
const iconeOlho = () => {
  const visivel = campoSenha.type === 'text';
  $('ver-senha').innerHTML = visivel ? IC_OLHO_RISCADO : IC_OLHO;
  $('ver-senha').setAttribute('aria-pressed', String(visivel));
  $('ver-senha').setAttribute('aria-label', visivel ? 'Esconder senha' : 'Mostrar senha');
};
iconeOlho();
$('ver-senha').addEventListener('click', () => { campoSenha.type = campoSenha.type === 'password' ? 'text' : 'password'; iconeOlho(); campoSenha.focus(); });

function falhaLogin(texto) {
  mensagemLogin(texto, 'erro');
  campoSenha.setAttribute('aria-invalid', 'true');
  const g = $('grupo-senha');
  g.classList.remove('tremer'); void g.offsetWidth; g.classList.add('tremer');
  campoSenha.focus(); campoSenha.select();
}
campoSenha.addEventListener('input', () => {
  campoSenha.removeAttribute('aria-invalid');
  if ($('login-msg').dataset.tipo === 'erro') mensagemLogin('', '');
});
// avisa do Caps Lock antes de a pessoa errar
campoSenha.addEventListener('keyup', (ev) => {
  const ligado = ev.getModifierState && ev.getModifierState('CapsLock');
  if (ligado && !$('login-msg').dataset.tipo) mensagemLogin('Caps Lock está ligado.', 'dica');
  else if (!ligado && $('login-msg').textContent === 'Caps Lock está ligado.') mensagemLogin('', '');
});

$('login-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (!campoSenha.value) { falhaLogin('Digite a senha.'); return; }
  const botao = $('entrar');
  const rotulo = botao.querySelector('span');
  botao.disabled = true; botao.setAttribute('aria-busy', 'true'); rotulo.textContent = 'Entrando…';
  try { await entrar(campoSenha.value, false, $('lembrar').checked); }
  catch (e) { falhaLogin(e.message); }
  finally { botao.disabled = false; botao.removeAttribute('aria-busy'); rotulo.textContent = 'Entrar na bancada'; }
});
$('sair').addEventListener('click', () => sair());

/* ---------- abas ---------- */
const ABAS = ['pedidos', 'estoque', 'clientes', 'baixa', 'catalogo', 'historico'];
function irPara(aba) {
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === aba));
  ABAS.forEach((t) => { $('t-' + t).hidden = t !== aba; });
  window.scrollTo(0, 0);
  if (aba === 'clientes') { desenharClientes(); carregarClientes(); }
}
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => irPara(b.dataset.tab)));

/* ---------- janela ---------- */
function abrirFolha(titulo, html) {
  $('folha-corpo').innerHTML = `<div class="folha-topo"><h2 id="folha-titulo">${esc(titulo)}</h2><button class="fechar" type="button" data-fechar aria-label="Fechar">${IC_X}</button></div>${html}`;
  if (!$('folha').open) $('folha').showModal();
}
const fecharFolha = () => $('folha').open && $('folha').close();
$('folha').addEventListener('click', (ev) => { if (ev.target === $('folha') || ev.target.closest('[data-fechar]')) fecharFolha(); });

function confirmar(titulo, texto, rotulo, aoConfirmar) {
  abrirFolha(titulo, `<p class="legenda" style="margin:6px 0 22px">${esc(texto)}</p>
    <button class="btn perigo cheio" id="sim" type="button">${esc(rotulo)}</button>
    <button class="btn cheio" type="button" data-fechar style="margin-top:10px">Cancelar</button>`);
  $('sim').addEventListener('click', async () => { $('sim').disabled = true; try { await aoConfirmar(); fecharFolha(); } catch (e) { falhou(e); $('sim').disabled = false; } });
}

/* ---------- desenho ---------- */
function desenharTudo() {
  desenharEstoque(); desenharPedidos(); desenharBaixa(); desenharCatalogo(); desenharHistorico();
  if (cli) desenharClientes();
  if (cliVelho && !$('t-clientes').hidden) carregarClientes();
}

// O vidro: casco com estrias; o líquido sobe conforme os ml (transform, sem recalcular layout)
function vidro(id, nivel) {
  return `<svg class="vial" viewBox="0 0 48 104" aria-hidden="true">
    <defs>
      <clipPath id="c-${id}"><path d="M16 20h16v7c0 3.4 10 6.4 10 17v47a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8V44c0-10.6 10-13.6 10-17Z"/></clipPath>
      <linearGradient id="g-${id}" x1="0" x2="1"><stop offset="0" stop-color="#b97a2e"/><stop offset=".45" stop-color="#daa753"/><stop offset="1" stop-color="#a86a22"/></linearGradient>
    </defs>
    <g clip-path="url(#c-${id})">
      <rect class="liquido" style="--n:${nivel}" x="0" y="28" width="48" height="76" fill="url(#g-${id})"/>
      <rect class="brilho" x="11" y="40" width="3" height="52" rx="1.5"/>
    </g>
    <path class="casco" d="M16 20h16v7c0 3.4 10 6.4 10 17v47a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8V44c0-10.6 10-13.6 10-17Z"/>
    <path class="estria" d="M15 52v46M21 50v48M27 50v48M33 52v46"/>
    <rect class="tampa" x="15" y="6" width="18" height="14" rx="2.5"/>
  </svg>`;
}

function selos(p) {
  const l = [];
  if (p.status === 'oculto') l.push('fora do site'); else if (p.status === 'esgotado') l.push('marcado como esgotado');
  if (p.ml_total === 0) l.push('sem estoque'); else if (p.ml_total < 60) l.push('acabando');
  return l.map((t) => `<span class="selo">${t}</span>`).join('');
}

function desenharEstoque() {
  if (vistaEstoque === 'maturacao') { desenharMaturacao(); return; }
  if (vistaEstoque === 'insumos') { desenharInsumosNoEstoque(); return; }
  const r = est.resumo;
  const maior = Math.max(1, ...est.produtos.map((p) => p.ml_total));
  const pratos = est.produtos.length;
  $('t-estoque').classList.toggle('anim', primeiraVez);
  $('t-estoque').innerHTML = `
    <div class="secao-topo"><h2 id="h-estoque">Estoque</h2><p class="legenda">essência em ml, do granel ao frasco</p></div>
    ${trocaEstoque()}
    <div class="total">
      <div class="num">${nf.format(r.ml_total)}<em>ml</em></div>
      <p>de essência no total, em <b>${r.frascos_prontos}</b> frascos prontos e no granel${r.esgotados ? `. <b>${r.esgotados}</b> ${r.esgotados === 1 ? 'perfume está' : 'perfumes estão'} sem estoque` : ''}.</p>
    </div>
    ${est.insumos.some((i) => i.acabando) ? `<p class="detalhe" style="margin:-6px 0 20px">Insumos acabando: <b>${esc(est.insumos.filter((i) => i.acabando).map((i) => i.nome.toLowerCase()).join(', '))}</b>. <button class="link" data-go="insumos" type="button">Ver insumos</button></p>` : ''}
    <button class="btn primario" data-act="entrada" type="button">${IC_MAIS} Registrar entrada</button>
    ${pratos ? `<ol class="prateleira">${est.produtos.map((p, i) => `
      <li class="item" style="--i:${i}" data-id="${esc(p.id)}">
        ${vidro(esc(p.id), p.ml_total ? Math.max(.05, p.ml_total / maior).toFixed(3) : 0)}
        <div>
          <h3>${esc(p.nome)}${selos(p)}</h3>
          <div class="ml">${nf.format(p.ml_total)}<em>ml no total</em></div>
          <p class="detalhe"><b>${nf.format(p.granel_ml)}</b> ml a granel${est.tamanhos.map((s) => ` · <b>${p.unidades[s]}</b> × ${s}`).join('')}</p>
          <p class="detalhe" style="margin-top:2px">No site: ${est.tamanhos.map((s) => `<b>${p.vende[s]}</b> de ${s}`).join(' ou ')}</p>
          <div class="acoes">
            <button class="btn pequeno" data-act="entrada" data-id="${esc(p.id)}" type="button">${IC_MAIS} Entrada</button>
            ${p.granel_ml > 0 ? `<button class="btn pequeno" data-act="envasar" data-id="${esc(p.id)}" type="button">Envasar</button>` : ''}
            <button class="btn pequeno" data-act="corrigir" data-id="${esc(p.id)}" type="button">Corrigir</button>
          </div>
        </div>
      </li>`).join('')}</ol>`
    : `<div class="vazio"><span class="simbolo"></span><b>A prateleira está vazia</b>Quando o primeiro lote maturar, registre a entrada e o vidro aparece aqui.</div>`}`;
  primeiraVez = false;
}

// O que a pessoa já digitou na aba "Dar baixa", para não se perder quando o painel redesenha
const rasc = {};
const rv = (id, padrao = '') => (id in rasc ? rasc[id] : padrao);
const opcoesSel = (id, atual, lista) => `<select id="${id}" data-rasc>${lista.map(([k, n]) => `<option value="${esc(k)}"${String(k) === String(atual) ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>`;

// Pagamento do pedido que vai ser criado: já pago, a pagar ou parcelado
function camposPagamento(p, modoPadrao) {
  const modo = rv(p + '-modo', modoPadrao);
  return `
    <div class="grade2">
      <div><label for="${p}-modo">Pagamento</label>${opcoesSel(p + '-modo', modo, [['pago', 'Já pago'], ['pendente', 'A pagar'], ['parcelado', 'Parcelado']])}</div>
      <div><label for="${p}-forma">Forma</label>${opcoesSel(p + '-forma', rv(p + '-forma', 'pix'), FORMAS_PAG)}</div>
    </div>
    <div id="${p}-parc"${modo === 'parcelado' ? '' : ' hidden'}><label for="${p}-n">Número de parcelas</label><input id="${p}-n" data-rasc type="number" min="2" max="12" inputmode="numeric" value="${esc(rv(p + '-n', 3))}" /></div>`;
}
const lerPagamento = (p) => ({ modo: $(p + '-modo').value, forma: $(p + '-forma').value, parcelas: $(p + '-n').value });

// Venda avulsa: a tela principal da baixa. Vários itens de uma vez, de qualquer produto do catálogo.
let avItens = [{ id: '', tam: '', qtd: 1 }];
const opcoesProdutos = (sel) => {
  const grupos = {};
  est.catalogo.forEach((p) => { (grupos[p.rotulo] ||= []).push(p); });
  return Object.entries(grupos).map(([r, itens]) => `<optgroup label="${esc(r)}">${itens.map((p) => `<option value="${esc(p.id)}"${p.id === sel ? ' selected' : ''}>${esc(p.nome)}</option>`).join('')}</optgroup>`).join('');
};
const tamanhosDe = (p) => (p ? p.variantes.filter((v) => v.tamanho !== 'unico') : []);
function normalizarAv() {
  avItens.forEach((it) => {
    let p = est.catalogo.find((x) => x.id === it.id);
    if (!p) { p = est.catalogo[0]; it.id = p ? p.id : ''; }
    const tams = tamanhosDe(p);
    if (!tams.some((v) => v.tamanho === it.tam)) it.tam = tams[0] ? tams[0].tamanho : '';
    it.qtd = Math.max(1, Number(it.qtd) || 1);
  });
}
function linhaAvulsa(it, i) {
  const p = est.catalogo.find((x) => x.id === it.id);
  const tams = tamanhosDe(p);
  return `<div class="av-linha" data-i="${i}">
    <div class="av-prod"><label for="av-p${i}">${i ? 'Outro item' : 'Produto'}</label><select id="av-p${i}" data-av="prod" data-i="${i}">${opcoesProdutos(it.id)}</select></div>
    <div class="av-tam"${tams.length ? '' : ' hidden'}><label for="av-t${i}">Tamanho</label><select id="av-t${i}" data-av="tam" data-i="${i}">${tams.map((v) => `<option value="${esc(v.tamanho)}"${v.tamanho === it.tam ? ' selected' : ''}>${esc(v.tamanho)}</option>`).join('')}</select></div>
    <div class="av-qtd"><label for="av-q${i}">Qtd</label><input id="av-q${i}" data-av="qtd" data-i="${i}" type="number" min="1" value="${it.qtd}" inputmode="numeric" /></div>
    ${avItens.length > 1 ? `<button class="btn-x" type="button" data-act="av-remover" data-i="${i}" aria-label="Tirar este item">${IC_X}</button>` : ''}
  </div>`;
}
function desenharLinhasAv() {
  normalizarAv();
  const el = $('av-linhas');
  if (el) el.innerHTML = avItens.map(linhaAvulsa).join('');
}
const itensAvulsa = () => { normalizarAv(); return avItens.map((it) => ({ id: it.id, tamanho: tamanhosDe(est.catalogo.find((x) => x.id === it.id)).length ? it.tam : '', qtd: it.qtd })); };

function desenharBaixa() {
  const foco = document.activeElement;
  if (foco && foco.closest && foco.closest('#t-baixa') && /^(TEXTAREA|INPUT|SELECT)$/.test(foco.tagName)) return;   // não redesenha enquanto a pessoa digita
  normalizarAv();
  const maisAberto = rv('mais-aberto') === '1' || Boolean(rv('pedido')) || Boolean(pendente && pendente.corpo.acao === 'pedido');
  $('t-baixa').innerHTML = `
    <div class="secao-topo"><h2 id="h-baixa">Dar baixa</h2><p class="legenda">alguém comprou? desconte do estoque e crie o pedido</p></div>
    <div class="quadro">
      <h3>Venda avulsa</h3>
      <p class="ajuda">Escolha o que foi vendido. Vale para perfume, creme, body splash e acessório.</p>
      <div id="av-linhas">${avItens.map(linhaAvulsa).join('')}</div>
      <button class="link" type="button" data-act="av-add" style="margin-top:14px">+ Adicionar outro item</button>
      <div class="grade2">
        <div><label for="av-nome">Cliente (opcional)</label><input id="av-nome" data-rasc value="${esc(rv('av-nome'))}" maxlength="80" /></div>
        <div><label for="av-tel">WhatsApp (opcional)</label><input id="av-tel" data-rasc value="${esc(rv('av-tel'))}" inputmode="tel" maxlength="30" /></div>
      </div>
      ${camposPagamento('av', 'pago')}
      <button class="btn primario cheio" id="conferir-avulsa" type="button" style="margin-top:24px">Conferir</button>
    </div>
    <div id="previa"></div>
    <details class="mais"${maisAberto ? ' open' : ''}>
      <summary><span>Mensagem de pedido do site</span><small>colar do WhatsApp ou do e-mail</small></summary>
      <div class="mais-corpo">
        <label for="pedido" style="margin-top:0">Cole a mensagem inteira, com a lista de itens</label>
        <textarea id="pedido" data-rasc placeholder="Olá Sposence! Acabei de fazer um pedido no site...">${esc(rv('pedido'))}</textarea>
        ${camposPagamento('pd', 'pendente')}
        <div class="grade2" style="margin-top:18px;gap:10px">
          <button class="btn" id="colar" type="button">Colar</button>
          <button class="btn primario" id="conferir" type="button">Conferir</button>
        </div>
      </div>
    </details>`;
  if (pendente) mostrarPrevia(pendente.previa, false);
}
const limparRascunhoBaixa = () => { ['pedido', 'av-nome', 'av-tel'].forEach((k) => delete rasc[k]); avItens = [{ id: '', tam: '', qtd: 1 }]; };

document.addEventListener('toggle', (ev) => { if (ev.target.matches && ev.target.matches('details.mais')) rasc['mais-aberto'] = ev.target.open ? '1' : ''; }, true);
const mudouAv = (ev) => {
  const t = ev.target;
  if (!(t.dataset && t.dataset.av)) return;
  const it = avItens[Number(t.dataset.i)];
  if (!it) return;
  if (t.dataset.av === 'qtd') { it.qtd = t.value; return; }
  if (ev.type !== 'change') return;
  if (t.dataset.av === 'prod') { it.id = t.value; it.tam = ''; desenharLinhasAv(); }
  else it.tam = t.value;
};
document.addEventListener('input', mudouAv);
document.addEventListener('change', mudouAv);

document.addEventListener('input', (ev) => { const t = ev.target; if (t.dataset && 'rasc' in t.dataset) rasc[t.id] = t.value; });
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (!(t.dataset && 'rasc' in t.dataset)) return;
  rasc[t.id] = t.value;
  const m = t.id.match(/^(pd|av)-modo$/);
  if (m) $(m[1] + '-parc').hidden = t.value !== 'parcelado';
});


/* ---------- pedidos ---------- */
const ETAPAS = [['novo', 'Novo'], ['separando', 'Separando'], ['pronto', 'Pronto'], ['entregue', 'Entregue']];
const ROTULO_ETAPA = { ...Object.fromEntries(ETAPAS), cancelado: 'Cancelado' };
const FORMAS_PAG = [['pix', 'Pix'], ['dinheiro', 'Dinheiro'], ['cartao', 'Cartão'], ['outro', 'Outro']];
const FILTROS_PED = [['abertos', 'Em aberto'], ['receber', 'A receber'], ['entregues', 'Entregues'], ['cancelados', 'Cancelados'], ['todos', 'Todos']];
const filtroPed = { cat: 'abertos' };
let animPed = true;          // os cartões entram em sequência na primeira vez e a cada troca de filtro
let pedidoAberto = null;
const din = (n) => 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dataCurta = (s) => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : '');
const dataHora = (s) => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)} às ${s.slice(11, 16)}` : '');
const IC_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

function passaFiltroPed(p, f) {
  if (f === 'todos') return true;
  if (f === 'abertos') return p.status !== 'entregue' && p.status !== 'cancelado';
  if (f === 'receber') return p.status !== 'cancelado' && p.falta > 0;
  if (f === 'entregues') return p.status === 'entregue';
  return p.status === 'cancelado';
}

function resumoItens(p) {
  const nomes = p.itens.map((i) => `${i.qtd}× ${i.nome}${i.variante ? ' ' + i.variante : ''}`);
  return nomes.length > 2 ? `${nomes.slice(0, 2).join(' · ')} · +${nomes.length - 2}` : nomes.join(' · ');
}

const chipEtapa = (status) => `<span class="chip-st" data-st="${status}">${ROTULO_ETAPA[status]}</span>`;

function trilha(status) {
  const i = Math.max(0, ETAPAS.findIndex(([k]) => k === status));
  return `<div class="trilha" style="--p:${(i / 3).toFixed(3)}" role="img" aria-label="Etapa: ${ROTULO_ETAPA[status]}"><i class="trilha__linha"><b></b></i>${ETAPAS.map(([, n], idx) => `<span class="trilha__passo${idx < i ? ' feito' : ''}${idx === i ? ' atual' : ''}"><em></em><small>${n}</small></span>`).join('')}</div>`;
}

function blocoPagamento(p) {
  const pagas = p.parcelas.filter((x) => x.pago).length;
  const frac = p.total ? Math.min(1, p.pago / p.total) : 1;
  const direita = p.parcelas.length > 1 ? `${pagas} de ${p.parcelas.length} parcelas` : (p.falta === 0 ? '' : 'à vista, a pagar');
  return `<div class="pg"><div class="pg-linha">${p.falta === 0 ? '<span class="pago-selo">Pago</span>' : `<span><b>${din(p.pago)}</b> de ${din(p.total)}</span>`}<span>${direita}</span></div><div class="pg-barra" aria-hidden="true"><i style="--p:${frac.toFixed(3)}"></i></div></div>`;
}

function cartaoPedido(p, i) {
  const nome = p.cliente?.nome;
  const cancelado = p.status === 'cancelado';
  return `<li><article class="ped${cancelado ? ' cancelado' : ''}" style="--i:${i}" data-act="ped-abrir" data-id="${esc(p.id)}" tabindex="0" role="button" aria-label="Abrir o pedido ${p.numero}${nome ? ' de ' + esc(nome) : ''}">
    <div class="ped-topo"><div><span class="ped-num">nº ${p.numero}, ${dataCurta(p.criado)}</span><h3 class="ped-nome${nome ? '' : ' sem-nome'}">${nome ? esc(nome) : 'Sem nome'}</h3></div>${chipEtapa(p.status)}</div>
    <p class="ped-itens">${esc(resumoItens(p))}</p>
    ${cancelado ? '' : trilha(p.status) + blocoPagamento(p)}
    <div class="ped-pe"><span class="ped-total">${din(p.total)}</span><span class="ped-origem">${p.origem === 'site' ? 'pelo site' : 'venda avulsa'}</span></div>
  </article></li>`;
}

/* ----- tela de pedidos: cabeçalho, métricas, lista ou quadro por etapa ----- */
let vistaPed = (() => { try { return localStorage.getItem('sp-ped-vista') || ''; } catch (_) { return ''; } })();
const cabeQuadro = () => matchMedia('(min-width: 1000px)').matches;
const vistaAtualPed = () => (cabeQuadro() ? (vistaPed || 'quadro') : 'lista');
const IC_SETA = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

// cartão compacto do quadro (a etapa já está dito pela coluna)
function cartaoMini(p, i) {
  const nome = p.cliente && p.cliente.nome;
  const frac = p.total ? Math.min(1, p.pago / p.total) : 1;
  return `<article class="mini" draggable="true" style="--i:${i}" data-act="ped-abrir" data-id="${esc(p.id)}" tabindex="0" role="button" aria-label="Abrir o pedido ${p.numero}${nome ? ' de ' + esc(nome) : ''}">
    <div class="mini-topo"><span class="ped-num">nº ${p.numero}, ${dataCurta(p.criado)}</span>${p.falta === 0 ? '<span class="pago-selo">Pago</span>' : `<span class="falta-selo">falta ${din(p.falta)}</span>`}</div>
    <h4 class="mini-nome${nome ? '' : ' sem-nome'}">${nome ? esc(nome) : 'Sem nome'}</h4>
    <p class="mini-itens">${esc(resumoItens(p))}</p>
    <div class="mini-pe"><b>${din(p.total)}</b><span class="ped-origem">${p.origem === 'site' ? 'site' : 'avulsa'}</span></div>
    <div class="pg-barra" aria-hidden="true"><i style="--p:${frac.toFixed(3)}"></i></div>
  </article>`;
}

function quadroPedidos() {
  let n = 0;
  const colunas = ETAPAS.map(([k, nome]) => {
    const todas = est.pedidos.filter((p) => p.status === k);
    const total = todas.reduce((t, p) => t + p.total, 0);
    const lista = k === 'entregue' ? todas.slice(0, 8) : todas;
    return `<section class="col" data-etapa="${k}" aria-label="${nome}">
      <header class="col-topo"><span class="chip-st" data-st="${k}">${nome}</span><small>${todas.length} · ${din(total)}</small></header>
      <div class="col-corpo">${lista.length ? lista.map((p) => cartaoMini(p, n++)).join('') : '<p class="col-vazio">Solte um pedido aqui</p>'}</div>
    </section>`;
  }).join('');
  const cancelados = est.pedidos.filter((p) => p.status === 'cancelado').length;
  return `<div class="quadro-ped" role="group" aria-label="Quadro de pedidos por etapa">${colunas}</div>
    <p class="detalhe" style="margin-top:14px">Arraste um cartão para mudar a etapa, ou toque nele para abrir.${cancelados ? ` <button class="link" type="button" data-ped-lista="cancelados">Ver ${cancelados} ${cancelados === 1 ? 'cancelado' : 'cancelados'}</button>` : ''}</p>`;
}

function vazioPedidos() {
  return `<section class="ped-vazio">
    <div class="ped-vazio__copy">
      <h3>Ainda não há <em>pedidos</em></h3>
      <p>Cada baixa que você confirmar vira um pedido aqui, com cliente, etapas, itens, observações e parcelas.</p>
      <button class="btn-site" type="button" data-act="ped-novo"><span>Dar baixa em uma venda</span>${IC_SETA}</button>
    </div>
    <div class="ped-vazio__foto">
      <picture>
        <source type="image/avif" sizes="(min-width: 900px) 45vw, 100vw" srcset="img/hero/sacola-640.avif 640w, img/hero/sacola-960.avif 960w, img/hero/sacola-1280.avif 1280w">
        <source type="image/webp" sizes="(min-width: 900px) 45vw, 100vw" srcset="img/hero/sacola-640.webp 640w, img/hero/sacola-960.webp 960w, img/hero/sacola-1280.webp 1280w">
        <img src="img/hero/sacola-1280.jpg" alt="" width="1600" height="1460" loading="lazy" decoding="async">
      </picture>
      <div class="ped-flutua">
        <span class="flutua-simbolo" aria-hidden="true"></span>
        <div><strong>Seu primeiro pedido</strong><small>aparece aqui ao dar baixa</small></div>
        <button class="flutua-seta" type="button" data-act="ped-novo" aria-label="Dar baixa em uma venda">${IC_SETA}</button>
      </div>
    </div>
  </section>`;
}

function desenharPedidos() {
  const todosPed = est.pedidos;
  const ativos = todosPed.filter((p) => p.status !== 'cancelado');
  const receber = ativos.reduce((t, p) => t + p.falta, 0);
  const comPendencia = ativos.filter((p) => p.falta > 0).length;
  const abertos = todosPed.filter((p) => passaFiltroPed(p, 'abertos')).length;
  const mes = (est.hoje || '').slice(0, 7);
  const vendidoMes = ativos.filter((p) => p.criado.slice(0, 7) === mes).reduce((t, p) => t + p.total, 0);
  const nomeMes = est.hoje ? new Date(est.hoje + 'T12:00:00').toLocaleDateString('pt-BR', { month: 'long' }) : 'o mês';
  const vista = vistaAtualPed();
  const el = $('t-pedidos');
  el.classList.toggle('anim', animPed);
  const corpoLista = () => `
    <div class="filtros" role="group" aria-label="Filtrar pedidos">${FILTROS_PED.map(([k, n]) => `<button type="button" data-ped-filtro="${k}" aria-pressed="${filtroPed.cat === k}">${n} <small>${todosPed.filter((p) => passaFiltroPed(p, k)).length}</small></button>`).join('')}</div>
    ${(() => { const lista = todosPed.filter((p) => passaFiltroPed(p, filtroPed.cat)); return lista.length ? `<ul class="ped-lista">${lista.map((p, i) => cartaoPedido(p, i)).join('')}</ul>` : '<div class="vazio"><span class="simbolo"></span><b>Nenhum pedido nesta lista</b>Troque o filtro para ver os outros.</div>'; })()}`;
  el.innerHTML = `
    <header class="ped-cabeca">
      <div>
        <span class="eyebrow">Painel de pedidos</span>
        <h2 id="h-pedidos">Seus <em>pedidos</em></h2>
        <p class="ped-lead">Acompanhe cada venda: o que falta pagar, separar e entregar.</p>
      </div>
      <div class="ped-acoes">
        ${todosPed.length && cabeQuadro() ? `<div class="troca troca-vista" role="group" aria-label="Como ver os pedidos">
          <button type="button" data-act="ped-vista" data-v="quadro" aria-pressed="${vista === 'quadro'}">Quadro</button>
          <button type="button" data-act="ped-vista" data-v="lista" aria-pressed="${vista === 'lista'}">Lista</button></div>` : ''}
        <button class="btn-site" type="button" data-act="ped-novo"><span>Dar baixa em uma venda</span>${IC_SETA}</button>
      </div>
    </header>
    <div class="ped-resumo">
      <div class="ped-receber"><small>A receber</small><div class="num">${din(receber)}</div><small>${comPendencia ? `${comPendencia} ${comPendencia === 1 ? 'pedido com pagamento pendente' : 'pedidos com pagamento pendente'}` : 'nada pendente'}</small></div>
      <div class="ped-abertos"><small>Em aberto</small><div class="num">${abertos}</div><small>${abertos === 1 ? 'pedido a entregar' : 'pedidos a entregar'}</small></div>
      <div class="ped-mes"><small>Vendido em ${nomeMes}</small><div class="num">${din(vendidoMes)}</div><small>${ativos.filter((p) => p.criado.slice(0, 7) === mes).length} no mês</small></div>
    </div>
    ${!todosPed.length ? vazioPedidos() : vista === 'quadro' ? quadroPedidos() : corpoLista()}`;
  animPed = false;
}

/* arrastar e soltar no quadro: mudar a etapa */
let arrastando = null;
document.addEventListener('dragstart', (ev) => {
  const c = ev.target.closest && ev.target.closest('.mini');
  if (!c) return;
  arrastando = c.dataset.id;
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', arrastando);
  c.classList.add('arrastando');
});
document.addEventListener('dragend', () => {
  arrastando = null;
  document.querySelectorAll('.mini.arrastando, .col.alvo').forEach((x) => x.classList.remove('arrastando', 'alvo'));
});
document.addEventListener('dragover', (ev) => {
  const col = ev.target.closest && ev.target.closest('.col');
  if (!col || !arrastando) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.col.alvo').forEach((x) => { if (x !== col) x.classList.remove('alvo'); });
  col.classList.add('alvo');
});
document.addEventListener('drop', async (ev) => {
  const col = ev.target.closest && ev.target.closest('.col');
  if (!col || !arrastando) return;
  ev.preventDefault();
  const id = arrastando;
  const etapa = col.dataset.etapa;
  col.classList.remove('alvo');
  const p = est.pedidos.find((x) => x.id === id);
  if (!p || p.status === etapa) return;
  try { await api('pedido_status', { id, status: etapa }); aviso(`Pedido nº ${p.numero}: ${ROTULO_ETAPA[etapa].toLowerCase()}.`); } catch (e) { falhou(e); }
});
let redesenhoPed = 0;
addEventListener('resize', () => { clearTimeout(redesenhoPed); redesenhoPed = setTimeout(() => { if (est && !$('t-pedidos').hidden) { animPed = false; desenharPedidos(); } }, 200); });


/* ----- detalhe do pedido (janela) ----- */
const voltarPedido = (id) => `<button class="voltar" type="button" data-act="ped-abrir" data-id="${esc(id)}">← Voltar ao pedido</button>`;

function abrirPedido(id) {

  abrirFolha(`Pedido nº ${p.numero}`, `
    <p class="legenda" style="margin-top:4px">${p.origem === 'site' ? 'pelo site' : 'venda avulsa'}, ${dataHora(p.criado)}</p>

    <section class="sec primeira">
      <div class="det-linha">${chipEtapa(p.status)}${p.entregue_em ? `<span class="detalhe">entregue em ${dataHora(p.entregue_em)}</span>` : ''}</div>
      ${cancelado
        ? `<p class="detalhe" style="margin-top:12px">Cancelado em ${dataHora(p.cancelado_em)}.${p.devolvido ? ' Os itens voltaram ao estoque.' : ''}</p>`
        : `${trilha(p.status)}<div class="troca" role="group" aria-label="Mudar a etapa">${ETAPAS.map(([k, n]) => `<button type="button" data-act="ped-status" data-id="${esc(p.id)}" data-st="${k}" aria-pressed="${p.status === k}">${n}</button>`).join('')}</div>`}
    </section>

    <section class="sec">
      <div class="det-linha"><h3>Cliente</h3><button class="link" type="button" data-act="ped-cliente" data-id="${esc(p.id)}">Editar</button></div>
      <p><b>${c.nome ? esc(c.nome) : '<i class="detalhe">sem nome</i>'}</b></p>
      ${c.telefone ? `<p class="detalhe">${zap ? `<a class="contato" href="${zap}" target="_blank" rel="noopener">${esc(c.telefone)}, chamar no WhatsApp</a>` : esc(c.telefone)}</p>` : ''}
      ${c.recebimento ? `<p class="detalhe">${esc(c.recebimento)}</p>` : ''}
    </section>

    <section class="sec">
      <div class="det-linha"><h3>Itens</h3>${cancelado ? '' : `<button class="link" type="button" data-act="ped-item" data-id="${esc(p.id)}">Adicionar item</button>`}</div>
      <ul class="det-itens">${p.itens.map((i) => `<li><span>${i.qtd}× ${esc(i.nome)}${i.variante ? `<i>${esc(i.variante)}</i>` : ''}</span><b>${din(i.total)}</b></li>`).join('')}</ul>
      <div class="total-linha"><span>Total</span><span>${din(p.total)}</span></div>
    </section>

    <section class="sec">
      <h3>Pagamento</h3>
      ${blocoPagamento(p)}
      <label for="ped-forma">Forma</label>
      <select id="ped-forma" data-id="${esc(p.id)}"${cancelado ? ' disabled' : ''}>${FORMAS_PAG.map(([k, n]) => `<option value="${k}"${p.forma === k ? ' selected' : ''}>${n}</option>`).join('')}</select>
      <ul class="parcelas">${p.parcelas.map((x) => `<li class="parcela${x.pago ? ' paga' : ''}">
        <button class="check" type="button" data-act="ped-parcela" data-id="${esc(p.id)}" data-n="${x.n}" aria-pressed="${x.pago}" aria-label="${p.parcelas.length > 1 ? `Parcela ${x.n}` : 'Pagamento'} ${x.pago ? 'paga' : 'a pagar'}"${cancelado ? ' disabled' : ''}>${IC_CHECK}</button>
        <div><b>${p.parcelas.length > 1 ? `Parcela ${x.n} de ${p.parcelas.length}` : 'Pagamento à vista'}</b><small>${din(x.valor)}, ${x.pago ? `pago em ${dataCurta(x.data)}` : 'a pagar'}</small></div></li>`).join('')}</ul>
      ${cancelado ? '' : `<div class="acoes">
        ${p.falta > 0 ? `<button class="btn pequeno" type="button" data-act="ped-quitar" data-id="${esc(p.id)}">Marcar tudo como pago</button>` : ''}
        <button class="btn pequeno" type="button" data-act="ped-parcelamento" data-id="${esc(p.id)}">Mudar parcelamento</button></div>`}
    </section>

    <section class="sec">
      <h3>Observações</h3>
      ${p.observacoes.length ? `<ul class="obs">${p.observacoes.map((o) => `<li><small>${dataHora(o.data)}</small>${esc(o.texto)}</li>`).join('')}</ul>` : '<p class="detalhe">Nenhuma ainda.</p>'}
      <form data-form="ped-obs" data-id="${esc(p.id)}">
        <label for="obs-texto">Nova observação</label>
        <textarea id="obs-texto" name="texto" style="min-height:84px" maxlength="500" placeholder="Ex.: pediu para entregar depois das 18h" required></textarea>
        <button class="btn cheio" type="submit" style="margin-top:12px">Adicionar observação</button>
      </form>
    </section>

    ${cancelado ? '' : `<section class="sec"><button class="btn perigo cheio" type="button" data-act="ped-cancelar" data-id="${esc(p.id)}">Cancelar pedido</button></section>`}

  $('folha').scrollTop = rolagem;

function folhaPedCliente(id) {
  const c = est.pedidos.find((x) => x.id === id).cliente || {};
  abrirFolha('Dados do cliente', `${voltarPedido(id)}
    <form data-form="ped-cliente" data-id="${esc(id)}">
      <label for="pc-nome">Nome</label><input id="pc-nome" name="nome" value="${esc(c.nome || '')}" maxlength="80" />
      <label for="pc-tel">WhatsApp</label><input id="pc-tel" name="telefone" value="${esc(c.telefone || '')}" inputmode="tel" maxlength="30" />
      <label for="pc-rec">Entrega ou retirada</label><input id="pc-rec" name="recebimento" value="${esc(c.recebimento || '')}" maxlength="200" placeholder="Ex.: Retirada com a Ana, sábado" />
      <button class="btn primario cheio" type="submit" style="margin-top:28px">Salvar</button>

  const atual = p.parcelas.length > 1 ? 'parcelado' : (p.parcelas[0]?.pago ? 'pago' : 'pendente');

  abrirFolha('Mudar parcelamento', `${voltarPedido(id)}
    <form data-form="ped-parc" data-id="${esc(id)}">

      <label for="pp-modo">Como será pago</label>
      <select id="pp-modo" name="modo"${travado ? ' disabled' : ''}>${[['pago', 'À vista, já pago'], ['pendente', 'À vista, a pagar'], ['parcelado', 'Parcelado']].map(([k, n]) => `<option value="${k}"${k === atual ? ' selected' : ''}>${n}</option>`).join('')}</select>
      <div id="pp-n-box"${atual === 'parcelado' ? '' : ' hidden'}><label for="pp-n">Número de parcelas</label><input id="pp-n" name="parcelas" type="number" min="2" max="12" inputmode="numeric" value="${Math.max(p.parcelas.length, 3)}"${travado ? ' disabled' : ''} /></div>

      <button class="btn perigo cheio" type="submit" style="margin-top:22px">Cancelar pedido</button>
    </form>`);
