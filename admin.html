    /* precisa de atenção */
    .in-aten { display: grid; gap: 12px; margin-top: 20px; }
    @media (min-width: 900px) { .in-aten { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .in-c { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 16px; padding: 12px 16px 12px 12px; background: var(--papel); border: 1px solid var(--linha); border-radius: 16px; transition: transform .55s var(--ease), box-shadow .55s var(--ease), border-color .4s; }
    @media (hover: hover) { .in-c:hover { transform: translateY(-4px); border-color: var(--forte); box-shadow: 0 22px 40px -28px rgba(70, 37, 6, .5); } }
    .in-c .foto { width: 64px; height: 64px; border-radius: 12px; background: var(--linha) center / cover; }
    .in-c .foto--vazia { display: grid; place-items: center; color: var(--acento); background: color-mix(in srgb, var(--acento) 12%, transparent); }
    .in-c .foto--vazia svg { width: 26px; height: 26px; }
    .in-c b { display: block; font-family: 'Philosopher', Georgia, serif; font-weight: 400; font-size: 21px; line-height: 1.15; }
    .in-c small { display: block; color: var(--suave); font-size: 13.5px; margin-top: 2px; }
    .in-c .alerta { color: var(--perigo); font-weight: 700; }
    .in-ok { padding: 22px; border: 1px dashed var(--forte); border-radius: 16px; color: var(--suave); margin-top: 20px; }
    .in-ok b { display: block; font-family: 'Philosopher', Georgia, serif; font-weight: 400; font-size: 24px; color: var(--tinta); }
    .in-entra > * { animation: abaEntra .9s var(--ease) both; }
    .in-entra > :nth-child(2) { animation-delay: .1s; } .in-entra > :nth-child(3) { animation-delay: .2s; } .in-entra > :nth-child(4) { animation-delay: .3s; } .in-entra > :nth-child(5) { animation-delay: .4s; }

    /* produtos com foto em Estoque e Catálogo */
    .item { grid-template-columns: 92px 1fr; }
    .item-foto { width: 92px; height: 92px; border-radius: 14px; background: var(--linha) center / cover; transition: transform .8s var(--ease); }
    .item:hover .item-foto { transform: scale(1.04); }
    .item .nivel { height: 5px; border-radius: 99px; background: var(--linha); overflow: hidden; margin-top: 10px; max-width: 220px; }
    .item .nivel i { display: block; height: 100%; background: linear-gradient(90deg, var(--ambar), var(--ouro)); border-radius: 99px; transform-origin: 0 50%; transform: scaleX(var(--n)); transition: transform .9s var(--ease); }
    .item .ml { font-size: 34px; }
    .linha { display: grid; grid-template-columns: 84px 1fr; gap: 4px 16px; align-items: start; }
    .linha-foto { grid-row: span 4; width: 84px; height: 84px; border-radius: 14px; background: var(--linha) center / cover; }
    .linha > :not(.linha-foto) { grid-column: 2; }
    .linha.fora .linha-foto { filter: grayscale(1); opacity: .6; }
    @media (prefers-reduced-motion: reduce) { .in-frame img, .in-float, .in-entra > * { animation: none; } }
    [style*="simbolo-loader.png"] { background-size: 44% !important; background-repeat: no-repeat !important; background-position: center !important; background-color: color-mix(in srgb, var(--acento) 14%, transparent) !important; }
    .es-grade { display: block; }
    .es-lado .btn { margin-top: 6px; }
    .fe { margin-top: 24px; }
    @media (min-width: 1000px) {
      .es-grade { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 56px; align-items: start; margin-top: 8px; }
      .es-lado { position: sticky; top: 92px; padding: 26px; background: var(--papel); border: 1px solid var(--linha); border-radius: 20px; }
      .es-lado .total { margin-top: 0; }
      .es-lado .btn { width: 100%; }
      .es-corpo .fe { margin-top: 0; }
    }
    @media (min-width: 900px) { .es-corpo .fe-grade { grid-template-columns: 1fr; } }
    @media (min-width: 981px) { .sp-menu { display: none; } }

    /* ======================================================================================
       Movimento: parallax (rolagem), revelação ao rolar, troca de aba suave, título por palavras,
       botão magnético. Tudo em transform/opacity/translate; respeita "reduzir movimento".
       ====================================================================================== */
    @keyframes inFrame { from { opacity: .35; transform: scale(1.07); } to { opacity: 1; transform: none; } }
    @keyframes palavra { to { transform: none; } }
    @keyframes revela { from { opacity: 0; translate: 0 44px; } to { opacity: 1; translate: 0 0; } }
    @keyframes pxFoto { from { transform: translateY(-7%); } to { transform: translateY(7%); } }
    @keyframes pxTile { from { transform: translateY(-9%); } to { transform: translateY(9%); } }
    @keyframes pxFloat { from { translate: 0 30px; } to { translate: 0 -30px; } }
    @keyframes pxMarca { to { transform: rotate(32deg) translateY(110px); } }
    @keyframes vtSai { to { opacity: 0; transform: translateY(-10px); } }
    @keyframes vtEntra { from { opacity: 0; transform: translateY(20px); } }

    /* hero: a foto entra em escala e corre mais devagar que a rolagem; marca d'água gira ao fundo */
    .in-hero { position: relative; isolation: isolate; }
    .in-marca { position: absolute; z-index: -1; right: -8%; top: -14%; width: min(560px, 70vw); aspect-ratio: 1; background: var(--tinta); opacity: .045; -webkit-mask: url('img/simbolo-loader.png') center / contain no-repeat; mask: url('img/simbolo-loader.png') center / contain no-repeat; pointer-events: none; }
    .in-frame { animation: inFrame 1.5s var(--ease) both; }
    .in-frame img { animation: none; height: 118%; margin-top: -9%; }
    .in-tile .foto { top: -12%; bottom: -12%; transition: scale 1.4s var(--ease); }
    @media (hover: hover) { .in-tile:hover .foto { transform: none; scale: 1.07; } }
    .btn-site { transition: color .45s var(--ease), border-color .45s var(--ease), transform .2s, translate .5s var(--ease); }

    /* título: palavra por palavra, saindo de uma máscara (como a landing) */
    .in-titulo .pl { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .14em; margin-bottom: -.14em; }
    .in-titulo .pl > span { display: inline-block; transform: translateY(108%); animation: palavra .95s var(--ease) forwards; animation-delay: calc(var(--w) * 110ms + 160ms); }

    /* navbar ao rolar */
    .sp-nav { view-transition-name: sp-nav; transition: box-shadow .5s var(--ease), background-color .4s; }
    .sp-nav__in { transition: min-height .45s var(--ease); }
    .sp-nav.rolou { box-shadow: 0 16px 34px -26px rgba(70, 37, 6, .55); background: color-mix(in srgb, var(--bg) 94%, transparent); }
    .sp-nav.rolou .sp-nav__in { min-height: 56px; }

    /* troca de aba: a antiga sai para cima, a nova sobe */
    ::view-transition-old(root) { animation: .28s cubic-bezier(.4, 0, 1, 1) both vtSai; }
    ::view-transition-new(root) { animation: .6s var(--ease) both vtEntra; }
    ::view-transition-group(sp-nav) { animation: none; }

    /* rolagem dirigida (Chrome, Edge, Safari recente); onde não existe, tudo aparece normal */
    @supports (animation-timeline: view()) {
      .in-frame img { animation: pxFoto linear both; animation-timeline: view(); animation-range: cover; }
      .in-tile .foto { animation: pxTile linear both; animation-timeline: view(); animation-range: cover; }
      .in-float { animation: flutua 6s ease-in-out infinite, pxFloat linear both; animation-timeline: auto, view(); animation-range: normal, cover; }
      .in-marca { animation: pxMarca linear both; animation-timeline: scroll(root); animation-range: 0 100vh; }
      .in-sec, .ped-lista > li, .mat-lista > li, .cli-lista > li, .fe-acc, .hist, .quadro, .ped-resumo > div, .es-lado { animation: revela linear both; animation-timeline: view(); animation-range: entry 2% entry 34%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .in-frame, .in-float, .in-marca, .in-tile .foto, .in-frame img { animation: none !important; }
      .in-titulo .pl > span { transform: none; animation: none; }
      .in-sec, .ped-lista > li, .mat-lista > li, .cli-lista > li, .fe-acc, .hist, .quadro, .ped-resumo > div, .es-lado { animation: none !important; }
      ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
    }
    main { overflow-x: clip; }

    /* ---- pedido: cartão maior e mais limpo ---- */
    .ped--g { padding: 24px 24px 20px; }
    .ped-cab { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; }
    .ped-fotos { display: flex; }
    .ped-fotos span { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--papel); background: var(--linha) center / cover; }
    .ped-fotos span + span { margin-left: -22px; }
    .ped--g .ped-nome { font-size: 30px; margin-top: 2px; }
    .ped-prods { display: grid; gap: 4px; margin-top: 16px; }
    .ped-item { font-size: 17px; line-height: 1.3; }
    .ped-item b { font-weight: 600; }
    .ped-item small { color: var(--suave); font-size: 14.5px; }
    .ped-mais { color: var(--suave); font-size: 14px; }
    .ped--g .trilha { margin: 20px 0 6px; }
    .ped--g .ped-pe { align-items: center; margin-top: 16px; }
    .ped--g .ped-total { font-size: 28px; }
    .ped-de { color: var(--suave); text-decoration: line-through; margin-left: 8px; font-size: 14px; }
    .ped-pg { padding: 6px 14px; border-radius: 99px; font-size: 13.5px; font-weight: 700; white-space: nowrap; }
    .ped-pg.ok { background: color-mix(in srgb, var(--acento) 18%, transparent); color: var(--tinta); }
    .ped-pg.pend { background: color-mix(in srgb, var(--ouro) 26%, transparent); color: var(--tinta); }
    @media (max-width: 520px) { .ped-cab { grid-template-columns: auto 1fr; } .ped-cab .chip-st { grid-column: 1 / -1; justify-self: start; } .ped--g .ped-nome { font-size: 26px; } }

    /* ---- histórico: cartão grande, com a foto e o nome do cliente ---- */
    .hist--g { display: grid; grid-template-columns: 76px 1fr auto; gap: 20px; align-items: center; padding: 22px 24px; margin-top: 14px; }
    .hist-foto { width: 76px; height: 76px; border-radius: 18px; background: var(--linha) center / cover; }
    .hist-tipo { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 700; background: color-mix(in srgb, var(--acento) 16%, transparent); }
    .hist-quem { font-family: 'Philosopher', serif; font-size: 26px; line-height: 1.12; margin-top: 8px; }
    .hist-desc { font-size: 16px; margin-top: 4px; }
    .hist--g .t { margin-top: 6px; }
    @media (max-width: 560px) { .hist--g { grid-template-columns: 64px 1fr; } .hist--g .btn { grid-column: 1 / -1; } .hist-foto { width: 64px; height: 64px; } }

    /* ---- baixa: observações, valor, desconto sugerido ---- */
    .prev-valor { margin-top: 6px; color: var(--suave); }
    .prev-valor b { color: var(--tinta); font-family: 'Philosopher', serif; font-size: 24px; font-weight: 400; }
    .prev-valor span { text-decoration: line-through; }
    .desc-sug { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--linha); }
    .desc-sug h4 { font-family: 'Philosopher', serif; font-weight: 400; font-size: 22px; }
    .desc-ops { display: grid; gap: 10px; margin-top: 12px; }
    @media (min-width: 700px) { .desc-ops { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .desc-op { text-align: left; display: grid; gap: 3px; padding: 14px 16px; border: 1px solid var(--forte); border-radius: 14px; background: transparent; color: var(--tinta); transition: transform .4s var(--ease), border-color .3s, background-color .3s; }
    .desc-op:hover { transform: translateY(-3px); border-color: var(--tinta); }
    .desc-op.rec { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 10%, transparent); }
    .desc-rot { font-size: 13px; font-weight: 700; color: var(--suave); }
    .desc-rot em { font-style: normal; color: var(--acento); margin-left: 4px; }
    .desc-op b { font-family: 'Philosopher', serif; font-weight: 400; font-size: 28px; line-height: 1.1; }
    .desc-op small { color: var(--suave); font-size: 13px; }
    .desc-nota { font-style: italic; }

    /* ---- ficha do cliente: resumo, sugestão e blocos que abrem ---- */
    .faixa--3 { grid-template-columns: repeat(3, auto); justify-content: start; }
    .cli-resumo { margin-bottom: 22px; }
    .cli-curte { margin-top: 14px; font-family: 'Philosopher', serif; font-size: 24px; color: var(--suave); }
    .cli-curte b { color: var(--tinta); font-weight: 400; }
    .cli-grade { display: grid; gap: 16px; align-items: start; }
    .cli-blocos { display: grid; gap: 12px; }
    .cli-acao { padding: 24px; }
    .cli-acao h3 { font-size: 28px; margin-bottom: 12px; }
    .cli-acao h3 em { color: var(--acento); }
    .cli-msg { margin-top: 20px; padding-top: 6px; border-top: 1px solid var(--linha); }
    .cli-msg label { margin-top: 14px; }
    .cli-corpo-in { padding: 4px 20px 22px; }
    .cli-bloco .fe-topo { padding: 16px 18px; }
    .cli-bloco .fe-nome { font-size: 22px; }
    .fe-ic { font-size: 1.9rem; color: var(--acento); width: 1.9rem; text-align: center; }
    @media (min-width: 1000px) { .cli-grade { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 22px; } }
    @media (min-width: 900px) { .ped-lista { grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 18px; } }
    .ped--g .ped-pe > div { display: flex; align-items: baseline; flex-wrap: nowrap; }
    .ped--g .ped-total, .ped-de { white-space: nowrap; }
    .ped--g .ped-num { display: block; line-height: 1.35; }
    .ped--g .ped-nome { overflow-wrap: anywhere; }
    @media (min-width: 1000px) { #t-baixa { max-width: none !important; } .bx-grade { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 0 32px; align-items: start; } }
    /* valores ocultos, como nos apps de banco */
    .vl { font-variant-numeric: tabular-nums; }
    html[data-ocultar="1"] .vl { letter-spacing: .08em; user-select: none; }

  <div id="login" hidden>
    <div class="entrada">

          <source type="image/webp" sizes="(min-width: 900px) 55vw, 100vw" srcset="img/hero/sacola-640.webp 640w, img/hero/sacola-960.webp 960w, img/hero/sacola-1280.webp 1280w">
          <img src="img/hero/sacola-1280.jpg" alt="" width="1600" height="1460" loading="lazy" decoding="async">

      </div>

      <div class="entrada__form">
        <div class="entrada__corpo">

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('pt-BR');
const brl = (n) => 'R$ ' + (Number.isInteger(Number(n)) ? String(n) : Number(n).toFixed(2).replace('.', ','));
const guardar = {
  ler: (k) => { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } },
  gravar: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (_) {} },
};
// "Manter conectado": na memória do aparelho; senão, só até fechar a aba
const sessao = {
  ler: () => { try { return localStorage.getItem('sp-admin') || sessionStorage.getItem('sp-admin') || ''; } catch (_) { return ''; } },
  persistente: () => { try { return !!localStorage.getItem('sp-admin'); } catch (_) { return false; } },
  gravar: (v, lembrar, usuario = '') => { try { ['sp-admin', 'sp-admin-user'].forEach((k) => { localStorage.removeItem(k); sessionStorage.removeItem(k); }); (lembrar ? localStorage : sessionStorage).setItem('sp-admin', v); (lembrar ? localStorage : sessionStorage).setItem('sp-admin-user', usuario); localStorage.setItem('sp-admin-ultimo-usuario', usuario); } catch (_) {} },
  usuario: () => { try { return localStorage.getItem('sp-admin-user') || sessionStorage.getItem('sp-admin-user') || ''; } catch (_) { return ''; } },
  ultimoUsuario: () => { try { return localStorage.getItem('sp-admin-ultimo-usuario') || ''; } catch (_) { return ''; } },
  limpar: () => { try { ['sp-admin', 'sp-admin-user'].forEach((k) => { localStorage.removeItem(k); sessionStorage.removeItem(k); }); } catch (_) {} },
};
const IC_OLHO = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
const IC_OLHO_RISCADO = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>';
const IC_MAIS = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const IC_X = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const IC_SOL = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>';
const IC_LUA = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.2 6.2 0 0 0 9.5 9.5Z"/></svg>';

let senha = sessao.ler();
let usuario = sessao.usuario();
let est = null;
let pendente = null;            // pedido esperando confirmação
let primeiraVez = true;         // a prateleira só anima na primeira vez
const filtro = { busca: '', cat: 'todos' };

/* ---------- servidor ---------- */
async function api(acao, corpo = {}) {
  const r = await fetch('/api/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-senha': senha, 'x-admin-usuario': encodeURIComponent(usuario) },
    body: JSON.stringify({ acao, ...corpo }),
  });
  const dados = await r.json().catch(() => ({ erro: 'O servidor respondeu algo inesperado. Tente de novo.' }));
  if (r.status === 401) { sair(est ? 'Sua sessão expirou. Entre de novo.' : ''); throw new Error(dados.erro); }
  if (!r.ok) throw Object.assign(new Error(dados.erro || 'Algo deu errado.'), { dados });
  if (dados.estado) { const antes = assinaturaPed(); est = dados.estado; if (antes !== assinaturaPed()) cliVelho = true; }
  if (dados.clientes) { cli = dados.clientes; cliVelho = false; }
  if (dados.estado) desenharTudo();
  return dados;
}
function aviso(msg, ruim, acao) {
  const el = document.createElement('div');
  el.className = 'toast' + (ruim ? ' bad' : '');
  const t = document.createElement('span'); t.textContent = msg; t.style.padding = '6px 0'; el.appendChild(t);
  const acoes = [].concat(acao || []).filter(Boolean);
  for (const a of acoes) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = a.rotulo;
    b.addEventListener('click', async () => { el.remove(); try { await a.fn(); } catch (e) { falhou(e); } });
    el.appendChild(b);
  }
  $('aviso').appendChild(el);
  setTimeout(() => el.remove(), acoes.length ? 8000 : ruim ? 6000 : 3200);
}
// "Desfazer" no aviso: só vale enquanto o movimento ainda for o mais recente
const idUltimo = () => est.historico[0]?.id;
function acaoDesfazer(antes) {
  const hid = idUltimo();
  if (!hid || hid === antes) return undefined;
  return { rotulo: 'Desfazer', fn: async () => {
    if (idUltimo() !== hid) { aviso('Já houve outro movimento depois. Desfaça pelo Histórico.', true); return; }
    await api('desfazer'); aviso('Desfeito.');
  } };
}
const falhou = (e) => aviso(e.message, true);

/* ---------- tema ---------- */
const temaAtual = () => document.documentElement.dataset.tema || 'light';
function iconeTema() {
  const escuro = temaAtual() === 'dark';
  for (const id of ['tema', 'tema-login']) {
    $(id).innerHTML = escuro ? IC_SOL : IC_LUA;
    $(id).setAttribute('aria-label', escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro');
  }
}
function alternarTema() {
  const novo = temaAtual() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.tema = novo;
  guardar.gravar('sp-admin-tema', novo);
  iconeTema();
}
$('tema').addEventListener('click', alternarTema);
$('tema-login').addEventListener('click', alternarTema);
iconeTema();

/* ---------- ocultar valores (como nos apps de banco) ----------
   Todo "R$ ..." que aparece na tela vira "R$ ••••" enquanto estiver oculto. Começa oculto toda vez que a página abre
   e não é guardado: é uma proteção para quando alguém olha a tela. O catálogo mostra os preços públicos do site e não é mascarado. */
let valoresOcultos = true;
const MASCARA_VALOR = 'R$ ••••';
const REGEX_VALOR = /R\$\s?\d[\d.]*(?:,\d{1,2})?/g;
function mascararValores(no) {
  if (!no) return;
  const textos = [];
  const aceita = (n) => { const p = n.parentElement; return p && /R\$\s?\d/.test(n.nodeValue) && !p.closest('textarea,input,script,style,option,select,.vl,#login,#t-catalogo,[data-sem-ocultar]'); };
  if (no.nodeType === 3) { if (aceita(no)) textos.push(no); }
  else if (no.nodeType === 1) {
    const w = document.createTreeWalker(no, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (aceita(n) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT) });
    while (w.nextNode()) textos.push(w.currentNode);
  }
  textos.forEach((n) => {
    const t = n.nodeValue, frag = document.createDocumentFragment();
    let i = 0;
    t.replace(REGEX_VALOR, (m, pos) => {
      if (pos > i) frag.append(t.slice(i, pos));
      const s = document.createElement('span');
      s.className = 'vl'; s.dataset.v = m; s.textContent = valoresOcultos ? MASCARA_VALOR : m;
      frag.append(s); i = pos + m.length; return m;
    });
    if (i < t.length) frag.append(t.slice(i));
    n.replaceWith(frag);
  });
}
function iconeValores() {
  const rotulo = valoresOcultos ? 'Mostrar valores' : 'Ocultar valores';
  const b = $('valores');
  b.innerHTML = valoresOcultos ? IC_OLHO_RISCADO : IC_OLHO;
  b.setAttribute('aria-pressed', String(valoresOcultos));
  b.setAttribute('aria-label', rotulo); b.title = rotulo;
  $('menu-valores').textContent = rotulo;
}
function definirValores(ocultos) {
  valoresOcultos = ocultos;
  document.documentElement.dataset.ocultar = ocultos ? '1' : '';
  document.querySelectorAll('.vl').forEach((s) => { s.textContent = ocultos ? MASCARA_VALOR : s.dataset.v; });
  iconeValores();
}
new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach(mascararValores))).observe(document.body, { childList: true, subtree: true });
$('valores').addEventListener('click', () => definirValores(!valoresOcultos));
$('menu-valores').addEventListener('click', () => { definirValores(!valoresOcultos); });
definirValores(true);
mascararValores($('app'));

/* ---------- entrada ---------- */
function mensagemLogin(texto, tipo) {
  const m = $('login-msg');
  m.textContent = texto || '';
  m.dataset.tipo = texto ? tipo : '';
}
function mostrarLogin(msg = '') {
  $('login').hidden = false;
  document.querySelector('.entrada__foto img').loading = 'eager';   // a foto só baixa quando a tela de entrada aparece
  $('senha').value = '';
  if (!$('usuario').value) $('usuario').value = sessao.ultimoUsuario();
  mensagemLogin(msg, 'dica');
  if (matchMedia('(hover: hover)').matches) ($('usuario').value ? $('senha') : $('usuario')).focus();   // no celular o teclado não abre sozinho
}
function sair(motivo = '') {
  senha = ''; usuario = ''; est = null; pendente = null;
  sessao.limpar();
  if ($('folha').open) $('folha').close();
  $('app').hidden = true;
  mostrarLogin(motivo);
}
const esqueleto = () => '<h2 id="h-pedidos">Pedidos</h2><p class="legenda">abrindo a bancada…</p><div style="margin-top:28px;border-top:1px solid var(--forte)">' + [1, 2, 3].map(() => '<div class="esq"><i class="a"></i><div><i class="b"></i><i class="c"></i><i class="d"></i></div></div>').join('') + '</div>';

async function entrar(tentativa, comEsqueleto, lembrar = sessao.persistente(), quem = usuario) {
  senha = tentativa; usuario = quem;
  if (comEsqueleto) { $('login').hidden = true; $('app').hidden = false; $('t-pedidos').innerHTML = esqueleto(); }
  try {
    await api('estado');
  } catch (e) {
    if (comEsqueleto && senha) {   // senha ok, mas o servidor falhou: mostra o erro com saída
      $('t-pedidos').innerHTML = `<h2 id="h-pedidos">Pedidos</h2><div class="vazio"><span class="simbolo"></span><b>Não consegui abrir a bancada</b>${esc(e.message)}<br><button class="btn primario" id="tentar" type="button">Tentar de novo</button></div>`;
    }
    throw e;
  }
  sessao.gravar(senha, lembrar, usuario);
  $('senha').value = ''; $('senha').type = 'password'; mensagemLogin('', '');
  $('login').hidden = true; $('app').hidden = false;
  irPara('inicio');
  carregarClientes(true).catch(() => {});
}

const campoSenha = $('senha');
const iconeOlho = () => {
  const visivel = campoSenha.type === 'text';
  $('ver-senha').innerHTML = visivel ? IC_OLHO_RISCADO : IC_OLHO;
  $('ver-senha').setAttribute('aria-pressed', String(visivel));
  $('ver-senha').setAttribute('aria-label', visivel ? 'Esconder senha' : 'Mostrar senha');
};
iconeOlho();
$('ver-senha').addEventListener('click', () => { campoSenha.type = campoSenha.type === 'password' ? 'text' : 'password'; iconeOlho(); campoSenha.focus(); });

function falhaLogin(texto) {
  mensagemLogin(texto, 'erro');
  campoSenha.setAttribute('aria-invalid', 'true');
  const g = $('grupo-senha');
  g.classList.remove('tremer'); void g.offsetWidth; g.classList.add('tremer');
  campoSenha.focus(); campoSenha.select();
}
$('usuario').addEventListener('input', () => { if ($('login-msg').dataset.tipo === 'erro') mensagemLogin('', ''); });
campoSenha.addEventListener('input', () => {
  campoSenha.removeAttribute('aria-invalid');
  if ($('login-msg').dataset.tipo === 'erro') mensagemLogin('', '');
});
// avisa do Caps Lock antes de a pessoa errar
campoSenha.addEventListener('keyup', (ev) => {
  const ligado = ev.getModifierState && ev.getModifierState('CapsLock');
  if (ligado && !$('login-msg').dataset.tipo) mensagemLogin('Caps Lock está ligado.', 'dica');
  else if (!ligado && $('login-msg').textContent === 'Caps Lock está ligado.') mensagemLogin('', '');
});

$('login-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const quem = $('usuario').value.trim();
  if (!quem) { mensagemLogin('Digite o usuário.', 'erro'); $('usuario').focus(); return; }
  if (!campoSenha.value) { falhaLogin('Digite a senha.'); return; }
  const botao = $('entrar');
  const rotulo = botao.querySelector('span');
  botao.disabled = true; botao.setAttribute('aria-busy', 'true'); rotulo.textContent = 'Entrando…';
  try { await entrar(campoSenha.value, false, $('lembrar').checked, quem); }
  catch (e) { falhaLogin(e.message); }
  finally { botao.disabled = false; botao.removeAttribute('aria-busy'); rotulo.textContent = 'Entrar na bancada'; }
});
$('sair').addEventListener('click', () => sair());

/* ---------- abas ---------- */
const ABAS = ['inicio', 'pedidos', 'estoque', 'clientes', 'baixa', 'catalogo', 'historico'];
function irPara(aba) {
  const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (document.startViewTransition && !reduz && !$('app').hidden) {
    // a troca nunca depende da animação: se o navegador demorar para pintar, ela acontece mesmo assim
    let feito = false; const rodar = () => { if (feito) return; feito = true; irParaAgora(aba); };
    const vt = document.startViewTransition(rodar); vt.ready.catch(() => {}); vt.finished.catch(() => {}); vt.updateCallbackDone.catch(() => {});
    setTimeout(rodar, 350); return;
  }
  irParaAgora(aba);
}
function irParaAgora(aba) {
  document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === aba));
  fecharMenu();
  ABAS.forEach((t) => { $('t-' + t).hidden = t !== aba; });
  window.scrollTo(0, 0);
  { const el = $('t-' + aba); el.classList.remove('aba-in'); void el.offsetWidth; el.classList.add('aba-in'); clearTimeout(irPara._t); irPara._t = setTimeout(() => el.classList.remove('aba-in'), 1500); }
  if (aba === 'clientes') { desenharClientes(); carregarClientes(); }
}
document.addEventListener('click', (ev) => { const t = ev.target.closest('[data-tab]'); if (t) irPara(t.dataset.tab); });
// navbar ganha sombra e encolhe ao rolar (sentinela, sem ouvir scroll)
{ const s = document.createElement('div'); s.style.cssText = 'position:absolute;top:0;left:0;width:1px;height:60px;pointer-events:none'; document.body.prepend(s);
  new IntersectionObserver(([e]) => $('sp-nav').classList.toggle('rolou', !e.isIntersecting)).observe(s); }
// botão do site puxa um pouco para o cursor
if (matchMedia('(hover: hover)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.addEventListener('pointermove', (ev) => { const b = ev.target.closest && ev.target.closest('.btn-site'); if (!b) return; const r = b.getBoundingClientRect(); b.style.translate = `${((ev.clientX - r.left - r.width / 2) * .2).toFixed(1)}px ${((ev.clientY - r.top - r.height / 2) * .3).toFixed(1)}px`; });
  document.addEventListener('pointerout', (ev) => { const b = ev.target.closest && ev.target.closest('.btn-site'); if (b && !b.contains(ev.relatedTarget)) b.style.translate = ''; });
}
// plano B do parallax, onde o navegador não tem rolagem dirigida
if (!(window.CSS && CSS.supports && CSS.supports('animation-timeline: view()')) && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  let esperando = false;
  const mover = () => { document.querySelectorAll('.in-frame img, .in-tile .foto').forEach((el) => { const r = el.parentElement.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return; el.style.transform = `translateY(${(-(r.top + r.height / 2 - innerHeight / 2) * .06).toFixed(1)}px)`; }); esperando = false; };
  addEventListener('scroll', () => { if (!esperando) { esperando = true; requestAnimationFrame(mover); } }, { passive: true });
}
function fecharMenu() { const m = $('sp-menu'); if (!m) return; m.classList.remove('aberto'); const bg = $('sp-burger'); bg.setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }

const imgCat = (id) => { const c = est.catalogo.find((x) => x.id === id); return c && c.imagem ? encodeURI(c.imagem) : 'img/simbolo-loader.png'; };

function contarNumeros(raiz) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  raiz.querySelectorAll('[data-n]').forEach((el) => {
    const alvo = Number(el.dataset.n), no = el.firstChild;
    if (!no || no.nodeType !== 3) return;
    const fmt = el.dataset.f === 'din' ? din : (v) => nf.format(Math.round(v));
    const t0 = performance.now();
    const passo = (t) => { const k = Math.min(1, (t - t0) / 1200); no.nodeValue = fmt(alvo * (1 - Math.pow(1 - k, 4))); if (k < 1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
}

/* ---------- pedidos ---------- */
const ETAPAS = [['novo', 'Novo'], ['separando', 'Separando'], ['pronto', 'Pronto'], ['entregue', 'Entregue']];
const ROTULO_ETAPA = { ...Object.fromEntries(ETAPAS), cancelado: 'Cancelado' };
const FORMAS_PAG = [['pix', 'Pix'], ['dinheiro', 'Dinheiro'], ['cartao', 'Cartão'], ['outro', 'Outro']];
const FILTROS_PED = [['abertos', 'Em aberto'], ['receber', 'A receber'], ['entregues', 'Entregues'], ['cancelados', 'Cancelados'], ['todos', 'Todos']];
const filtroPed = { cat: 'abertos' };
let animPed = true;          // os cartões entram em sequência na primeira vez e a cada troca de filtro
let pedidoAberto = null;
const din = (n) => 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dataCurta = (s) => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : '');
const dataHora = (s) => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)} às ${s.slice(11, 16)}` : '');
const IC_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

function passaFiltroPed(p, f) {
  if (f === 'todos') return true;
  if (f === 'abertos') return p.status !== 'entregue' && p.status !== 'cancelado';
  if (f === 'receber') return p.status !== 'cancelado' && p.falta > 0;
  if (f === 'entregues') return p.status === 'entregue';
  return p.status === 'cancelado';
}

function resumoItens(p) {
  const nomes = p.itens.map((i) => `${i.qtd}× ${i.nome}${i.variante ? ' ' + i.variante : ''}`);
  return nomes.length > 2 ? `${nomes.slice(0, 2).join(' · ')} · +${nomes.length - 2}` : nomes.join(' · ');
}

const chipEtapa = (status) => `<span class="chip-st" data-st="${status}">${ROTULO_ETAPA[status]}</span>`;

function trilha(status) {
  const i = Math.max(0, ETAPAS.findIndex(([k]) => k === status));
  return `<div class="trilha" style="--p:${(i / 3).toFixed(3)}" role="img" aria-label="Etapa: ${ROTULO_ETAPA[status]}"><i class="trilha__linha"><b></b></i>${ETAPAS.map(([, n], idx) => `<span class="trilha__passo${idx < i ? ' feito' : ''}${idx === i ? ' atual' : ''}"><em></em><small>${n}</small></span>`).join('')}</div>`;
}

function blocoPagamento(p) {
  const pagas = p.parcelas.filter((x) => x.pago).length;
  const frac = p.total ? Math.min(1, p.pago / p.total) : 1;
  const direita = p.parcelas.length > 1 ? `${pagas} de ${p.parcelas.length} parcelas` : (p.falta === 0 ? '' : 'à vista, a pagar');
  return `<div class="pg"><div class="pg-linha">${p.falta === 0 ? '<span class="pago-selo">Pago</span>' : `<span><b>${din(p.pago)}</b> de ${din(p.total)}</span>`}<span>${direita}</span></div><div class="pg-barra" aria-hidden="true"><i style="--p:${frac.toFixed(3)}"></i></div></div>`;
}

function cartaoPedido(p, i) {
  const nome = p.cliente?.nome;
  const cancelado = p.status === 'cancelado';
  const fotos = p.itens.slice(0, 3).map((it) => `<span style="background-image:url('${esc(imgCat(it.produto_id))}')"></span>`).join('');
  const linhas = p.itens.slice(0, 2).map((it) => `<span class="ped-item"><b>${esc(it.nome)}</b>${it.variante ? ` <small>${esc(it.variante)}</small>` : ''}${it.qtd > 1 ? ` <small>× ${it.qtd}</small>` : ''}</span>`).join('');
  const mais = p.itens.length > 2 ? `<span class="ped-item ped-mais">+ ${p.itens.length - 2} ${p.itens.length - 2 === 1 ? 'item' : 'itens'}</span>` : '';
  return `<li><article class="ped ped--g${cancelado ? ' cancelado' : ''}" style="--i:${i}" data-act="ped-abrir" data-id="${esc(p.id)}" tabindex="0" role="button" aria-label="Abrir o pedido ${p.numero}${nome ? ' de ' + esc(nome) : ''}">
    <div class="ped-cab">
      <div class="ped-fotos" aria-hidden="true">${fotos}</div>
      <div class="ped-quem"><span class="ped-num">nº ${p.numero}, ${dataCurta(p.criado)} · ${p.origem === 'site' ? 'pelo site' : 'venda avulsa'}</span><h3 class="ped-nome${nome ? '' : ' sem-nome'}">${nome ? esc(nome) : 'Sem nome'}</h3></div>
      ${chipEtapa(p.status)}
    </div>
    <p class="ped-prods">${linhas}${mais}</p>
    ${cancelado ? '' : trilha(p.status)}
    <div class="ped-pe"><div><span class="ped-total">${din(p.total)}</span>${p.desconto ? `<small class="ped-de">de ${din(p.desconto.de)}</small>` : ''}</div>
      ${cancelado ? '' : p.falta > 0 ? `<span class="ped-pg pend">Falta ${din(p.falta)}</span>` : '<span class="ped-pg ok">Pago</span>'}</div>
  </article></li>`;
}

/* ----- tela de pedidos: cabeçalho, métricas, lista ou quadro por etapa ----- */
let vistaPed = (() => { try { return localStorage.getItem('sp-ped-vista') || ''; } catch (_) { return ''; } })();

const IC_SETA = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

// cartão compacto do quadro (a etapa já está dito pela coluna)
function cartaoMini(p, i) {
  const nome = p.cliente && p.cliente.nome;
  const frac = p.total ? Math.min(1, p.pago / p.total) : 1;
  return `<article class="mini" draggable="true" style="--i:${i}" data-act="ped-abrir" data-id="${esc(p.id)}" tabindex="0" role="button" aria-label="Abrir o pedido ${p.numero}${nome ? ' de ' + esc(nome) : ''}">
    <div class="mini-topo"><span class="ped-num">nº ${p.numero}, ${dataCurta(p.criado)}</span>${p.falta === 0 ? '<span class="pago-selo">Pago</span>' : `<span class="falta-selo">falta ${din(p.falta)}</span>`}</div>
    <h4 class="mini-nome${nome ? '' : ' sem-nome'}">${nome ? esc(nome) : 'Sem nome'}</h4>
    <p class="mini-itens">${esc(resumoItens(p))}</p>
    <div class="mini-pe"><b>${din(p.total)}</b><span class="ped-origem">${p.origem === 'site' ? 'site' : 'avulsa'}</span></div>
    <div class="pg-barra" aria-hidden="true"><i style="--p:${frac.toFixed(3)}"></i></div>
  </article>`;
}

function quadroPedidos() {
  let n = 0;
  const colunas = ETAPAS.map(([k, nome]) => {
    const todas = est.pedidos.filter((p) => p.status === k);
    const total = todas.reduce((t, p) => t + p.total, 0);
    const lista = k === 'entregue' ? todas.slice(0, 8) : todas;
    return `<section class="col" data-etapa="${k}" aria-label="${nome}">
      <header class="col-topo"><span class="chip-st" data-st="${k}">${nome}</span><small>${todas.length} · ${din(total)}</small></header>
      <div class="col-corpo">${lista.length ? lista.map((p) => cartaoMini(p, n++)).join('') : '<p class="col-vazio">Solte um pedido aqui</p>'}</div>
    </section>`;
  }).join('');
  const cancelados = est.pedidos.filter((p) => p.status === 'cancelado').length;
  return `<div class="quadro-ped" role="group" aria-label="Quadro de pedidos por etapa">${colunas}</div>
    <p class="detalhe" style="margin-top:14px">Arraste um cartão para mudar a etapa, ou toque nele para abrir.${cancelados ? ` <button class="link" type="button" data-ped-lista="cancelados">Ver ${cancelados} ${cancelados === 1 ? 'cancelado' : 'cancelados'}</button>` : ''}</p>`;
}

function vazioPedidos() {
  return `<section class="ped-vazio">
    <div class="ped-vazio__copy">
      <h3>Ainda não há <em>pedidos</em></h3>
      <p>Cada baixa que você confirmar vira um pedido aqui, com cliente, etapas, itens, observações e parcelas.</p>

        <source type="image/webp" sizes="(min-width: 900px) 45vw, 100vw" srcset="img/hero/sacola-640.webp 640w, img/hero/sacola-960.webp 960w, img/hero/sacola-1280.webp 1280w">

  el.innerHTML = `

/* arrastar e soltar no quadro: mudar a etapa */
let arrastando = null;
document.addEventListener('dragstart', (ev) => {
  const c = ev.target.closest && ev.target.closest('.mini');
  if (!c) return;
  arrastando = c.dataset.id;
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', arrastando);
  c.classList.add('arrastando');
});
document.addEventListener('dragend', () => {
  arrastando = null;
  document.querySelectorAll('.mini.arrastando, .col.alvo').forEach((x) => x.classList.remove('arrastando', 'alvo'));
});
document.addEventListener('dragover', (ev) => {
  const col = ev.target.closest && ev.target.closest('.col');
  if (!col || !arrastando) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.col.alvo').forEach((x) => { if (x !== col) x.classList.remove('alvo'); });
  col.classList.add('alvo');
});
document.addEventListener('drop', async (ev) => {
  const col = ev.target.closest && ev.target.closest('.col');
  if (!col || !arrastando) return;
  ev.preventDefault();
  const id = arrastando;
  const etapa = col.dataset.etapa;
  col.classList.remove('alvo');
  const p = est.pedidos.find((x) => x.id === id);
  if (!p || p.status === etapa) return;
  try { await api('pedido_status', { id, status: etapa }); aviso(`Pedido nº ${p.numero}: ${ROTULO_ETAPA[etapa].toLowerCase()}.`); } catch (e) { falhou(e); }
});
let redesenhoPed = 0;
addEventListener('resize', () => { clearTimeout(redesenhoPed); redesenhoPed = setTimeout(() => { if (est && !$('t-pedidos').hidden) { animPed = false; desenharPedidos(); } }, 200); });

function atualizarItemPedido(origem) {
  const sel = $('pi-prod');
  if (!sel) return;
  const livre = sel.value === '__livre';
  $('pi-livre').hidden = !livre;
  $('pi-nome').required = livre;
  const p = est.catalogo.find((x) => x.id === sel.value);
  const tams = p ? p.variantes.filter((v) => v.tamanho !== 'unico') : [];
  $('pi-tam-box').hidden = livre || !tams.length;
  if (origem !== 'tamanho') $('pi-tam').innerHTML = tams.map((v) => `<option value="${esc(v.tamanho)}">${esc(v.tamanho)}</option>`).join('');
  const atual = p ? (p.variantes.find((v) => v.tamanho === ($('pi-tam-box').hidden ? 'unico' : $('pi-tam').value)) || p.variantes[0]) : null;
  if (atual && origem !== 'preco') $('pi-preco').value = String(atual.preco).replace('.', ',');
  if (livre && origem !== 'preco') $('pi-preco').value = '';
  $('pi-dica').textContent = p && p.categoria === 'perfumes' && p.controlado
    ? 'Perfumes de 30 ml e 50 ml descontam do estoque e dos insumos.' : (livre ? 'Item sem controle de estoque.' : '');
}

/* ---------- maturação ---------- */
let vistaEstoque = 'prateleira';   // 'prateleira' | 'maturacao'
let animMat = true;                // a lista entra em sequência quando a aba é aberta
const dataBR = (s) => (s ? `${String(s).slice(8, 10)}/${String(s).slice(5, 7)}` : '');
const dataBRano = (s) => (s ? `${String(s).slice(8, 10)}/${String(s).slice(5, 7)}/${String(s).slice(0, 4)}` : '');
const somaDiasCli = (s, n) => { const [a, m, d] = s.split('-').map(Number); return new Date(Date.UTC(a, m - 1, d + n)).toISOString().slice(0, 10); };
const difDiasCli = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
const nDias = (n) => `${n} ${Math.abs(n) === 1 ? 'dia' : 'dias'}`;

const trocaEstoque = () => `<div class="troca troca-vista" role="group" aria-label="O que mostrar">
  <button type="button" data-act="vista-estoque" data-v="prateleira" aria-pressed="${vistaEstoque === 'prateleira'}">Na prateleira</button>
  <button type="button" data-act="vista-estoque" data-v="maturacao" aria-pressed="${vistaEstoque === 'maturacao'}">Em maturação <small>${est.maturacao.filter((l) => l.status === 'maturando').length}</small></button>
  <button type="button" data-act="vista-estoque" data-v="insumos" aria-pressed="${vistaEstoque === 'insumos'}">Insumos${est.insumos.some((i) => i.acabando) ? ' <small>!</small>' : ''}</button></div>`;

function cartaoLote(l, i) {
  const feito = l.status === 'concluido';
  const pronto = !feito && l.dias_restantes <= 0;
  const rotulo = feito ? 'No estoque' : pronto ? 'Pronto' : 'Maturando';
  const st = feito ? 'entregue' : pronto ? 'pronto' : 'separando';
  const legenda = feito ? `foi para o estoque em ${dataBR(String(l.concluido_em).slice(0, 10))}${l.ml_entrada && l.ml_entrada !== l.ml ? `, com ${nf.format(l.ml_entrada)} ml` : ''}`
    : l.dias_restantes > 0 ? `faltam ${nDias(l.dias_restantes)}`
    : l.dias_restantes === 0 ? 'fica pronto hoje'
    : `pronto há ${nDias(-l.dias_restantes)}`;
  return `<li class="lote${pronto ? ' pronto' : ''}${feito ? ' feito' : ''}" style="--i:${i}">
    <div class="ped-topo"><h3 class="ped-nome">${esc(l.nome)}</h3><span class="chip-st" data-st="${st}">${rotulo}</span></div>
    <div class="qtd">${nf.format(l.ml)}<em>ml</em></div>
    <div class="lote-datas">
      <span><small>começou</small>${dataBR(l.inicio)}</span>
      <span><small>${feito ? 'ficou pronto' : 'fica pronto'}</small>${dataBR(l.previsto)}</span>
      <span><small>maturação</small>${nDias(l.dias)}</span>
    </div>
    <div class="pg"><div class="pg-linha"><span class="${pronto ? 'pago-selo' : ''}">${esc(legenda)}</span><span>${Math.round(l.progresso * 100)}%</span></div><div class="pg-barra" aria-hidden="true"><i style="--p:${l.progresso.toFixed(3)}"></i></div></div>
    ${l.obs ? `<p class="detalhe" style="margin-top:12px">${esc(l.obs)}</p>` : ''}
    <div class="acoes">
      ${feito ? '' : `<button class="btn ${pronto ? 'primario ' : ''}pequeno" type="button" data-act="mat-concluir" data-id="${esc(l.id)}">Colocar no estoque</button>
      <button class="btn pequeno" type="button" data-act="mat-editar" data-id="${esc(l.id)}">Editar</button>
      <button class="btn pequeno" type="button" data-act="mat-chamar" data-id="${esc(l.id)}">Quem chamar</button>`}
      <button class="btn pequeno" type="button" data-act="mat-excluir" data-id="${esc(l.id)}">Excluir</button>
    </div>
  </li>`;
}

function desenharMaturacao() {
  const ativos = est.maturacao.filter((l) => l.status === 'maturando');
  const feitos = est.maturacao.filter((l) => l.status === 'concluido');
  const mlTotal = ativos.reduce((t, l) => t + l.ml, 0);
  const prontos = ativos.filter((l) => l.dias_restantes <= 0).length;
  const ultimo = ativos.reduce((m, l) => (l.previsto > m ? l.previsto : m), '');
  const diasAteTodos = ultimo ? difDiasCli(est.hoje, ultimo) : 0;
  const el = $('t-estoque');
  el.classList.toggle('anim', animMat);
  el.innerHTML = `
    ${cabecaSecao('Bancada', 'Seu <em>estoque</em>', 'Essência em ml, do granel ao frasco.', 'h-estoque')}
    ${trocaEstoque()}
    ${ativos.length ? `<div class="total">
        <div class="num">${nf.format(mlTotal)}<em>ml</em></div>
        <p>de essência maturando, em <b>${ativos.length}</b> ${ativos.length === 1 ? 'lote' : 'lotes'}.
        ${prontos === ativos.length ? ` <b>Tudo pronto</b> para colocar no estoque.` : prontos ? ` <b>${prontos}</b> já ${prontos === 1 ? 'está pronto' : 'estão prontos'}.` : ''}
        ${ativos.length > 1 && diasAteTodos > 0 ? ` A linha completa fica pronta em <b>${dataBRano(ultimo)}</b>, daqui a ${nDias(diasAteTodos)}.` : ''}
        ${ativos.length === 1 && diasAteTodos > 0 ? ` Fica pronto em <b>${dataBRano(ultimo)}</b>.` : ''}</p>
      </div>` : ''}
    <button class="btn primario" data-act="mat-novo" type="button">${IC_MAIS} Novo lote em maturação</button>
    ${ativos.length ? `<ul class="mat-lista">${ativos.map((l, i) => cartaoLote(l, i)).join('')}</ul>`
      : '<div class="vazio"><span class="simbolo"></span><b>Nada maturando agora</b>Registre cada lote com a data em que começou e os dias de maturação. O painel mostra quanto falta e quando dá para lançar.</div>'}
    ${feitos.length ? `<h3 class="sub-titulo">Já foram para o estoque</h3><ul class="mat-lista mat-feitos">${feitos.map((l, i) => cartaoLote(l, i)).join('')}</ul>` : ''}`;
  animMat = false;
}

/* ----- janelas do lote ----- */
function folhaLote(id) {
  const l = id ? est.maturacao.find((x) => x.id === id) : null;

  abrirFolha(l ? 'Editar lote' : 'Novo lote em maturação', `

      <div id="ml-livre"${livre ? '' : ' hidden'}><label for="ml-nome">Nome do perfume</label><input id="ml-nome" name="nome" value="${esc(l && !l.produto_id ? l.nome : '')}" maxlength="80" placeholder="Ex.: Dior J'adore" /></div>
      <div class="grade2">
        <div><label for="ml-ml">Quantos ml</label><input id="ml-ml" name="ml" type="number" min="1" inputmode="numeric" required value="${l ? l.ml : ''}" placeholder="180" /></div>
        <div><label for="ml-ini">Começou em</label><input id="ml-ini" name="inicio" type="date" required value="${l ? l.inicio : est.hoje}" /></div>
      </div>
      <label for="ml-dias">Dias de maturação</label>
      <input id="ml-dias" name="dias" type="number" min="1" max="365" inputmode="numeric" required value="${l ? l.dias : 30}" />
      <div class="escolha" id="ml-atalhos" style="column-gap:20px;flex-wrap:wrap">${[15, 30, 45, 60].map((n) => `<button type="button" data-dias="${n}" aria-pressed="false">${n} dias</button>`).join('')}</div>
      <p class="ajuda" id="ml-previsto" aria-live="polite"></p>
      <label for="ml-obs">Observação (opcional)</label>
      <input id="ml-obs" name="obs" maxlength="200" value="${esc(l ? l.obs : '')}" placeholder="Ex.: lote do fornecedor novo" />
      <button class="btn primario cheio" type="submit" style="margin-top:28px">${l ? 'Salvar lote' : 'Registrar lote'}</button>
    </form>`);
  atualizarPrevisto();
}
function atualizarPrevisto() {
  const ini = $('ml-ini'), dias = $('ml-dias');
  if (!ini || !dias) return;
  $('ml-livre').hidden = $('ml-prod').value !== '';
  $('ml-nome').required = $('ml-prod').value === '';
  document.querySelectorAll('#ml-atalhos button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.dias === dias.value));
  const n = Number(dias.value);
  if (!ini.value || !n) { $('ml-previsto').textContent = ''; return; }
  const previsto = somaDiasCli(ini.value, n);
  const falta = difDiasCli(est.hoje, previsto);
  $('ml-previsto').textContent = `Fica pronto em ${dataBRano(previsto)}${falta > 0 ? `, daqui a ${nDias(falta)}` : falta === 0 ? ', hoje' : `, há ${nDias(-falta)}`}.`;
}

function folhaConcluirLote(id) {
  const l = est.maturacao.find((x) => x.id === id);
  const parecido = est.perfumes.find((p) => l.produto_id === p.id) || est.perfumes.find((p) => p.nome.toLowerCase() === l.nome.toLowerCase());
  abrirFolha('Colocar no estoque', `
    <form data-form="mat-concluir" data-id="${esc(id)}">

      <p class="ajuda">Ainda não cadastrou? Crie em Catálogo, Novo, e volte aqui.</p>
      <label for="mc-ml">Quantos ml entram no estoque</label>
      <input id="mc-ml" name="ml" type="number" min="1" inputmode="numeric" required value="${l.ml}" />
      <p class="ajuda">Se perdeu um pouco na filtragem, ajuste aqui. Os ml entram como granel, prontos para envasar.</p>

}

/* ---------- clientes ---------- */
let cli = null;              // { lista, chamar } vindos do servidor
let cliVelho = true;         // os pedidos mudaram: buscar de novo
let vistaCli = 'clientes';   // 'clientes' | 'lancamento'
const filtroCli = { busca: '', perfil: 'todos' };
const lancForm = { alvo: '', perfil: 'doces', publico: 'feminino', notas: '', nome: '' };
let lanc = null;             // resultado do último simulador de lançamento
let animCli = true;
const PERFIS_ORDEM = ['doces', 'frescos', 'noturnos', 'elegantes'];
const SING_PERFIL = { doces: 'doce', frescos: 'fresco', noturnos: 'noturno', elegantes: 'elegante' };
const qtdPerfil = (k, n) => n + ' ' + (n === 1 ? SING_PERFIL[k] : k);
const ROT_PERFIL = { doces: 'doces', frescos: 'frescos', noturnos: 'noturnos', elegantes: 'elegantes', 'sem perfil': 'perfil misto ou sem dados' };
const ROT_AFIN = { alta: 'Alta', media: 'Média', baixa: 'Baixa', 'sem dados': 'Sem dados' };
const normalNome = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const primeiroNome = (n) => String(n || '').trim().split(/\s+/)[0] || '';
const assinaturaPed = () => (est ? `${est.pedidos.length}|${est.pedidos.map((p) => p.id + p.status + p.total).join(',')}` : '');
const dinInt = (n) => 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const quandoDias = (d) => (d === 0 ? 'hoje' : d === 1 ? 'ontem' : `há ${d} dias`);

async function carregarClientes(forcar) {
  if (!forcar && cli && !cliVelho) return;
  try {
    const d = await api('clientes');
    cli = d.clientes; cliVelho = false;
    desenharClientes(); desenharInicio();
  } catch (e) { if (!$('t-clientes').hidden) falhou(e); }
}

/* ----- peças visuais ----- */
function barraGosto(perfil, declarados) {
  const ativos = PERFIS_ORDEM.filter((k) => perfil[k]);
  if (!ativos.length) return declarados && declarados.length ? `<p class="gosto-vazio">declarou na conta: ${esc(declarados.join(', '))}</p>` : '<p class="gosto-vazio">sem compras de perfume ainda</p>';
  const legenda = ativos.map((k) => qtdPerfil(k, perfil[k])).join(', ');
  return `<div class="gosto" role="img" aria-label="Gosto: ${legenda}">${ativos.map((k) => `<i class="perfil-${k}" style="flex:${perfil[k]}"></i>`).join('')}</div>
    <p class="gosto-legenda">${ativos.map((k) => `<span><b class="perfil-${k}"></b>${qtdPerfil(k, perfil[k])}</span>`).join('')}</p>`;
}
const pilulaAfin = (rotulo, pts) => `<span class="afin" data-r="${esc(rotulo)}">${ROT_AFIN[rotulo]}${rotulo === 'sem dados' ? '' : ` · ${pts}`}</span>`;
const telefoneLink = (tel) => { const d = String(tel || '').replace(/\D/g, ''); return d.length >= 10 ? `https://wa.me/${d.startsWith('55') ? d : '55' + d}` : ''; };

/* ----- mensagens de WhatsApp: usam o que se sabe da pessoa e da fragrância (você revisa e envia) ----- */
const juntarMotivos = (m) => m.join(' e ').replace(/ e perfumes /g, ' e ');
const listaPt = (a) => (a.length > 1 ? `${a.slice(0, -1).join(', ')} e ${a[a.length - 1]}` : a[0] || '');
const primeirasNotas = (txt, n) => String(txt || '').split(',').map((s) => s.trim().toLowerCase()).filter(Boolean).slice(0, n);
// "notas de pera, melão, jasmim e almíscar": saída, coração e fundo, sem encher
const notasTexto = (p) => {
  const n = (p && p.notas) || {};
  const todas = [...primeirasNotas(n.topo, 2), ...primeirasNotas(n.coracao, 1), ...primeirasNotas(n.fundo, 1)];
  return todas.length ? `notas de ${listaPt([...new Set(todas)])}` : '';
};
const precoTexto2 = (p) => (p && p.variantes && p.variantes.length ? `a partir de ${dinInt(Math.min(...p.variantes.map((v) => v.preco)))}` : '');

// tipo: "recompra" (já comprou e está na hora), "novidade" (lançamento) ou "conhecer" (tem conta, ainda não comprou)
function msgCliente(c, tipo, rec) {
  const nome = primeiroNome(c.nome);
  const abre = `Oi ${nome}, tudo bem? Aqui é da Sposence.`;
  if (!rec) return `${abre} Passando para saber se você quer dar uma olhada nas novidades.`;
  const p = est.catalogo.find((x) => x.id === rec.id);
  const sugestao = `${rec.nome}${p && p.inspirado && !normalNome(p.inspirado).includes(normalNome(rec.nome)) ? `, inspirado no ${p.inspirado}` : ''}`;
  const notas = notasTexto(p);
  const preco = precoTexto2(p);
  const gosto = rec.motivos.length ? juntarMotivos(rec.motivos) : (c.dominante ? `perfumes ${c.dominante}` : '');
  const ultimoItem = c.pedidos[0] && c.pedidos[0].itens[0] ? c.pedidos[0].itens[0].replace(/^\d+×\s*/, '') : '';
  const fecho = `${preco ? ` Está ${preco}.` : ''}`;
  if (tipo === 'conhecer') {
    if (rec.quer) return `${abre} Vi que você marcou o ${sugestao} para experimentar no nosso site${gosto ? `, e que curte ${gosto}` : ''}. Ele tem ${notas ? notas.replace(/^notas de /, 'notas de ') : 'uma assinatura marcante'}.${fecho} Quer provar?`;
    return `${abre} Vi que você criou a sua conta no nosso site${gosto ? ` e que curte ${gosto}` : ''}. Separei uma sugestão para você: o ${sugestao}${notas ? `, com ${notas}` : ''}.${fecho} Quer conhecer?`;
  }
  if (tipo === 'novidade') {
    return `${abre} Chegou novidade: o ${sugestao}${notas ? `, com ${notas}` : ''}. Pensei em você${gosto ? ` porque você curte ${gosto}` : ''}${ultimoItem ? `, e gostou do ${ultimoItem.replace(/\s+\d+\s?(ml|g)$/i, '')}` : ''}.${fecho} Quer experimentar?`;
  }
  const quando = ultimoItem ? `Faz ${c.dias} ${c.dias === 1 ? 'dia' : 'dias'} que você levou o ${ultimoItem} e lembrei de você.` : 'Lembrei de você.';
  return `${abre} ${quando} ${gosto ? `Como você curte ${gosto}, ` : ''}separei uma sugestão: o ${sugestao}${notas ? `, com ${notas}` : ''}.${fecho} Quer que eu separe um para você?`;
}

// lançamento: uma mensagem para cada pessoa do ranking
function msgLancamento(c, produto, motivos, inspirado, cat) {
  const porque = motivos && motivos.length ? `porque você curte ${juntarMotivos(motivos)}` : 'porque combina com o seu gosto';
  const notas = notasTexto(cat);
  const preco = precoTexto2(cat);
  return `Oi ${primeiroNome(c.nome)}, tudo bem? Aqui é da Sposence. Chegou novidade: o ${produto}${inspirado && !normalNome(inspirado).includes(normalNome(produto)) ? `, inspirado no ${inspirado}` : ''}${notas ? `, com ${notas}` : ''}. Pensei em você ${porque}.${preco ? ` Está ${preco}.` : ''} Quer experimentar?`;
}
const linkZap = (tel, texto) => { const base = telefoneLink(tel); return base ? `${base}?text=${encodeURIComponent(texto)}` : ''; };

/* ----- aba Clientes ----- */
function desenharClientes() {
  const el = $('t-clientes');
  const cabeca = `<header class="ped-cabeca">
      <div><span class="eyebrow">Painel de clientes</span><h2 id="h-clientes">Quem <em>compra</em> de você</h2>
      <p class="ped-lead">O gosto de cada cliente, calculado dos pedidos, e quem vale chamar agora.</p></div>
      <div class="ped-acoes"><div class="troca troca-vista" role="group" aria-label="O que mostrar">
        <button type="button" data-act="cli-vista" data-v="clientes" aria-pressed="${vistaCli === 'clientes'}">Clientes</button>
        <button type="button" data-act="cli-vista" data-v="lancamento" aria-pressed="${vistaCli === 'lancamento'}">Simular lançamento</button></div></div>
    </header>`;
  if (!cli) { el.innerHTML = cabeca + '<p class="legenda">carregando os clientes…</p>'; return; }
  el.classList.toggle('anim', animCli);
  const lista = cli.lista;
  const gastoTotal = lista.reduce((t, c) => t + c.gasto, 0);
  const pedidosTotal = lista.reduce((t, c) => t + c.n_pedidos, 0);
  const recorrentes = lista.filter((c) => c.n_pedidos >= 2).length;
  const metricas = `<div class="ped-resumo">
      <div class="ped-receber"><small>Para chamar agora</small><div class="num">${cli.chamar.length}</div><small>${cli.chamar.length ? 'passaram do ritmo de compra de cada um' : 'ninguém passou do ritmo ainda'}</small></div>
      <div class="ped-abertos"><small>Clientes</small><div class="num">${lista.length}</div><small>${recorrentes} ${recorrentes === 1 ? 'voltou' : 'voltaram'} a comprar</small></div>
      <div class="ped-mes"><small>Ticket médio</small><div class="num">${din(pedidosTotal ? gastoTotal / pedidosTotal : 0)}</div><small>por pedido</small></div>
    </div>`;
  el.innerHTML = cabeca + metricas + (vistaCli === 'lancamento' ? corpoLancamento() : corpoClientes());
  animCli = false;
}

function cartaoChamar(c, i) {
  const s = c.sugestao;
  return `<li><article class="cli-chamar" style="--i:${i}" data-act="cli-abrir" data-id="${esc(c.id)}" tabindex="0" role="button" aria-label="Abrir o cliente ${esc(c.nome)}">
    <div><h4 class="mini-nome">${esc(c.nome || 'Sem nome')}</h4>
    <p class="detalhe">Última compra ${quandoDias(c.dias)}${c.n_pedidos > 1 ? `, costuma comprar a cada ${c.ritmo} dias` : ''}.</p>
    ${s ? `<p class="detalhe" style="margin-top:6px">Sugestão: <b>${esc(s.nome)}</b> ${pilulaAfin(s.rotulo, s.afinidade)}</p>` : ''}</div>
    <button class="btn pequeno primario" type="button" data-act="cli-chamar" data-id="${esc(c.id)}">Chamar</button>
  </article></li>`;
}

function cartaoCliente(c, i) {
  return `<li><article class="cli" style="--i:${i}" data-act="cli-abrir" data-id="${esc(c.id)}" tabindex="0" role="button" aria-label="Abrir o cliente ${esc(c.nome)}">
    <div class="ped-topo"><div><span class="ped-num">${c.lead ? 'contato do site' : `${c.n_pedidos} ${c.n_pedidos === 1 ? 'pedido' : 'pedidos'}, ${dinInt(c.gasto)}`}</span><h3 class="ped-nome">${esc(c.nome || 'Sem nome')}</h3></div>
      ${c.contato.nao_chamar ? '<span class="chip-st" data-st="cancelado">Não chamar</span>' : c.consent === 'sem_aceite' ? '<span class="chip-st" data-st="cancelado">Sem aceite</span>' : c.consent === 'aceitou' ? '<span class="chip-st" data-st="pronto">Aceitou contato</span>' : ''}</div>
    ${barraGosto(c.perfil, c.perfis_todos)}
    ${c.notas.length ? `<p class="chips-notas">${c.notas.map((n) => `<span class="chip">${esc(n.rotulo)}</span>`).join('')}</p>` : ''}
    <div class="ped-pe"><span class="ped-origem">${c.lead ? 'conta criada' : 'última compra'} ${quandoDias(c.dias)}</span>${c.recomendacoes[0] ? `<span class="detalhe">${esc(c.recomendacoes[0].nome)} ${pilulaAfin(c.recomendacoes[0].rotulo, c.recomendacoes[0].afinidade)}</span>` : ''}</div>
  </article></li>`;
}

function corpoClientes() {
  const b = normalNome(filtroCli.busca);
  const lista = cli.lista.filter((c) => (filtroCli.perfil === 'todos' || (c.perfis_todos || []).includes(filtroCli.perfil)) && (!b || normalNome(c.nome + ' ' + c.telefone).includes(b)));
  const filtros = [['todos', 'Todos'], ...PERFIS_ORDEM.map((k) => [k, k[0].toUpperCase() + k.slice(1)])];
  return `
    ${cli.chamar.length ? `<h3 class="sub-titulo" style="margin-top:0">Para chamar agora</h3><p class="detalhe">Quem já passou do ritmo de compra de cada um, com a fragrância que mais combina.</p>
      <ul class="cli-lista cli-chamar-lista">${cli.chamar.slice(0, 6).map(cartaoChamar).join('')}</ul>` : ''}
    <h3 class="sub-titulo">Todos os clientes</h3>
    <div class="busca"><input id="cli-busca" type="search" placeholder="Buscar por nome ou telefone" value="${esc(filtroCli.busca)}" aria-label="Buscar cliente" /></div>
    <div class="filtros" role="group" aria-label="Filtrar pelo gosto">${filtros.map(([k, n]) => `<button type="button" data-cli-perfil="${k}" aria-pressed="${filtroCli.perfil === k}">${n}</button>`).join('')}</div>
    ${lista.length ? `<ul class="cli-lista">${lista.map(cartaoCliente).join('')}</ul>`
      : cli.lista.length ? '<div class="vazio"><span class="simbolo"></span><b>Nenhum cliente nesta busca</b>Tente outro nome ou outro filtro.</div>'
      : '<div class="vazio"><span class="simbolo"></span><b>Os clientes aparecem sozinhos</b>Cada pedido que você registrar com nome ou WhatsApp cria o cliente aqui, com o gosto dele calculado das compras.</div>'}`;
}

/* ----- tela cheia do cliente: o que comprou, o que gosta, o que sugerir, a mensagem ----- */
let msgEstado = { id: null, tipo: 'recompra', rec: null };

const chipsNomes = (rot, nomes, cls) => (nomes.length ? `<p class="conta-rotulo" style="margin-top:16px">${rot}</p><p class="chips-notas" style="margin-top:6px">${nomes.map((n) => `<span class="chip ${cls || ''}">${esc(n)}</span>`).join('')}</p>` : '');
const corpoComprou = (c) => {
  const k = c.conta;
  const usou = k ? k.usou.filter((n) => !c.compras.some((x) => normalNome(x.nome) === normalNome(n))) : [];
  return `${c.compras.length ? `<ul class="comprou">${c.compras.map((x) => `<li><div><b>${esc(x.nome)}</b><small>última vez em ${dataCurta(x.ultima)}/${x.ultima.slice(0, 4)}, ${quandoDias(difDiasCli(x.ultima, est.hoje))}</small></div><span class="qtd-pill">${x.qtd}×</span></li>`).join('')}</ul>`
      : '<p class="detalhe">Ainda não comprou pelos pedidos registrados.</p>'}
    ${chipsNomes('Já usou, segundo a conta do site', usou)}
    ${chipsNomes('Quer experimentar', k ? k.desejos : [], 'chip--ouro')}
    ${chipsNomes('No carrinho do site', k ? k.carrinho || [] : [], 'chip--ouro')}
    ${chipsNomes('Não curte', k ? k.naocurte || [] : [], 'chip--nao')}`;
};
const corpoGostos = (c) => {
  const top = c.gostos || [];
  return `${Object.keys(c.perfil).length ? barraGosto(c.perfil) : ''}
    ${top.length ? `<ul class="gostos">${top.map((g) => `<li><span>${esc(g.rotulo)}</span><div class="pg-barra" aria-hidden="true"><i style="--p:${(g.pct / 100).toFixed(2)}"></i></div><b>${g.pct}</b></li>`).join('')}</ul>
      <p class="detalhe" style="margin-top:12px">Calculado das compras e do que a pessoa marcou na conta. O 100 é o gosto mais forte dela.</p>` : '<p class="detalhe">Ainda não dá para saber: faltam compras ou preferências na conta.</p>'}`;
};
const corpoConta = (c) => secaoConta(c).replace(/^<section class="sec primeira"><h3>Conta no site<\/h3>/, '').replace(/<\/section>$/, '');

const blocoCli = (id, icone, titulo, meta, corpo) => `<section class="fe-acc cli-bloco" data-fe="${id}">
  <button type="button" class="fe-topo" data-act="fe-acc" aria-expanded="false" aria-controls="cb-${id}">
    <i class="ph ${icone} fe-ic" aria-hidden="true"></i>
    <span class="fe-tx"><span class="fe-nome">${titulo}</span>${meta ? `<span class="fe-sub"><span>${meta}</span></span>` : ''}</span>
    <span></span><span class="fe-seta" aria-hidden="true">${SETA_MAIS}</span>
  </button>
  <div class="fe-corpo" id="cb-${id}"><div class="fe-in"><div class="cli-corpo-in">${corpo}</div></div></div></section>`;

function listaSugestoes(c, sel) {
  const lista = c.recomendacoes.slice(0, 3);
  if (!lista.length) return '<p class="detalhe">Ainda não há compras ou preferências para sugerir um perfume.</p>';
  return `<ul class="sug">${lista.map((r) => `<li class="${r.id === sel ? 'sel' : ''}"><span class="sug-foto" style="background-image:url('${esc(imgCat(r.id))}')"></span>
    <div><b>${esc(r.nome)}</b> ${pilulaAfin(r.rotulo, r.afinidade)}${r.quer ? ' <span class="chip chip--ouro">Pediu para experimentar</span>' : ''}
      <small>${r.motivos.length ? 'combina com ' + esc(r.motivos.join(' e ')) : 'sem motivo claro ainda'}${r.ja_comprou ? ', ela já tem' : ''}${r.disponivel ? '' : ', sem estoque agora'}</small></div>
    <button class="btn pequeno${r.id === sel ? ' primario' : ''}" type="button" data-act="cli-usar" data-id="${esc(c.id)}" data-prod="${esc(r.id)}">${r.id === sel ? 'Na mensagem' : 'Usar'}</button></li>`).join('')}</ul>`;
}

function composerMensagem(c, tipo, rec) {
  const texto = msgCliente(c, tipo, rec);
  const pode = c.telefone && telefoneLink(c.telefone) && c.consent !== 'sem_aceite';
  const tipos = [['recompra', 'Recompra'], ['novidade', 'Novidade'], ['conhecer', 'Conhecer']];
  return `<div class="cli-msg" id="cli-sec-msg"><div class="troca" role="group" aria-label="Tipo de mensagem">${tipos.map(([k, n]) => `<button type="button" data-act="cli-tipo" data-id="${esc(c.id)}" data-tipo="${k}" aria-pressed="${tipo === k}">${n}</button>`).join('')}</div>
    <label for="cli-msg">Você revisa e envia. Nada sai sozinho.</label>
    <textarea id="cli-msg" data-cli="${esc(c.id)}" style="min-height:150px">${esc(texto)}</textarea>
    <div class="grade2" style="margin-top:12px;gap:10px">
      ${pode ? `<a class="btn primario" id="cli-zap" href="${esc(linkZap(c.telefone, texto))}" target="_blank" rel="noopener">Abrir no WhatsApp</a>` : `<span class="btn" aria-disabled="true" style="opacity:.5">${c.consent === 'sem_aceite' ? 'Não aceitou contato' : 'Sem telefone'}</span>`}
      <button class="btn" type="button" data-act="cli-chamei" data-id="${esc(c.id)}">Marquei como chamado</button></div>
    <button class="link" type="button" data-act="cli-copiar" style="margin-top:8px">Copiar o texto</button>
    ${c.contato.ultimo ? `<p class="detalhe" style="margin-top:8px">Última vez chamado em ${dataCurta(c.contato.ultimo)}.</p>` : ''}</div>`;
}

function abrirCliente(id, foco) {
  const c = cli && cli.lista.find((x) => x.id === id);
  if (!c) return;
  const dlg = $('cli-tela');
  const mesmo = dlg.open && dlg.dataset.cli === id;
  const rolagem = mesmo ? dlg.scrollTop : 0;
  const abertas = mesmo ? [...dlg.querySelectorAll('.fe-acc.aberto')].map((x) => x.dataset.fe) : [];
  dlg.dataset.cli = id;
  if (msgEstado.id !== id) {
    const primeira = c.recomendacoes.find((r) => r.disponivel) || c.recomendacoes[0] || null;
    msgEstado = { id, rec: primeira ? primeira.id : null, tipo: c.lead ? 'conhecer' : (c.dias >= (c.intervalo || 45) ? 'recompra' : 'novidade') };
  }
  const rec = c.recomendacoes.find((r) => r.id === msgEstado.rec) || null;
  const curte = (c.gostos || []).slice(0, 3).map((g) => g.rotulo.replace(/^perfumes /, ''));
  $('cli-corpo').innerHTML = `
    <header class="tela-topo">
      <button class="voltar" type="button" data-act="cli-fechar" style="margin:0">← Clientes</button>
      <div class="tela-id"><h2>${esc(c.nome || 'Sem nome')}</h2>
        <p class="legenda">${c.telefone ? esc(c.telefone) + ', ' : ''}${c.lead ? 'contato do site' : `cliente desde ${dataCurta(c.primeira)}/${c.primeira.slice(0, 4)}`}</p></div>
      ${c.consent === 'aceitou' ? '<span class="chip-st" data-st="pronto">Aceitou contato</span>' : c.consent === 'sem_aceite' ? '<span class="chip-st" data-st="cancelado">Sem aceite</span>' : ''}
    </header>
    <div class="tela-in">
      <div class="cli-resumo">
        <div class="faixa faixa--3">
          <div><b>${c.n_pedidos}</b><span>${c.n_pedidos === 1 ? 'pedido' : 'pedidos'}</span></div>
          <div><b>${dinInt(c.gasto)}</b><span>gasto no total</span></div>
          <div><b>${c.ultima ? (c.dias === 0 ? 'hoje' : c.dias + ' d') : 'sem compra'}</b><span>${c.ultima ? 'desde a última compra' : 'ainda não comprou'}</span></div>
        </div>
        ${curte.length ? `<p class="cli-curte">Curte <b>${esc(curte.join(', '))}</b></p>` : ''}
      </div>
      <div class="cli-grade">
        <section class="tela-card cli-acao"><h3>O que <em>sugerir</em></h3>
          ${listaSugestoes(c, msgEstado.rec)}
          ${composerMensagem(c, msgEstado.tipo, rec)}</section>
        <div class="cli-blocos">
          ${blocoCli('comprou', 'ph-shopping-bag', 'Já comprou', `${c.compras.length} ${c.compras.length === 1 ? 'perfume' : 'perfumes'}`, corpoComprou(c))}
          ${blocoCli('gostos', 'ph-drop', 'Gostos em detalhe', '', corpoGostos(c))}
          ${blocoCli('conta', 'ph-user-circle', 'Conta no site', c.conta ? 'tem conta' : 'sem conta', corpoConta(c))}
          ${c.pedidos.length ? blocoCli('pedidos', 'ph-package', 'Pedidos', `${c.pedidos.length}`, `<ul class="det-itens">${c.pedidos.map((p) => `<li><button class="link" type="button" data-act="cli-pedido" data-id="${esc(p.id)}">nº ${p.numero}, ${dataCurta(p.data)}</button><b>${din(p.total)}</b></li>`).join('')}</ul>`) : ''}
          ${blocoCli('notas', 'ph-note-pencil', 'Anotações', c.contato.notas ? 'com anotação' : '', `<form data-form="cli-dados" data-id="${esc(c.id)}">
            <textarea name="notas" style="min-height:84px" maxlength="600" placeholder="Ex.: prefere ser chamada à tarde; presenteia a irmã">${esc(c.contato.notas)}</textarea>
            <label class="lembrar"><input type="checkbox" name="nao_chamar"${c.contato.nao_chamar ? ' checked' : ''} /> Não chamar (pediu para parar ou não quer promoções)</label>
            <button class="btn cheio" type="submit">Salvar anotações</button></form>`)}
        </div>
      </div>
    </div>`;
  abertas.forEach((k) => { const b = dlg.querySelector(`.fe-acc[data-fe="${k}"]`); if (b) { b.classList.add('aberto'); b.querySelector('.fe-topo').setAttribute('aria-expanded', 'true'); } });
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = foco === 'mensagem' ? Math.max(0, $('cli-sec-msg').offsetTop - 120) : rolagem;
}

function escolherSugestao(id, prodId) { msgEstado = { ...msgEstado, id, rec: prodId }; abrirCliente(id); }
function mudarTipoMensagem(id, tipo) { msgEstado = { ...msgEstado, id, tipo }; abrirCliente(id); }

/* ----- simulador de lançamento ----- */
function opcoesLancamento() {
  const lotes = est.maturacao.filter((l) => l.status === 'maturando');
  return `<optgroup label="Perfumes do catálogo">${est.perfumes.map((p) => `<option value="p:${esc(p.id)}">${esc(p.nome)}</option>`).join('')}</optgroup>
    ${lotes.length ? `<optgroup label="Em maturação">${lotes.map((l) => `<option value="m:${esc(l.id)}">${esc(l.nome)}, pronto em ${dataBR(l.previsto)}</option>`).join('')}</optgroup>` : ''}
    <option value="outro">Outra fragrância (descrever o perfil)</option>`;
}
function corpoLancamento() {
  const sel = (id, atual, lista) => `<select id="${id}" data-lanc>${lista.map(([k, n]) => `<option value="${k}"${k === atual ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
  const custom = lancForm.alvo === 'outro' || lancForm.alvo.startsWith('m:') && !loteComProduto(lancForm.alvo.slice(2));
  return `
    <section class="quadro" style="margin-top:0">
      <h3>Quem chamar para um lançamento</h3>
      <p class="ajuda">Escolha a fragrância que vai lançar. O painel compara com o gosto de cada cliente e mostra quem tem mais chance de comprar.</p>
      <label for="lanc-alvo">Fragrância</label>
      <select id="lanc-alvo" data-lanc>${opcoesLancamento().replace(`value="${esc(lancForm.alvo)}"`, `value="${esc(lancForm.alvo)}" selected`)}</select>
      <div id="lanc-custom"${custom ? '' : ' hidden'}>
        <div class="grade2">
          <div><label for="lanc-perfil">Perfil</label>${sel('lanc-perfil', lancForm.perfil, PERFIS_ORDEM.map((k) => [k, k[0].toUpperCase() + k.slice(1)]))}</div>

async function rodarLancamento() {
  let corpo;
  const alvo = lancForm.alvo;
  if (alvo.startsWith('p:')) corpo = { produto_id: alvo.slice(2) };
  else if (alvo.startsWith('m:') && loteComProduto(alvo.slice(2))) corpo = { produto_id: est.maturacao.find((l) => l.id === alvo.slice(2)).produto_id };
  else {
    const lote = alvo.startsWith('m:') ? est.maturacao.find((l) => l.id === alvo.slice(2)) : null;
    corpo = { nome: lote ? lote.nome : '', perfil: lancForm.perfil, publico: lancForm.publico, notas: lancForm.notas };
  }
  try {
    const d = await api('lancamento', corpo);
    lanc = d.lancamento;
    const p = corpo.produto_id && est.catalogo.find((x) => x.id === corpo.produto_id);
    lanc.inspirado = p ? p.inspirado : '';
    lanc.cat = p || null;
    const el = $('lanc-res'); if (el) el.innerHTML = resultadoLancamento();
  } catch (e) { falhou(e); }
}

      ${p.descricao ? `<p class="detalhe">${esc(p.descricao)}</p>` : ''}</section>` : ''}

function indiceBusca() {
  const itens = [];
  for (const p of est.catalogo) {
    const ctl = est.produtos.find((x) => x.id === p.id);
    if (p.categoria === 'perfumes') {
      itens.push({ grupo: 'Fragrâncias', titulo: p.nome, chip: p.perfil || '',
        sub: [p.inspirado ? 'inspirado em ' + p.inspirado : '', ctl ? `${nf.format(ctl.ml_total)} ml` : '', p.status !== 'visivel' ? (p.status === 'oculto' ? 'oculto no site' : 'esgotado') : ''].filter(Boolean).join(' · '),
        hay: normalNome([p.nome, p.inspirado, p.perfil, (p.tags || []).join(' '), p.notas ? Object.values(p.notas).join(' ') : '', p.descricao].join(' ')), run: () => folhaFragrancia(p.id) });
    } else {
      itens.push({ grupo: 'Produtos', titulo: p.nome, chip: p.rotulo, sub: precoTexto(p), hay: normalNome(p.nome + ' ' + p.rotulo), run: () => { irPara('catalogo'); filtroCatalogoPara(p.nome); } });
    }
  }
  for (const ped of est.pedidos.slice(0, 200)) {
    itens.push({ grupo: 'Pedidos', titulo: `nº ${ped.numero}, ${(ped.cliente && ped.cliente.nome) || 'sem nome'}`, chip: ROTULO_ETAPA[ped.status],
      sub: `${din(ped.total)} · ${resumoItens(ped)}`,
      hay: normalNome(`${ped.numero} ${ped.cliente ? ped.cliente.nome + ' ' + ped.cliente.telefone : ''} ${ped.itens.map((i) => i.nome).join(' ')} ${ROTULO_ETAPA[ped.status]}`), run: () => { irPara('pedidos'); abrirPedido(ped.id); } });
  }
  if (cli) for (const c of cli.lista) {
    itens.push({ grupo: 'Clientes', titulo: c.nome || 'Sem nome', chip: c.dominante || '', sub: `${c.n_pedidos} ${c.n_pedidos === 1 ? 'pedido' : 'pedidos'} · última compra ${quandoDias(c.dias)}`, hay: normalNome(`${c.nome} ${c.telefone} ${c.dominante || ''}`), run: () => { irPara('clientes'); abrirCliente(c.id); } });
  }
  for (const i of est.insumos) itens.push({ grupo: 'Estoque', titulo: i.nome, chip: '', sub: `${nf.format(i.qtd)} ${i.unidade}${i.acabando ? ' · acabando' : ''}`, hay: normalNome(i.nome + ' insumo'), run: () => irEstoque('insumos') });
  for (const l of est.maturacao.filter((x) => x.status === 'maturando')) itens.push({ grupo: 'Estoque', titulo: `${l.nome}, em maturação`, chip: '', sub: `${nf.format(l.ml)} ml · pronto em ${dataBR(l.previsto)}`, hay: normalNome(l.nome + ' maturacao lote'), run: () => irEstoque('maturacao') });
  return itens.concat(comandos());
}
function filtroCatalogoPara(nome) { filtro.busca = nome; filtro.cat = 'todos'; desenharCatalogo(); }

const LIMITES = { 'Fragrâncias': 8, Produtos: 4, Pedidos: 5, Clientes: 5, Estoque: 4, 'Opções': 7, 'Configurações': 3 };
const ORDEM_GRUPOS = ['Fragrâncias', 'Produtos', 'Pedidos', 'Clientes', 'Estoque', 'Opções', 'Configurações'];
function buscar(q) {
  const tokens = normalNome(q).split(/\s+/).filter(Boolean);
  const todosItens = indiceBusca();
  let achados;
  if (!tokens.length) achados = todosItens.filter((i) => i.grupo === 'Fragrâncias').slice(0, 5).concat(todosItens.filter((i) => i.grupo !== 'Fragrâncias' && (i.grupo === 'Opções' || i.grupo === 'Configurações')).slice(0, 8));
  else {
    achados = todosItens.map((i) => {
      if (!tokens.every((t) => i.hay.includes(t))) return null;
      const tit = normalNome(i.titulo);
      return { ...i, s: 1 + (tit.startsWith(tokens[0]) ? 3 : tit.includes(tokens[0]) ? 2 : 0) };
    }).filter(Boolean).sort((a, b) => b.s - a.s || a.titulo.localeCompare(b.titulo, 'pt-BR'));
  }
  const cont = {};
  const lim = achados.filter((i) => { cont[i.grupo] = (cont[i.grupo] || 0) + 1; return tokens.length ? cont[i.grupo] <= LIMITES[i.grupo] : true; });
  return ORDEM_GRUPOS.flatMap((g) => lim.filter((i) => i.grupo === g));
}

function desenharBusca() {
  buscaItens = buscar($('busca-q').value);
  buscaSel = Math.min(buscaSel, Math.max(0, buscaItens.length - 1));
  let ultimo = '';
  const html = buscaItens.map((i, n) => {
    const cab = i.grupo !== ultimo ? `<li class="busca-grupo" role="presentation">${esc(i.grupo)}</li>` : '';
    ultimo = i.grupo;
    return `${cab}<li role="option" id="busca-i${n}" class="busca-item" data-n="${n}" aria-selected="${n === buscaSel}">
      <div><span class="busca-t">${esc(i.titulo)}</span>${i.sub ? `<span class="busca-s">${esc(i.sub)}</span>` : ''}</div>${i.chip ? `<span class="chip">${esc(i.chip)}</span>` : ''}</li>`;
  }).join('');
  $('busca-res').innerHTML = html || '<li class="busca-vazio" role="presentation">Nada encontrado. Tente o nome da fragrância, uma nota (baunilha, cítrico) ou uma opção como "tema" ou "senha".</li>';
  $('busca-q').setAttribute('aria-activedescendant', buscaItens.length ? `busca-i${buscaSel}` : '');
}
function abrirBusca() {
  if (!est || $('app').hidden) return;
  if (!$('busca-geral').open) $('busca-geral').showModal();
  $('busca-q').value = ''; buscaSel = 0; desenharBusca(); $('busca-q').focus();
  if (cliVelho) carregarClientes().then(() => { if ($('busca-geral').open) desenharBusca(); });
}
function escolherBusca(n) {
  const item = buscaItens[n];
  if (!item) return;
  $('busca-geral').close();
  setTimeout(() => item.run(), 60);
}
function moverBusca(d) {
  if (!buscaItens.length) return;
  buscaSel = (buscaSel + d + buscaItens.length) % buscaItens.length;
  document.querySelectorAll('#busca-res [role=option]').forEach((el) => el.setAttribute('aria-selected', Number(el.dataset.n) === buscaSel));
  const el = $('busca-i' + buscaSel); if (el) el.scrollIntoView({ block: 'nearest' });
  $('busca-q').setAttribute('aria-activedescendant', 'busca-i' + buscaSel);
}

$('busca-btn').addEventListener('click', abrirBusca);
$('busca-q').addEventListener('input', () => { buscaSel = 0; desenharBusca(); });
$('busca-q').addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowDown') { ev.preventDefault(); moverBusca(1); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); moverBusca(-1); }
