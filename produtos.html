<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Produtos | Sposence</title>
  <link rel="shortcut icon" href="ID. VISUAL SPOSENCE/Imagens/LOGOS/Logo Secundária/Logo Secundária- SPOSENCE-15.png" type="image/x-icon" />
  <meta name="description" content="Perfumes de 27% de essência, body splashes, cuidados corporais e acessórios Sposence. Filtre por perfil olfativo e tamanho." />
  <link rel="preload" as="font" href="fonts/Philosopher-Regular.woff2" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="img/simbolo-loader.png" />
  <link rel="preload" as="image" href="img/logo-navbar.png" />
  <!-- Abertura da primeira visita (símbolo + nome da marca); define window.spLoaded -->
  <script src="js/intro.js?v=20261014c"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=20261014c" />
  <link rel="stylesheet" href="css/animations.css?v=20261014c" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="css/brand.css?v=20261014c" />
  <link rel="stylesheet" href="css/pages.css?v=20261014c" />
</head>
<body class="sp">

  <div id="scroll-progress"></div>
  <div id="navbar-mount"></div>
  <div id="cart-mount"></div>
  <div id="toast-mount"></div>

  <main>

    <section class="sp-hero sp-hero--tight">
      <div class="sp-hero__mark" aria-hidden="true"><img src="ID. VISUAL SPOSENCE/Imagens/LOGOS/Logo Secundária/Logo Secundária- SPOSENCE-14.png" alt="" decoding="async"></div>
      <div class="h-wrap">
        <div class="sp-hero__copy">
          <span class="h-eyebrow" data-intro>Catálogo</span>
          <h1 class="sp-hero__title">Todas as <em>essências.</em></h1>
          <p class="h-lead" data-intro>Perfumes com 27% de essência pura, body splashes, cuidados corporais e acessórios. Filtre pelo que combina com você.</p>
        </div>
      </div>
    </section>

    <section class="sp-catalog" aria-label="Produtos">
      <div class="h-wrap">
        <div class="sp-filters">
          <div class="sp-filters__row">
            <div class="h-tabs" role="group" aria-label="Categoria" id="cat-tabs"></div>
            <label class="sp-search">
              <span class="h-sr-only">Buscar fragrância</span>
              <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
              <input type="search" id="search-input" placeholder="Buscar fragrância, inspiração..." autocomplete="off" />
            </label>
          </div>
          <div class="sp-chips" role="group" aria-label="Perfil e tamanho" id="profile-chips"></div>
        </div>

        <p class="sp-count" id="result-count" aria-live="polite"></p>
        <div class="h-grid" id="products-grid" style="margin-top:1.25rem"></div>
      </div>
    </section>

  </main>

  <div id="footer-mount"></div>

  <script src="js/data.js?v=20261014c"></script>
  <script src="/api/catalogo.js"></script>
  <script src="js/estoque-online.js?v=20261020"></script>
  <script src="js/app.js?v=20261021"></script>
  <script>
    document.getElementById('navbar-mount').innerHTML = buildNavbar('produtos.html');
    document.getElementById('cart-mount').innerHTML   = buildCart();
    document.getElementById('toast-mount').innerHTML  = buildToastContainer();
    document.getElementById('footer-mount').innerHTML = buildFooter();

    const CATEGORIES = [
      { id: 'all', label: 'Todos' },
      { id: 'perfumes', label: 'Perfumes' },
      { id: 'body_splashes', label: 'Body Splashes' },
      { id: 'skincare', label: 'Cuidados' },
      { id: 'merchandise', label: 'Acessórios' },
    ];
    const PROFILE_ICONS = { frescos: 'ph-waves', doces: 'ph-cookie', noturnos: 'ph-moon-stars', elegantes: 'ph-sparkle' };
    const AUDIENCE = [
      { id: 'masculino', label: 'Masculino' },
      { id: 'feminino', label: 'Feminino' },
      { id: 'compartilhavel', label: 'Unissex' },
    ];
    const SIZES = ['30ml', '50ml', '100ml'];
    const ALL = getAllProducts();

    // ---- Estado (vem da URL, volta para a URL) ----
    const params = new URLSearchParams(location.search);
    const state = {
      cat: CATEGORIES.some(c => c.id === params.get('cat')) ? params.get('cat') : 'all',
      profile: params.get('profile') || 'all',
      size: params.get('size') || 'all',
      q: (params.get('search') || '').trim(),
    };
    const searchInput = document.getElementById('search-input');
    searchInput.value = state.q;

    function syncUrl() {
      const p = new URLSearchParams();
      if (state.cat !== 'all') p.set('cat', state.cat);
      if (state.profile !== 'all') p.set('profile', state.profile);
      if (state.size !== 'all') p.set('size', state.size);
      if (state.q) p.set('search', state.q);
      history.replaceState(null, '', `${location.pathname}${p.toString() ? '?' + p : ''}`);
    }

    // ---- Busca tolerante a erro de digitação ----
    const normalize = (s) => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    function distance(a, b) {
      const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
      for (let j = 1; j <= b.length; j++) dp[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
        }
      }
      return dp[a.length][b.length];
    }
    function fuzzy(target, pattern) {
      const t = normalize(target), p = normalize(pattern);
      if (t.includes(p)) return true;
      if (p.length < 3) return false;
      return t.split(/\s+/).some(word => {
        if (word.length < 3) return word === p;
        return distance(word.slice(0, p.length), p) <= (p.length > 6 ? 2 : 1);
      });
    }
    const matchesSearch = (p) => !state.q || fuzzy(p.name, state.q) || fuzzy(p.inspired_by, state.q) || (p.tags || []).some(t => fuzzy(t, state.q));
    const matchesProfile = (p) => state.profile === 'all'
      || (state.profile === 'ultimas' ? !!p.last_units && !spSoldOut(p)
        : AUDIENCE.some(a => a.id === state.profile) ? (p.tags || []).includes(state.profile) : p.profile === state.profile);
    const matchesSize = (p) => state.size === 'all' || (p.variants || []).some(v => v.size === state.size);

    const filtered = (cat = state.cat) => ALL.filter(p =>
      (cat === 'all' || p.category === cat) && matchesProfile(p) && matchesSize(p) && matchesSearch(p));

    // ---- Filtros ----
    function renderFilters() {
      document.getElementById('cat-tabs').innerHTML = CATEGORIES.map(c => `
        <button type="button" class="h-tab" data-cat="${c.id}" aria-pressed="${state.cat === c.id}">
          ${c.label}<small>${filtered(c.id).length}</small>
        </button>`).join('');

      // Perfil, público e tamanho só fazem sentido para perfumes
      const perfumeish = state.cat === 'all' || state.cat === 'perfumes';
      const chip = (key, id, label, icon) => `
        <button type="button" class="sp-chip" data-${key}="${id}" aria-pressed="${state[key] === id}">
          ${icon ? `<i class="ph ${icon}" aria-hidden="true"></i>` : ''}${label}
        </button>`;
      document.getElementById('profile-chips').innerHTML = perfumeish ? [
        chip('profile', 'all', 'Todos os perfis'),
        chip('profile', 'ultimas', 'Últimas unidades', 'ph-hourglass-medium'),
        ...SPOSENCE_DATA.fragrance_profiles.map(p => chip('profile', p.id, p.label, PROFILE_ICONS[p.id])),
        '<span class="sp-chips__sep" aria-hidden="true"></span>',
        ...AUDIENCE.map(a => chip('profile', a.id, a.label)),
        '<span class="sp-chips__sep" aria-hidden="true"></span>',
        chip('size', 'all', 'Qualquer tamanho'),
        ...SIZES.map(s => chip('size', s, s)),
      ].join('') : '';
    }

    // ---- Grade ----
    let firstRender = true;
    function render() {
      renderFilters();
      const products = filtered();
      const grid = document.getElementById('products-grid');
      document.getElementById('result-count').innerHTML =
        `<strong>${products.length}</strong> ${products.length === 1 ? 'produto encontrado' : 'produtos encontrados'}`;

      grid.innerHTML = products.length
        ? products.map(p => spCard(p, { sizes: true })).join('')
        : `<div class="sp-empty">
             <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
             <p>Nenhum produto encontrado com esses filtros.</p>
             <button type="button" class="h-btn h-btn--ghost" data-reset>Limpar filtros</button>
           </div>`;

      // Na primeira carga a grade entra com a página; depois, a cada filtro, entra na hora
      if (window.SpMotion && !firstRender) { SpMotion.stagger(grid, { now: true }); SpMotion.refresh(); }
      firstRender = false;
      syncUrl();
    }

    document.querySelector('.sp-filters').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      // Clicar de novo num filtro ativo desfaz o filtro (volta para "todos")
      const toggle = (current, picked) => (current === picked ? 'all' : picked);
      if (b.dataset.cat) {
        state.cat = toggle(state.cat, b.dataset.cat);
        if (!['all', 'perfumes'].includes(state.cat)) { state.profile = 'all'; state.size = 'all'; }
      }
      else if (b.dataset.profile) state.profile = toggle(state.profile, b.dataset.profile);
      else if (b.dataset.size) state.size = toggle(state.size, b.dataset.size);
      else return;
      render();
    });
    document.getElementById('products-grid').addEventListener('click', (e) => {
      if (!e.target.closest('[data-reset]')) return;
      Object.assign(state, { cat: 'all', profile: 'all', size: 'all', q: '' });
      searchInput.value = '';
      render();
    });
    let typing;
    searchInput.addEventListener('input', () => {
      clearTimeout(typing);
      typing = setTimeout(() => { state.q = searchInput.value.trim(); render(); }, 160);
    });

    render();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/motion.js?v=20261014c"></script>
  <script>
    SpMotion.auto();
    SpMotion.stagger(document.getElementById('products-grid'));
  </script>
</body>
</html>
